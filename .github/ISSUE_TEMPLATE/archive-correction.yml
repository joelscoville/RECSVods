name: Archive correction
description: Report a playback/audio problem or suggest a correction to archive metadata.
title: 'Archive correction: '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve RECS Replay. This repository issue is visible to people with repository access. It is a suggestion, not an automatic edit or approval.
        Keep the prefilled archive identifiers. Do not paste search history, saved playback progress, private filesystem paths, raw evidence, credentials or private editorial notes.
  - type: dropdown
    id: problem
    attributes:
      label: What needs correcting?
      options:
        - chapter time
        - title
        - scripture
        - speaker
        - topic
        - playback or audio
        - other
    validations:
      required: true
  - type: input
    id: service-id
    attributes:
      label: Service ID
    validations:
      required: true
  - type: input
    id: video-id
    attributes:
      label: Video ID(s)
      description: The physical YouTube upload, or uploads for a whole-service report.
  - type: input
    id: chapter-id
    attributes:
      label: Chapter ID
      description: Leave the whole-recording/service marker if no chapter was selected.
  - type: textarea
    id: timestamps
    attributes:
      label: Recording timestamps
      description: Bounds in the upload’s own clock (MM:SS or HH:MM:SS, optional fractional seconds), not your saved playback position. Add a proposed correction below if needed.
  - type: input
    id: page
    attributes:
      label: Archive page
      description: A canonical archive link or deployment-relative path. Do not paste a search query or your current browser URL.
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction and evidence
      description: Describe the issue and proposed change. Give a public recording timestamp or reference where possible; keep uncertainty explicit. Use scripture references, not ESV verse text.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        A human checks the recording and proposed change in `pnpm build:preview`. Interpretation changes return the logical service to `needs_review`; merging code does not approve content.
        After reviewing the entire service, only a human may run `pnpm editorial:approve -- <service-id> --reviewer <name>`. The approval-only commit records that separate decision.
