# Every case runs in exact and actual-local-embedding hybrid modes.
# Lists are alternatives within a field; supplied fields must all match.
# Date cases also require ALL AND ONLY eligible passages on expectedDate,
# including multiple distinct services if that is what the source contains.
cases:
  - id: romans-13
    milestone: 2
    kind: rank
    query: Romans 13
    acceptableServiceIds: ['2020-09-27']
    reason: Scripture match (reference)
    maxRank: 1
    note: Authority's trusted reference must outrank incidental mentions.
  - id: romans-alias
    milestone: 2
    kind: rank
    query: Rom 13
    acceptableServiceIds: ['2020-09-27']
    reason: Scripture match (reference)
    maxRank: 1
    note: Common book abbreviation uses the shared reference parser.
  - id: speaker-yong
    milestone: 2
    kind: rank
    query: Yong Teck Meng
    acceptableServiceIds: ['2020-09-27', '2020-07-19']
    speaker: Rev. Yong Teck Meng
    reason: Speaker match
    maxRank: 3
    note: Either trusted historical sermon is valid as the corpus grows; an incidental name is insufficient.
  - id: government-question
    milestone: 2
    kind: rank
    query: How should Christians relate to government?
    acceptableServiceIds: ['2020-09-27']
    acceptablePassageIds: [p0927-romans-government, p0927-government-allegiance]
    maxRank: 3
    note: Evidence-backed relevant segments, not any greeting in Authority.
  - id: abraham-isaac
    milestone: 2
    kind: rank
    query: Abraham and Isaac
    acceptableServiceIds: ['2025-11-02']
    acceptablePassageIds: [p1102-abraham-isaac]
