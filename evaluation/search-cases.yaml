# Every case runs in exact and actual-local-embedding hybrid modes.
# Where natural wording is not in concise metadata, exactQuery exercises spoken
# keywords separately. The original question and rank bound still gate real hybrid
# search. Do not claim an exactQuery result as lexical recall of the full question.
# Lists are alternatives within a field; supplied fields must all match.
# Targets retain the containing chapters of the frozen passage expectations.
# Date cases also require ALL AND ONLY eligible chapters on expectedDate,
# including multiple distinct services if that is what the source contains.
