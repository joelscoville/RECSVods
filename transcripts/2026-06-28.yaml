    transcript: 'We thank you, God, for speaking to us with your word. And we acknowledge that we are people who are seriously far away from you because we are so influenced by so many things in life: our culture, our biases, our own self-interest and many, many things. So much so that for many of us the truth is not so important. It is just something that we want to think about, nice to have, kind of a thing. But from scripture, may we see clearly that exactly as senior pastor says, apart from God himself, the truth is the biggest thing on earth. May we then learn to embrace the truth because [scripture phrase omitted], and live our life in accordance to the truth as revealed by your word so that we get restored to the kind of life that you want us to have. Not a life just like anybody else, [scriptural comparison omitted], but a life that is what you have meant for us to have, a life that is victorious, a life that is joyful, [scriptural image omitted], that will shine forth for all to see that Jesus Christ is Lord. Listen to our prayers. In Jesus’ name we pray. Amen.'
