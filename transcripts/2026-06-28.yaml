  - id: p0628-farewell-intro
    video_id: k27dmsPvmG8
    section_id: s0628-intro
    start: 1772.18
    end: 1819.42
    type: sermon
    title: Taking time with Jesus’ farewell discourse
    summary: The preacher explains why he is slowing down through the farewell discourse and invites questions through Ask Me Anything.
    questions: ['Why does the preacher want to study the farewell discourse in depth?']
    topics: []
    scripture: ['John 14:25-31']
    transcript: 'In the midst of all these things, in a chapter that is very profound and very difficult, so I am going to take some time and opportunity to dig a little bit deeper into it. Because we are talking about Jesus Christ giving the last discourse, the farewell discourse before he was going to be crucified. And so within the next few chapters there are so many very important teachings that are not found anywhere else in the Gospels, and so therefore we have a good opportunity to dig deep into it. And so I also want to encourage you therefore to take the opportunity to ask questions, in the Ask Me Anything questions, and you can put your written question in the offering box. The question that is asked this week that is relevant to this is a very good question and also linked with our teaching today.'
    confidence: 0.91
  - id: p0628-peter-judas
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 1819.58
    end: 1888
    type: sermon
    title: Peter and Judas — sin, repentance and forgiveness
    summary: The preacher answers a question comparing Peter and Judas, emphasizing his understanding that Peter repented and sought forgiveness.
    questions: ['How does the preacher compare Peter and Judas?']
    topics: [repentance]
    scripture: ['John 13']
    transcript: 'Is there a difference between the weight of sin, or the weight of sin committed by Peter versus Judas Iscariot? We were talking about this on chapter 13, when Jesus Christ revealed that Judas is going to betray him, [scripture quotation omitted] and then he left. And then after that, in the last part of chapter 13, Jesus told Peter that [prediction of denial paraphrased in the recording; quotation omitted]. And so both have this [unclear phrase], quite very severe. One is a betrayer of Jesus Christ for 30 pieces of silver. The other one is just outright denier three times. And so, good question. We sort of talked about this a little bit because senior pastor took this to bring out one of the other important lesson points, and that is the difference between Peter and Judas Iscariot was that Peter asked for forgiveness and repented, whereas Judas did not. And so therefore one of the lesson points is that it does not matter who you are, if you seek repentance and you seek forgiveness, you will be forgiven. That is the teaching of the Bible.'
    confidence: 0.88
    review_notes: ['Speaker’s interpretation, not an independent assertion about the two figures; question confirmed on 2000s slide.']
  - id: p0628-transactional
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 1888.84
    end: 1964.32
    type: sermon
    title: A transactional view of wrongdoing
    summary: The preacher contrasts his interpretation with transactional thinking and describes Roman Catholic confession as an illustration of his argument.
    questions: ['What does the preacher mean by transactional thinking about sin?']
    topics: [repentance]
    scripture: []
    transcript: 'But then is there a difference between the two weightage, as far as sin is concerned? Now, the normal thinking is there must be, because after all one caused Jesus Christ to be crucified. Another one is just, you know, he denied and then later he repented. And most religions think of it that way. So last week, we talked about how many things are transactional in nature, in religion. Because that is the way we live our life too, right? You treat me well, I treat you well as well. You do not treat me well, then why should I treat you well? That is a really normal concept. And in religion, that is very deeply ingrained too. The Roman Catholics, for example, understand this in a transactional manner and weightage manner as well. [The speaker illustrates this with an imagined exchange in a confession booth; dialogue omitted from this excerpt.]'
    confidence: 0.85
    review_notes: ['Description of another tradition is the preacher’s characterization, not verified catechetical information.']
  - id: p0628-weightage
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 1964.32
    end: 2021.34
    type: sermon
    title: Quantitative punishment and everyday legal comparisons
    summary: The preacher extends his imagined confession example and compares differing penalties in civil law with a quantitative view of wrongdoing.
    questions: []
    topics: [repentance]
    scripture: []
    transcript: '[Continuation of the imagined confession example.] The priest will tell you that, okay, you go and recite [prayer name unclear] 365 times, go and give money to the poor, go and do this, do that, apologize to your mother or whatever it is. So depending on what you have done, the list can be very long. So it is a weightage kind of a concept. So this is a quantitative idea that sin has to do with severity and punishment thereof. And of course in our everyday life that is very common too. Like if you go and commit a sin in Singapore, commit a crime, then it depends on what it is that you have done. [An anecdotal legal comparison with unclear wording is omitted.] There is a difference. And the consequences and the punishment thereof are very different too. So those of you who have legal training know that that is the case.'
    confidence: 0.78
    review_notes: ['Imagined penance and legal claims are unverified illustrations, not advice; unclear sexual-offence example at 2002–2013s omitted.']
  - id: p0628-quality-sin
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 2021.68
    end: 2099.88
    type: sermon
    title: Sin as a qualitative problem before God
    summary: The preacher appeals to Matthew 5 and uses a speck in the eye to explain why, in his argument, even a small sin matters before God.
    questions: ['Why does the preacher call sin qualitative rather than quantitative?']
    topics: [repentance]
    scripture: ['Matthew 5']
    transcript: 'However, I must tell you that that is not what the Bible is teaching us. Our Lord Jesus Christ in the Sermon on the Mount, Matthew 5, [scripture paraphrase/quotation about inward wrongdoing omitted; reference only]. And so therefore, what Jesus Christ was pointing out is that the problem of sin is not quantitative in nature, [unclear phrase about large and small], but qualitative in nature. Because, consistent with the teaching today in the sermon later, God is truth, God is purity, God is perfect. God is the ultimate of all perfection that is beyond our understanding because we are all fallen people. And so in the sight of God, there is no such thing as a big sin or a small sin because even the smallest sin cannot be tolerated. So senior pastor likes to use the human eye as an example, that your eye is so sensitive that even the tiniest dirt cannot exist in there. If you have something that flies in the eye, you just simply have to get rid of it. It is not like, okay, it is very small, it does not matter. If it does not matter, you go blind, okay? So it is not like this.'
    confidence: 0.87
  - id: p0628-no-excuse
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 2100.02
    end: 2159.96
    type: sermon
    title: Forgiveness is not an excuse to abandon holiness
    summary: The preacher says that forgiveness of serious wrongdoing should not be turned into an excuse to stop pursuing a holy life.
    questions: ['Why does the preacher reject using universal sinfulness as an excuse?']
    topics: [repentance]
    scripture: []
    transcript: 'You have to not have the tiniest speck of dirt in your eye. [Scripture quotation omitted; reference not announced.] And therefore God cannot tolerate the tiniest sin. It is not possible. So in the sight of God, all sins are the same, whether it is lust in your heart or actual adultery. And at the same time, God can forgive the biggest sinner. And that is the lesson point for Peter and Judas. Having said that, it does not mean then therefore you will conclude that we are all sinners anyway, so it does not matter. [Repeated scripture allusion omitted.] And that is unhappily the mindset that many, many people have, that we are all scumbags anyway, so who cares? There is no need to pursue a holy lifestyle or whatever it is. And so the balance point is very difficult to maintain.'
    confidence: 0.88
  - id: p0628-disillusionment
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 2159.96
    end: 2216.62
    type: sermon
    title: Disillusionment with leaders and differing consequences
    summary: The preacher describes the temptation to become cynical after a leader’s failure, then distinguishes his claim about sin before God from its differing consequences in life.
    questions: []
    topics: [repentance]
    scripture: []
    transcript: 'And I always bring out to you the presence and the work of the devil, always whispering in your ear, telling you that you know better than anybody else anyway. And sometimes it gets very complicated because you discover that your leaders are like that too. And for me personally that is one of the big challenges in ministry. [Named third-party allegation at approximately 2177–2204s omitted pending human verification; not treated as an established fact.] While there is qualitatively no difference in sin in the sight of God, from a quantitative angle there is a difference in the consequences of sin in this lifetime, and this you must remember.'
    confidence: 0.8
    review_notes: ['Omission is explicit rather than silently converting a serious allegation into fact.']
  - id: p0628-illustration-choice
    video_id: k27dmsPvmG8
    section_id: s0628-ama
    start: 2217.04
    end: 2254.24
    type: sermon
    title: Why this illustration also concerns other sins
    summary: The preacher explains his choice of adultery as a vivid illustration while saying that pride, anger and love of money also belong in the discussion.
    questions: []
    topics: [repentance]
    scripture: []
    transcript: 'And so there are many examples I can bring out. I will use adultery as an example because it is the most dramatic and stinging kind of illustration. It does not mean that it does not apply to anything else. Let me again tell you that every time the Bible talks about all these sexual sins, it is always linked with other sins, like pride, like anger, like love of money, that kind of thing. It is all lumped together. So some people correctly point out that, hey, how come you are forever jumping on all these things and you do not go and talk about other things? Yeah, they are right. But for illustration’s sake, I will use this.'
    confidence: 0.91
  - id: p0628-seed
    video_id: k27dmsPvmG8
    section_id: s0628-consequences
    start: 2254.42
    end: 2298
    type: sermon
    title: A seed removed through repentance
    summary: The preacher pictures wrongdoing as a seed taking root and forgiveness as its removal, urging an early response to conviction.
    questions: ['How does the preacher use a seed to illustrate repentance?']
    topics: [repentance]
    scripture: []
    transcript: '[Opening scripture allusion omitted.] It is like a seed of sin that is already planted in your heart, and this seed of course will take root. And so as people of God, what we do is that the Holy Spirit comes and enlightens us, and then we will say, okay, it is not right because I know it is not right and I want to repent. And you pray for forgiveness. Our Lord Jesus Christ will move in and yank out the seed, and you are forgiven. Am I right? You are forgiven. And your forgiveness is total, you know. And so, because it is just a seed with a root, for you it is easy to get over with. Because I have been forgiven. I know I have been forgiven.'
    confidence: 0.9
  - id: p0628-roots
    video_id: k27dmsPvmG8
    section_id: s0628-consequences
    start: 2298.54
    end: 2344.38
    type: sermon
    title: Growing roots and lingering difficulty
    summary: The preacher develops the plant illustration to describe habits that become harder for a person to leave behind, while maintaining his distinction between forgiveness and recovery.
    questions: []
    topics: [repentance]
    scripture: []
    transcript: 'Now, if it is beyond that lust in your heart and you get involved in other things like pornography, like all kinds of different tools that you use to satisfy your lust, the seed actually is more complicated. It not only has a little bit of root, now it takes more root and then maybe a little bit of shoot grows out. Now, same thing, when you pray for forgiveness, we believe with all our heart that our Lord Jesus Christ will reach down in our heart and forgive us and yank out this. But because this is now slightly larger, it becomes harder for you, not for God, it is for you to get over. Plus the devil will come and keep whispering in your ears and say that, hey, [unclear accusation], why are you going to do this kind of thing, blah blah blah, right?'
    confidence: 0.85
