    questions: []
    topics: [prayer, service-life]
    scripture: []
    transcript: 'Let us come before God in a time of prayer. Let us pray for ourselves in response to the sermon. And we want to ask ourselves whether we have been followers of the truth, or have we lived a life that is completely against the truth. May we ask God to grant us the strength to repent and to return to him. The second prayer item, let us continue to lift up the Reformed Evangelical Movement. We are part of that movement as a church. At the same time this is a movement to call the world to return to the Word of God. And because it is a movement that is blessed by God, we have a lot of issues to overcome, a lot of challenges, a lot of attacks from the evil one and from people whom the evil one will send. So it is very important for us to continue to pray for our movement, that God will continue to protect it and to grant us strength and wisdom to navigate, especially our leaders. So we want to pray for the Reformed Evangelical Movement, started by our senior pastor. So let us first start by praying for ourselves. You can pray verbally or you can pray in your heart. Let us pray.'
