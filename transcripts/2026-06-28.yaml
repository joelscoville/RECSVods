    questions: []
    topics: [prayer]
    scripture: []
    transcript: 'Let us pray together. We thank you, God Almighty, for the privilege of prayer. Perhaps we should always remember what Reverend Wang Yi, who is in jail, said, that prayer is our secret weapon, that is like an atomic bomb that you have given to us so that we will destroy the work of the evil one. Yet by your perfect timing, oftentimes we get impatient in prayer. We do pray that you help us understand that we should trust you fully. And every time we open our mouth and we pray, or pray in our heart, we know you hear us, not because of who we are but because of what our Lord Jesus Christ has done for us. Help us to trust you fully. And we commit everything that we pray for into your almighty hands.'
