  - id: p0628-larger-plant
    video_id: k27dmsPvmG8
    section_id: s0628-consequences
    start: 2345.02
    end: 2393.06
    type: sermon
    title: A larger plant and the shadow of past choices
    summary: The preacher says that forgiveness does not necessarily remove the difficulty a person experiences from a history of wrongdoing.
    questions: []
    topics: [repentance]
    scripture: []
    transcript: 'And if not only are you involved in pornography or whatever it is, you go ahead and you have sex with [unclear relationship wording] or have sex with many people, then the root is very big. And not only is the shoot growing up, it can grow up and then it has even more and more shoot and more and more root, and the flower comes out also. So the plant grows a lot bigger. Same thing. If at this point of time you come to our Lord Jesus Christ and you seek forgiveness, will he forgive you? He will. He will move in and he will yank the whole thing out from your heart. Guess what? This is very big, and it takes a long time to decay. It is not that God has not forgiven you, but you will find it most difficult too, because the shadow is big and the weightage is big.'
    confidence: 0.85
  - id: p0628-durian
    video_id: k27dmsPvmG8
    section_id: s0628-consequences
    start: 2394.1
    end: 2450
    type: sermon
    title: The durian-tree illustration of lasting responsibility
    summary: The preacher extends his image to a large tree and says that consequences such as responsibility for a child continue after forgiveness.
    questions: ['What does the durian-tree illustration say about continuing responsibility?']
    topics: [repentance]
    scripture: []
    transcript: 'And finally, if your girlfriend gets pregnant and has a child, or if you go and catch one of the many, many diseases that can be out there, like HIV for example, it is not only a plant that has flower. It is a giant tree that has durians on it, very big. So, same thing. You seek forgiveness, you ask God to forgive you because you truly repent. Will he forgive you? What do you think? Yes or no? Yes! And Jesus Christ is going to yank that giant durian tree out from your life, and guess what will happen to the durian tree? It will stay there, you know. It will rot. And so for you the durian tree is there for a long, long time. For example, if you have a child at a very young age, the [child; ASR says key] is not going to disappear. It is real life. It is not a toy. It is a human being which you are responsible for.'
    confidence: 0.86
    review_notes: ['Speaker’s moral illustration, not medical guidance; the child/key reading is explicitly marked.']
  - id: p0628-helping-families
