  - id: p20260607-glory-recap
    video_id: 8Qjfp-2L5d8
    section_id: s20260607-sermon-recap
    start: 2178
    end: 2292.06
    type: sermon
    title: Recap — glory amid suffering
    summary: Reviewing the previous session, the pastor contrasts Jesus' attention to glory with anticipated suffering and describes glory as intrinsic to God and manifested in a life aligned with God's will.
    questions: [How does the recap connect suffering and God's glory?]
    topics: [glory, discipleship]
    scripture: ['John 13:31-35']
    transcript: |
      [Selected ASR excerpts.]
      There is a paradox of suffering that is very strange that he would talk about glory when he was mindful of suffering, because for any one of us we would be whining about what's a horrible thing that is to come to our life but he was very focused on the glory. [...] However, actually, the drive of the Bible is that the glory of God is in itself an intrinsic attribute of God, meaning you don't have to do anything, the glory of God is there. It's almost like the sun is always shining. And so when we live a life that is in accordance to the will of God, you really don't have to do anything, the glory of God is there.
    confidence: 0.9
    review_notes: [Longer recap thought unit; a garbled John Piper attribution is not reproduced. The Last Session slide is not today's title.]
