    summary: The pastor argues against a self-sufficient retirement detached from others and connects loving one another with the community represented by Communion.
    questions: [Why does the pastor connect Christian community with Communion?]
    topics: [service-life, communion, discipleship]
    scripture: ['John 13:34-35']
    transcript: |
      [Selected ASR excerpt.]
      So if you think that you want to make a lot of money, retire and be alone and do your own thing and don't care about anybody else and be Christian, I am telling you that you are being disobedient to the word of God. [...] Whether you are single or have a family, it is a community of people of God. That's why Holy Communion comes in, right? We are the body of Christ and so the body of Christ cannot have one body that is somewhere else and not part of the system at all.
