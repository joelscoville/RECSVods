    transcript: |
      [Edited ASR excerpts.]
      Our culture and our construct shape our mind very strongly about Christianity today. Much of Christianity today is cultural in nature. So people go to church because it's a cultural thing, they just do it.
      My family have been watching this situation comedy called The Middle in the Netflix.
      [The preacher describes an episode contrasting a quiet church with an African American church, and recalls attending a church in Atlanta.]
      For them, it's different, right? When the pastor is speaking, they're all [unclear]. Yeah man, preach it, preacher. And then they stand up and dance and do all these things.
