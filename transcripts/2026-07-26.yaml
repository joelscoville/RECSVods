    start: 958.7
    end: 1034.56
    type: exhortation
    title: Anxiety and the desire to control life
    summary: The worship leader describes the stress of wanting life to follow one's own plans and directs attention to Jesus as shepherd.
    questions: [How does the worship leader connect anxiety with wanting control?]
    topics: [faith, peace]
    scripture: []
    transcript: |
      [Edited ASR excerpt.]
      We want to be certain about our life. We want things to be in our control. We wouldn't dare to verbally say that we want to be in control, but deep down we want everything to go as we planned or as we wished. And when we can't, we become stressed, anxious, our health gets affected, our relationship gets affected. It's all because we forget that we have Jesus our true Shepherd. He knows the future and not only that, he holds the future and he knows us best, better than ourselves.
    confidence: 0.93
