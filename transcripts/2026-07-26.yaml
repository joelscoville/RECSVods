      Dear God Almighty, we come before you, we bow before you, and we thank you. Thank you because we are here today. Thank you because you love us so dearly, and care for us so deeply.
      God, we also ask You that You bless us today in this church. Help us to abide in Your Word, deeply rooted in Your Word.
