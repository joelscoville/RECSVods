    summary: The worship leader contrasts changing relationships, finances and circumstances with hope in Christ, then introduces Rock of Ages.
    questions: [What encouragement is offered to people who feel rejected?]
    topics: [faith, peace]
    scripture: []
    transcript: |
      Church, maybe today you are going through some difficult times, maybe you feel misunderstood or even rejected. Maybe you are struggling with something that nobody even knows about. But let me remind you today, our hope is in Christ Jesus. It is not in the people, it is not in maybe your work, your title, your income, your finances, nothing. People may change. Your things that you own may be gone or taken. Circumstances may change, even our feelings may change, but Jesus remains the same. So whatever you are going through, let us come to him. He is our rock, he is our refuge.
      [The leader introduces Rock of Ages.]
    confidence: 0.94
