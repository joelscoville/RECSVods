    transcript: |
      [Edited ASR excerpt; names normalized from clear adjacent references, uncertain translation details omitted.]
      First of all, the Christian is definitely a person who is bought with a heavy price. So much so that the Bible used the word doulos, or [bondservant], or slave. I told you that this guy called John MacArthur Jr., who is one of the key Reformed leaders — he argued strongly that actually, if you want to ask what a Christian is, the answer is slave, slave to Jesus Christ. And so therefore, the answer for Christians is that you don't get to live your life by yourself.
      [Discussion of MacArthur's book and disputed translation terminology omitted from this excerpt.]
