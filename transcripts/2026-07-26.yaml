      [Edited ASR excerpt; question spelling corroborated by the slide.]
      Now today we will finish John chapter 15. And again, before I start, I want to encourage you to ask any question. The question asked today is related to the preaching for the past few weeks as well. Somebody asked, isn't it a sign of God's blessing if I were to live a life without much challenges or difficulties? What is wrong with wanting to live a trouble-free life?
      [Brief scripture paraphrase omitted.]
      Hence, the sermon title is To Be Hated. So this question is relevant too, right? Because what's wrong with not being hated and wanting to live a life that is very smooth and fine? I guess that's the main idea that the whole world have as far as living is concerned, that you want to just live a nice life.
