    title: Culture and the universality of the gospel
    summary: The preacher discusses a Chinese Christian conference and criticizes defining churches by ethnic or cultural boundaries, using this as an example of inherited worldviews.
    questions: [How does the preacher relate church identity to cultural assumptions?]
    topics: [service-life, discernment, mission]
    scripture: []
    transcript: |
      [Edited ASR excerpt; uncertain conference name omitted.]
      Somebody pointed out that something is wrong because you call yourself Chinese Christian something, something, because that goes against the universality of the gospel of Jesus Christ, right? So that's also the opinion that I have. Sometimes you pass by some churches, you see that it's something Chinese church, something Malay church — not Malay, Indonesian church — something Hindu Tamil church, right? And so right away, you are boxing the church into that culture or that language or that group of people. And actually, it is most unbiblical. But it also demonstrates how strong our worldview is influenced by our background and the way we all live.
