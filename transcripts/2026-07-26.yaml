    type: sermon
    title: Seeking direction in Scripture
    summary: Pastor Yong presents Scripture as the highest authority over personal, cultural and pastoral opinions, then recalls dependence on Christ.
    questions: [Where does the preacher say to seek direction amid conflicting values?]
    topics: [truth, discernment, faith]
    scripture: ['John 15:5']
    transcript: |
      [Edited ASR excerpt.]
      In the midst of all this confusion, in the Reformed Evangelical understanding, you have the Word of God to show you what is the right way to go because it's the highest authority in our life. So I don't care what you say you think is right or wrong, or what your culture says is right or wrong, what your nation says is right or wrong, even what your pastor says is right or wrong. I only care what the word of God says is right or wrong, and that really will give us a way out in the midst of all our confusion.
      [Further exhortation and John 15 quotation omitted from this excerpt.]
    confidence: 0.94
