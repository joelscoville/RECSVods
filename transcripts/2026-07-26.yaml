    start: 2062.98
    end: 2121.18
    type: sermon
    title: Choosing to worship and serve voluntarily
    summary: Pastor Yong welcomes those who came despite the rain and describes his preference for voluntary ministry, while recognizing the need to organize.
    questions: [Why does Pastor Yong value voluntary service?]
    topics: [service, worship]
    scripture: []
    transcript: |
      [Edited ASR excerpt.]
      As I was leaving the house today, the rain suddenly came very heavy. And I said to myself, good. That means the people who come for worship service today will be people who are quite determined to come, because you have overcome the temptation of staying on your bed and sleeping for another hour or so. And it's always good to be with the Lord. In my own ministry all my life, I'm biased towards what I call natural ministry or voluntary kind of ministry. I don't quite like to force people to do anything. When we have a general gathering of people who really do come because they want to come, and they want to serve because they want to serve, that's the sweetest thing.
    confidence: 0.94
