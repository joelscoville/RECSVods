recordingTitle: Tick-Tocking
serviceDate: 2025-12-28
status: draft
sermonDescription: Reflecting on the year's end through Psalm 90, the preacher contrasts passing human life with God's unchanging nature. Looking backward can bring understanding, but living in regret cannot recover the past. Quiet reflection, daily devotion and journaling help recognize God's work amid distraction. Wisdom numbers finite days and connects ordinary acts of service with the Eternal One, rather than measuring significance by wealth, recognition or public achievement.
sermonScripture:
  - Psalms 90:1-17
  - 1 John 2:15-17
  - Matthew 10:42
sermonTopics:
  - knowing-god
  - stewardship
  - service
