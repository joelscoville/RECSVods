  - chapterId: c20251228-reflect-forward
    chapterTitle: Understand the Past without Living in It
    chapterKind: sermon
    chapterStart: "27:30.0"
    chapterEnd: "49:11.8"
    points:
      - pointTime: "30:08.74"
        pointText: Kierkegaard's distinction separates understanding life backward from the necessity of living forward.
      - pointTime: "33:49.62"
        pointText: Looking back for understanding is distinguished from remaining captive to regret.
      - pointTime: "36:31.64"
        pointText: Repeated what-if speculation cannot change the past and can prevent faithful life in the present.
      - pointTime: "37:20.2"
        pointText: Noisy celebrations and constant activity can conceal discomfort with questions about existence.
      - pointTime: "46:39.29"
        pointText: Deliberate daily reflection helps people understand and treasure their finite lives.
      - pointTime: "49:02.15"
        pointText: Journaling is offered as a way to connect past experiences and recognize God's work.
  - chapterId: c20251228-unchanging-god
    chapterTitle: The Unchanging God Is Our Dwelling Place
    chapterKind: sermon
    chapterStart: "49:11.8"
    chapterEnd: "1:06:53.1"
    chapterScripture:
      - Psalms 90:1-6
      - Hebrews 13:8
    points:
      - pointTime: "49:11.99"
        pointText: Scripture supplies a framework for reflection beyond personal recollection alone.
      - pointTime: "52:36.09"
        pointText: Moses begins with God as the dwelling place across generations rather than with human achievement.
      - pointTime: "57:46.85"
        pointText: God's constancy gives an anchor amid changes in personal life and the wider world.
      - pointTime: "59:12.05"
        pointText: The preacher locates fundamental human error in misunderstanding God and our relationship with him.
      - pointTime: "1:02:59.09"
        pointText: Immutability means God's nature, goodness and promises do not fluctuate.
      - pointTime: "1:06:24.43"
        pointText: Trust in God as rock is maintained alongside unanswered questions about particular events.
  - chapterId: c20251228-finite-days
    chapterTitle: God's Holiness and Our Finite Days
    chapterKind: sermon
    chapterStart: "1:06:53.1"
    chapterEnd: "1:19:17.47"
    chapterScripture:
      - Psalms 90:7-12
    points:
      - pointTime: "1:06:53.37"
        pointText: Psalm 90 contrasts God's enduring nature with human sin and life passing under judgment.
      - pointTime: "1:08:05.71"
        pointText: Light beneath a lifted stone illustrates hidden sin exposed before God's holy presence.
      - pointTime: "1:13:54.97"
        pointText: Changing social values are contrasted with the preacher's conviction that God's holiness does not change.
      - pointTime: "1:14:54.19"
        pointText: God's kingdom does not depend on human effort, yet people remain accountable for neglected responsibilities.
      - pointTime: "1:16:04.05"
        pointText: Numbering our days means valuing time that no wealth can recover once it has passed.
  - chapterId: c20251228-eternal-work
    chapterTitle: Give Ordinary Work Eternal Value
