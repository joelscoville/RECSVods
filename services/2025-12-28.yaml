    points:
      - pointTime: "1:19:17.47"
        pointText: Psalm 90 seeks joy through God's steadfast love and work established by him.
      - pointTime: "1:20:28.69"
        pointText: Wisdom connects finite days with God's eternal purposes rather than merely chasing temporary satisfaction.
      - pointTime: "1:21:29.89"
        pointText: 1 John contrasts a passing world with the lasting significance of doing God's will.
      - pointTime: "1:24:49.1"
        pointText: A cup of water challenges the idea that only large, publicly recognized achievements matter.
      - pointTime: "1:26:52.66"
        pointText: Ordinary service done in Christ's name is connected with the Eternal One and remembered by God.
      - pointTime: "1:27:06.02"
        pointText: C. T. Studd's reported saying gathers the conclusion around one finite life and lasting work for Christ.
