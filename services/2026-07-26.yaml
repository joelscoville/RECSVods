  - chapterId: c20260726-opposition-responsibility
    chapterTitle: Following Christ Brings Opposition and Responsibility
    chapterKind: sermon
    chapterStart: "1:07:31.66"
    chapterEnd: "1:27:22.95"
    points:
      - pointTime: "1:07:31.66"
        pointText: Pastor Yong presents reported persecution, conflicting values and spiritual conflict as
          challenges of following Jesus, recounts allegations denied by Habitat's founder, and
          explores greater knowledge's accountability while rejecting ignorance as guaranteed
          exemption.
      - pointTime: "1:11:55.08"
        pointText: An architect refusing bribes illustrates everyday opposition for conscientious choices.
      - pointTime: "1:13:17.5"
        pointText: 2 Timothy 3 and an attribution to John Stott connect opposition with clashing values.
      - pointTime: "1:19:22.86"
        pointText: Spiritual opposition is discussed as something that can be either neglected or overemphasized.
      - pointTime: "1:24:04.92"
        pointText: John 15 and Acts 17 introduce the relationship between knowledge and accountability.
    subchapters:
      - chapterId: s20260726-traps
        chapterTitle: Spiritual Conflict and Greater Accountability
        chapterKind: sermon
        chapterStart: "1:20:46.8"
        chapterEnd: "1:27:22.95"
        points:
          - pointTime: "1:20:46.8"
            pointText: Pastor Yong recounts a disputed allegation and the Habitat founder's denial before
              advocating precautions and discussing knowledge's accountability with acknowledged
              theological difficulty, rejecting ignorance as guaranteed exemption.
          - pointTime: "1:22:09.04"
            pointText: The preacher recalls withholding advice because he believed either response to the conflict could cause harm.
          - pointTime: "1:23:03"
            pointText: Precautions associated with Billy Graham are advocated through a personal transport example.
          - pointTime: "1:24:04.92"
            pointText: Greater knowledge is connected with accountability while acknowledging theological difficulty.
          - pointTime: "1:25:42.12"
            pointText: A comedy illustration is followed by explicit rejection of ignorance as guaranteed exemption.
        chapterScripture:
          - John 15:22-24
          - Acts 17:30-31
