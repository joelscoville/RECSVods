  - chapterId: c20260726-hostility-common-grace
    chapterTitle: Recognize Goodness Amid the World's Hostility
    chapterKind: sermon
    chapterStart: "48:26.84"
    chapterEnd: "1:07:31.66"
    points:
      - pointTime: "48:26.84"
        pointText: Pastor Yong questions sweeping condemnation through attributed MacArthur accounts, then
          uses the Good Samaritan, common grace and interfaith service to distinguish the fallen
          world's hostility from recognizable goodness without making a salvation claim.
      - pointTime: "49:23.32"
        pointText: The Farewell Discourse shifts from mutual love toward hostility from the world.
      - pointTime: "54:56.18"
        pointText: The preacher questions sweeping religious condemnation through language he attributes to MacArthur.
      - pointTime: "59:15.12"
        pointText: Common grace is distinguished from special grace while recognizing goodness outside Christian communities.
      - pointTime: "1:05:53.82"
        pointText: The fallen world's opposition is distinguished from goodness among people of other faiths.
