  - chapterId: c20260726-scripture-shaped-faith
    chapterTitle: Let Scripture Challenge Comfortable Assumptions
    chapterKind: sermon
    chapterStart: "34:22.98"
    chapterEnd: "48:26.84"
    points:
      - pointTime: "34:22.98"
        pointText: Pastor Yong moves from voluntary family service and the question of an easy life to
          challenging cultural churchgoing, placing Scripture above inherited assumptions and
          recalling dependence on Christ's love.
      - pointTime: "36:50.92"
        pointText: A submitted question asks whether few difficulties indicate God's blessing.
      - pointTime: "40:07.86"
        pointText: An ethnic Christian conference illustrates inherited cultural assumptions about church.
      - pointTime: "41:46.18"
        pointText: Scripture is placed above personal, cultural and pastoral opinions.
      - pointTime: "45:59.44"
        pointText: MacArthur's account of belonging to Christ challenges churchgoing understood merely as comfort.
