recordingTitle: Back and Forth
serviceDate: 2025-01-05
status: draft
sermonDescription: >-
  At the turning of the year, Philippians 3 directs attention toward the surpassing worth of knowing Christ. Paul's unfinished journey encourages growth grounded in belonging to Jesus rather than visible achievement or present feelings alone. Forgetting what lies behind means learning from history without being trapped by forgiven failures or resting on former successes. Straining forward calls for intentional effort toward Christ, supported by fellow believers and a renewed commitment to use the coming year faithfully.
sermonScripture:
  - Philippians 3:7-14
  - Psalms 90:12
sermonTopics:
  - discipleship
  - forgiveness
  - responsibility
