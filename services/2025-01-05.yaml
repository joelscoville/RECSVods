      - pointTime: "6:10.78"
        pointText: Welcome, greetings and quiet preparation begin the worship led by Hadi.
      - pointTime: "8:16.98"
        pointText: The call to worship leads into hymns, opening prayer and responsive Bible readings.
      - pointTime: "11:52.1"
        pointText: Opening prayer asks for trust while the road ahead and new ministry opportunities remain uncertain.
      - pointTime: "15:23.06"
