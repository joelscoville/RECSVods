    chapterEnd: "1:13:30.8"
    chapterScripture:
      - John 11:17-26
    points:
      - pointTime: "56:35.8"
        pointText: The four-day delay and the gathering at Bethany provide the setting for Martha's encounter.
      - pointTime: "1:00:08.88"
        pointText: The sisters' different responses are considered through their earlier meeting with Jesus.
      - pointTime: "1:03:30.38"
