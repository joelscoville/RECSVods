sermonDescription: Jesus' conversation with Martha in John 11 raises the question of believing in the resurrection and the life. The preacher acknowledges mixed strength and weakness in faith, distinguishes Christ's independent truth from human response, and rejects faith as a technique for obtaining desired outcomes. Romans 10 and James 2 connect confession with costly, practical commitment, while an introductory discussion of AI stresses real relationships rather than a consumer approach to faith.
