    points:
      - pointTime: "1:13:31.12"
        pointText: Jesus' question Do you believe this is presented as essential to receiving the promise.
      - pointTime: "1:17:33.8"
        pointText: Calvin is cited to describe an open invitation to salvation and the obstacle of unbelief.
      - pointTime: "1:22:12.38"
        pointText: Christ remains resurrection and life independently of whether people believe him.
      - pointTime: "1:29:02.18"
        pointText: Faith in faith is rejected as a technique for obtaining a preferred result.
      - pointTime: "1:30:42.5"
        pointText: Historical persecution gives context to confessing Jesus as Lord in Romans 10.
      - pointTime: "1:35:32.42"
        pointText: James 2:17 calls for actions that demonstrate belief rather than words or credentials alone.
