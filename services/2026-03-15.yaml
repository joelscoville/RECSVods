    chapterKind: qa
    chapterStart: "34:59.5"
    chapterEnd: "50:24.04"
    points:
      - pointTime: "34:59.86"
        pointText: The preacher introduces the John 11 session and a question about AI as a spiritual tool.
      - pointTime: "36:19.98"
        pointText: Printing, radio, television and the internet provide context for rapid technological change.
      - pointTime: "39:47.16"
        pointText: Workplace disruption and translation research illustrate AI's practical impact.
      - pointTime: "43:13.8"
        pointText: A companion that always agrees can become an attractive substitute for challenging real relationships.
      - pointTime: "46:39.44"
        pointText: Faith is presented as real relationship rather than a consumer service that says what one wants to hear.
