    points:
      - pointTime: "50:24.04"
        pointText: The Lazarus account is reviewed as an encounter between temporal human life and Christ's divinity.
      - pointTime: "51:44.1"
        pointText: A childhood recollection introduces the challenge of realizing that one's own life is finite.
      - pointTime: "52:33.54"
        pointText: Competing explanations of suffering are contrasted with the Bible's limited but sufficient revelation.
      - pointTime: "53:26.42"
        pointText: Scripture is described as sufficient for understanding God, salvation, faith and life.
      - pointTime: "55:40.26"
        pointText: The recap urges trust in God's goodness, freedom from error and love despite human limits.
