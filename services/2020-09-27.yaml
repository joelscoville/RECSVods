              illustrating confused responsibilities through an account of purchasable academic
              credentials.
      - chapterId: s0927-bonhoeffer
        chapterTitle: Grave Evil May Require Resistance
        chapterKind: sermon
        chapterStart: "59:04"
        chapterEnd: "1:00:58.5"
        points:
          - pointTime: "59:04"
