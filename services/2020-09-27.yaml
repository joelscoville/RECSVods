    chapterTitle: Opening
    chapterKind: opening
    chapterStart: "0:00"
    chapterEnd: "4:36.4"
    points:
      - pointTime: "0:00"
        pointText: The preacher welcomes online participants and announces the international convention, its
          translation and volunteer support, and the replacement of next Sunday’s usual meeting,
          while questioning what online view counts mean.
      - pointTime: "0:41.22"
        pointText: An October online convention is announced with international participation and translation work.
      - pointTime: "2:06.92"
        pointText: The following Sunday's usual meeting will be replaced by joining convention worship from Jakarta.
      - pointTime: "2:58.5"
        pointText: Online reach is contrasted with physical conventions, with caution about interpreting view counts.
      - pointTime: "4:01.64"
        pointText: Local volunteers will support audiovisual and online convention work.
  - chapterId: c20200927-accountable-stewardship
    chapterTitle: God’s Authority Calls for Accountable Stewardship
    chapterKind: sermon
    chapterStart: "4:36.4"
    chapterEnd: "12:45.22"
    points:
      - pointTime: "4:36.4"
        pointText: The preacher revisits scripture’s authority over credentials and the vineyard’s call to
          generous, accountable stewardship and creation care, holding love with righteousness
          before praying for humble attention.
      - pointTime: "5:40.18"
        pointText: Teaching should be assessed by Scripture rather than academic or institutional status.
      - pointTime: "7:08.46"
        pointText: The vineyard illustrates stewardship of what belongs to God.
      - pointTime: "9:17.1"
        pointText: Environmental responsibility is described as creation care.
      - pointTime: "11:17.9"
        pointText: God's love and righteousness are held together in a call to serious, active faith.
    chapterScripture:
      - Luke 20:1-19
      - Psalms 18:27
      - Luke 20:9-19
      - Isaiah 5
  - chapterId: c20200927-test-political-claims
    chapterTitle: Test Political Claims by Scripture
    chapterKind: sermon
    chapterStart: "12:45.22"
    chapterEnd: "26:21.02"
    points:
      - pointTime: "12:45.22"
        pointText: Using contemporary political settings, the preacher tests claims that God backs a party,
          religion serves rulers or divine supremacy excuses rejecting civil rules, with Facebook
          reports remaining unverified and mask refusal explicitly hypothetical.
      - pointTime: "17:08.28"
        pointText: Identifying God with a political party or national system is questioned.
      - pointTime: "20:55.28"
        pointText: Chess pieces illustrate a second view in which religion serves political rulers.
      - pointTime: "24:07.34"
        pointText: A hypothetical mask refusal tests whether divine supremacy excuses rejecting civil rules.
      - pointTime: "25:25.26"
        pointText: Scripture is called upon to decide among competing approaches to civil authority.
    chapterScripture:
      - Luke 20:19-26
      - Psalms 109:8
  - chapterId: c20200927-discernment-and-fairness
    chapterTitle: Recognize Deception and Give Back Fairly
    chapterKind: sermon
    chapterStart: "26:21.02"
    chapterEnd: "38:00.84"
    points:
      - pointTime: "26:21.02"
        pointText: The preacher follows Luke 20’s deceptive challenge through self-examination and Jesus’
          response about Caesar, interpreting tribute and ordinary commerce as matters of fairness
          toward the people sustaining public life.
      - pointTime: "29:53.18"
        pointText: Religious scandals lead to self-examination rather than abandonment of faith.
      - pointTime: "32:20.86"
        pointText: The tax question is explained as a trap designed to turn people against either answer.
      - pointTime: "34:51.48"
        pointText: Jesus' answer is interpreted as giving back fairly rather than making every obligation a religious dispute.
      - pointTime: "36:30.52"
        pointText: Taxation sustains public services supplied by people of many beliefs.
    subchapters:
      - chapterId: s0927-weeds
        chapterTitle: Examine Your Own Sincerity
        chapterKind: sermon
        chapterStart: "28:40.38"
        chapterEnd: "31:13.32"
        points:
          - pointTime: "28:40.38"
            pointText: The preacher turns the wheat-and-weeds warning toward listeners’ own sincerity rather
              than surprise at religious appearances or church scandals; the existing ASR ambiguity
              remains unresolved.
          - pointTime: "29:53.18"
            pointText: The wheat-and-weeds image directs attention to one's own sincerity.
        chapterScripture:
          - Matthew 13:24-30
          - Matthew 13:27-30
      - chapterId: s0927-fairness
        chapterTitle: Fairness Applies Beyond Religious Affiliation
        chapterKind: sermon
        chapterStart: "34:51.48"
        chapterEnd: "36:30.52"
        points:
          - pointTime: "34:51.48"
            pointText: The preacher reads Jesus’ answer as giving back fairly and rejects cheating or
              preferential commerce based on a seller’s Christian identity.
          - pointTime: "36:00.46"
            pointText: Commerce should remain fair whether or not a seller shares one's faith.
        chapterScripture:
          - Luke 20:22-25
          - Luke 20:25
