        points:
          - pointTime: "28:40.38"
            pointText: The preacher turns the wheat-and-weeds warning toward listeners’ own sincerity rather
              than surprise at religious appearances or church scandals; the existing ASR ambiguity
              remains unresolved.
        chapterScripture:
          - Matthew 13:24-30
          - Matthew 13:27-30
      - chapterId: s0927-fairness
        chapterTitle: Fairness Applies Beyond Religious Affiliation
        chapterKind: sermon
        chapterStart: "34:51.48"
        chapterEnd: "36:30.52"
        points:
          - pointTime: "34:51.48"
            pointText: The preacher reads Jesus’ answer as giving back fairly and rejects cheating or
              preferential commerce based on a seller’s Christian identity.
        chapterScripture:
          - Luke 20:22-25
          - Luke 20:25
