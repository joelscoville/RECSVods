  - chapterId: c20200927-wise-political-engagement
    chapterTitle: Serve God through Wise Political Engagement
    chapterKind: sermon
    chapterStart: "46:32.92"
    chapterEnd: "1:03:40.66"
    points:
      - pointTime: "46:32.92"
        pointText: The preacher grounds active public engagement in Christ’s higher authority, warning
          against servility, apathy and compromising church alliances while allowing that grave evil
          may require carefully discerned action.
      - pointTime: "49:04.74"
        pointText: The Great Commission calls for changed lives and influence rather than arrogance.
      - pointTime: "52:28.38"
        pointText: Electoral incentives and influence make political alliances risky for the church's calling.
      - pointTime: "58:17.22"
        pointText: Private political activity is distinguished from endorsements in the church's name.
      - pointTime: "1:02:06.04"
        pointText: Severe wrongdoing may require action, with discernment rather than automatic destructive reactions.
    subchapters:
      - chapterId: s0927-commission
        chapterTitle: Christ’s Authority Sends His Followers into the World
        chapterKind: sermon
        chapterStart: "49:04.74"
        chapterEnd: "51:15.9"
        points:
          - pointTime: "49:04.74"
            pointText: The preacher connects the Great Commission with changed lives rather than arrogance and
              uses a hypothetical leader’s visit to question excessive deference to human office.
          - pointTime: "50:03.66"
            pointText: A hypothetical national leader's visit challenges excessive deference when serving Christ.
        chapterScripture:
          - Matthew 28:18-20
      - chapterId: s0927-spheres
        chapterTitle: Respect the Distinct Responsibilities of Institutions
        chapterKind: sermon
        chapterStart: "56:15.74"
        chapterEnd: "58:15.76"
        points:
          - pointTime: "56:15.74"
            pointText: The preacher applies a quotation attributed to Kuyper to church, state and education,
              illustrating confused responsibilities through an account of purchasable academic
              credentials.
          - pointTime: "56:58.8"
            pointText: Purchasable credentials illustrate education losing its purpose when reduced to a business.
      - chapterId: s0927-bonhoeffer
        chapterTitle: Grave Evil May Require Resistance
        chapterKind: sermon
        chapterStart: "59:06.4"
        chapterEnd: "1:00:42.46"
        points:
          - pointTime: "59:06.54"
            pointText: The preacher presents Bonhoeffer’s resistance to Nazism as exceptional action against
              grave evil, with his biographical account and quotation about silence remaining
              attributed rather than independently verified.
          - pointTime: "1:00:19.84"
            pointText: A quotation attributed to Bonhoeffer connects silence in the face of evil with responsibility to act.
        chapterScripture:
          - Luke 20:25
    chapterScripture:
      - Luke 20:24-26
      - Matthew 28:18-20
      - Luke 20:25
      - Luke 20:19-26
