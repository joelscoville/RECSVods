  - chapterId: c20200927-civil-order-and-conscience
    chapterTitle: Support Civil Order with a Fair Conscience
    chapterKind: sermon
    chapterStart: "38:04.22"
    chapterEnd: "46:32.1"
    points:
      - pointTime: "38:04.22"
        pointText: The preacher reads Romans 13 as a call to sustain public order with conscience beyond
          party loyalty, temper expectations of leaders and engage meaningfully, presenting Kuyper
          as an example.
    subchapters:
      - chapterId: s0927-romans-order
        chapterTitle: Civil Government Maintains Public Order
        chapterKind: sermon
        chapterStart: "38:04.22"
        chapterEnd: "40:31.08"
        points:
          - pointTime: "38:04.22"
            pointText: Relating Romans 13 to Christians' responsibilities toward government, the preacher
              recognizes civil authority even under Rome because it maintains public order, and
              connects that principle with personal discipline.
        chapterScripture:
          - Romans 13:1-7
          - 1 Peter 2
          - Romans 13:1
          - 1 Corinthians 14:33
      - chapterId: s0927-romans-conscience
        chapterTitle: Let Conscience Judge Beyond Party Loyalty
        chapterKind: sermon
        chapterStart: "40:31.08"
        chapterEnd: "43:39.3"
        points:
          - pointTime: "40:31.08"
            pointText: The preacher rejects political dissatisfaction as a blanket exemption from law, urging
              fair judgment and support for shared systems while retaining a senior pastor’s
              distinction about a destructive ruler.
        chapterScripture:
          - Romans 13:2-4
          - Romans 13:4-5
          - Romans 13:5-7
          - Romans 13:7
