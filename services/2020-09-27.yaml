recordingTitle: Authority
serviceDate: 2020-09-27
status: draft
sermonDescription: Rev. Yong Teck Meng reads Jesus’ answer about Caesar alongside Romans 13 as a
  call to meet civil obligations fairly while reserving highest allegiance for God. He challenges
  partisan uses of religion and urges informed participation rather than apathy or deference to
  power. Christians, he argues, should keep conscience and the church’s calling distinct from
  political loyalty, discerning when grave wrongdoing requires action.
sermonScripture:
  - Luke 20:19-26
  - Luke 20:25
  - Romans 13:1-7
sermonTopics:
  - authority
  - discernment
  - discipleship
