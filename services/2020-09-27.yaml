  - chapterId: c20200927-civil-order-and-conscience
    chapterTitle: Support Civil Order with a Fair Conscience
    chapterKind: sermon
    chapterStart: "38:00.84"
    chapterEnd: "46:32.92"
    points:
      - pointTime: "38:00.84"
        pointText: The preacher reads Romans 13 as a call to sustain public order with conscience beyond
          party loyalty, temper expectations of leaders and engage meaningfully, presenting Kuyper
          as an example.
      - pointTime: "39:18.42"
        pointText: Order in public administration is connected with discipline in personal life.
      - pointTime: "42:12.92"
        pointText: Conscience should judge right and wrong beyond automatic approval of a favored party.
      - pointTime: "43:05.64"
        pointText: Taxes and respect sustain the system from which Christians benefit.
      - pointTime: "44:58.44"
        pointText: Kuyper's political and theological work is offered as an example of meaningful engagement.
    subchapters:
      - chapterId: s0927-romans-order
        chapterTitle: Civil Government Maintains Public Order
        chapterKind: sermon
        chapterStart: "38:00.84"
        chapterEnd: "40:31.08"
        points:
          - pointTime: "38:00.84"
            pointText: Relating Romans 13 to Christians' responsibilities toward government, the preacher
              recognizes civil authority even under Rome because it maintains public order, and
              connects that principle with personal discipline.
          - pointTime: "39:18.42"
            pointText: 1 Corinthians 14:33 is applied to public order and personal discipline.
        chapterScripture:
          - Romans 13:1-7
          - 1 Peter 2
          - Romans 13:1
          - 1 Corinthians 14:33
      - chapterId: s0927-romans-conscience
        chapterTitle: Let Conscience Judge Beyond Party Loyalty
        chapterKind: sermon
        chapterStart: "40:31.08"
        chapterEnd: "43:39.3"
        points:
          - pointTime: "40:31.08"
            pointText: The preacher rejects political dissatisfaction as a blanket exemption from law, urging
              fair judgment and support for shared systems while retaining a senior pastor’s
              distinction about a destructive ruler.
          - pointTime: "41:26.56"
            pointText: Dissatisfaction with a party does not by itself excuse rejecting civil rules.
          - pointTime: "42:12.92"
            pointText: Conscience should judge fairly across party loyalties.
          - pointTime: "43:05.64"
            pointText: Romans 13:7 connects taxes and respect with support for shared systems.
        chapterScripture:
          - Romans 13:2-4
          - Romans 13:4-5
          - Romans 13:5-7
          - Romans 13:7
    chapterScripture:
      - Romans 13:1-7
      - 1 Peter 2
      - Romans 13:1
      - 1 Corinthians 14:33
      - Romans 13:2-4
