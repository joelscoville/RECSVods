        pointText: The preacher thanks God for teaching about public responsibilities and prays for truthful
          lives, wise responses to perceived injustice and freedom from passive inaction.
      - pointTime: "1:04:23.86"
        pointText: Prayer asks for wisdom in responding to perceived injustice and freedom from apathy.
    chapterScripture:
      - Matthew 28:18-20
