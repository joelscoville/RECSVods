    chapterTitle: Opening
    chapterKind: opening
    chapterStart: "0:00"
    chapterEnd: "4:36.4"
    points:
      - pointTime: "0:00"
        pointText: The preacher welcomes online participants and announces the international convention, its
          translation and volunteer support, and the replacement of next Sunday’s usual meeting,
          while questioning what online view counts mean.
  - chapterId: c20200927-accountable-stewardship
    chapterTitle: God’s Authority Calls for Accountable Stewardship
    chapterKind: sermon
    chapterStart: "4:36.4"
    chapterEnd: "12:48.72"
    points:
      - pointTime: "4:36.4"
        pointText: The preacher revisits scripture’s authority over credentials and the vineyard’s call to
          generous, accountable stewardship and creation care, holding love with righteousness
          before praying for humble attention.
    chapterScripture:
      - Luke 20:1-19
      - Psalms 18:27
      - Luke 20:9-19
      - Isaiah 5
  - chapterId: c20200927-test-political-claims
    chapterTitle: Test Political Claims by Scripture
    chapterKind: sermon
    chapterStart: "12:48.72"
    chapterEnd: "26:21.62"
    points:
      - pointTime: "12:48.72"
        pointText: Using contemporary political settings, the preacher tests claims that God backs a party,
          religion serves rulers or divine supremacy excuses rejecting civil rules, with Facebook
          reports remaining unverified and mask refusal explicitly hypothetical.
    chapterScripture:
      - Luke 20:19-26
      - Psalms 109:8
  - chapterId: c20200927-discernment-and-fairness
    chapterTitle: Recognize Deception and Give Back Fairly
    chapterKind: sermon
    chapterStart: "26:21.62"
    chapterEnd: "38:04.22"
    points:
      - pointTime: "26:21.62"
        pointText: The preacher follows Luke 20’s deceptive challenge through self-examination and Jesus’
          response about Caesar, interpreting tribute and ordinary commerce as matters of fairness
          toward the people sustaining public life.
    subchapters:
      - chapterId: s0927-weeds
        chapterTitle: Examine Your Own Sincerity
