recordingTitle: Eternal Life
serviceDate: 2026-09-06
status: published
sermonDescription: In John 17, the preacher presents eternal life as knowing God, not merely living
  forever. Jesus’ prayer and his path to glory through the cross frame a call to trust God’s love
  and cultivate prayer. Drawing on the distinction between knowing God and knowing about God, he
  urges listeners to turn reflection into daily conduct and use their gifts in service.
sermonScripture:
  - John 17:1-5
  - John 17
  - John 16:33
sermonTopics:
  - prayer
  - faith
  - service-life
