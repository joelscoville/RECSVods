  - chapterId: c20260906-trusting-gods-love
    chapterTitle: Overcoming
    chapterKind: sermon
    chapterStart: "32:00.54"
    chapterEnd: "45:05.94"
    points:
      - pointTime: "32:00.54"
        pointText: Introducing John 17 through a recap of John 16, the preacher encourages confidence in
          prayer and God’s love despite tribulation and imperfect faith, contrasting wishful hope
          with assurance.
      - pointTime: "34:33.2"
        pointText: Believers are encouraged to approach God confidently in prayer as his children.
      - pointTime: "37:24.2"
        pointText: God's love is presented as encouragement amid persecution and personal difficulties.
      - pointTime: "40:56.78"
        pointText: The disciples' confusion and failure offer encouragement to people conscious of imperfect faith.
      - pointTime: "43:38.78"
        pointText: The preacher contrasts wishful hope with assurance before introducing John 17.
