  - chapterId: c20260906-glory-and-the-cross
    chapterTitle: Christ’s Path to Glory Leads through the Cross
    chapterKind: sermon
    chapterStart: "56:52.82"
    chapterEnd: "1:10:47.7"
    points:
      - pointTime: "56:52.82"
        pointText: The preacher contrasts human recognition with God’s inherent glory, connects Christ’s
          mission and return to the original state of glory with the cross, and recalls encouragement
          from continued service despite suffering.
      - pointTime: "58:14.36"
        pointText: Jesus' prayer before crucifixion is contrasted with the disciples' fear.
      - pointTime: "1:00:26.26"
        pointText: Awards illustrate a human idea of glory as recognition for achievement.
      - pointTime: "1:03:07.26"
        pointText: Psalms 19:1 supports the preacher's distinction between human inadequacy and God's inherent glory.
      - pointTime: "1:09:56.74"
        pointText: The preacher recalls his first pastor continuing to translate despite severe vision loss.
    chapterScripture:
      - John 16:33
      - John 17:1
      - Psalms 19:1
      - John 17:1-5
  - chapterId: c20260906-eternal-life-as-knowing-god
    chapterTitle: What Is Eternal Life
    chapterKind: sermon
    chapterStart: "1:10:47.7"
    chapterEnd: "1:35:18.42"
    points:
      - pointTime: "1:10:47.7"
        pointText: Questioning eternal life as duration alone, the preacher interprets John 17:3 through
          relational knowledge of God and urges meditation, changed conduct and purposeful service,
          closing in prayer.

          Everyone who believes in Jesus Christ is called by the father and be saved.
      - pointTime: "1:11:58.58"
        pointText: Preserved flowers and a workplace conversation challenge the idea of eternal life as duration alone.
      - pointTime: "1:19:16.04"
        pointText: John 17:3 locates eternal life in knowing God and Jesus Christ.
      - pointTime: "1:26:36.12"
        pointText: Learned truths are to become meditation, prayer, praise and changes in daily conduct.
      - pointTime: "1:32:45.06"
        pointText: Listeners are urged to use their gifts, talents and resources in service as members of Christ's body.
    subchapters:
      - chapterId: s0906-knowing-god
        chapterTitle: Knowing God Vs Knowing About God
        chapterKind: sermon
        chapterStart: "1:19:16.04"
        chapterEnd: "1:31:21.22"
        points:
          - pointTime: "1:19:16.04"
            pointText: Eternal life is to know God, the only true God, and Jesus Christ. Knowing God vs Knowing
              about God. The preacher uses John 17:3, his account of ginóskó and Packer’s distinction
              between knowing God and knowing about God to urge lived relationship, reflection and use of
              one’s gifts. Eternal life is oneness with God.
          - pointTime: "1:20:32.5"
            pointText: The preacher uses Luke 1:34 to illustrate his explanation of knowing as intimate relationship.
          - pointTime: "1:23:38.02"
            pointText: Packer's Knowing God distinguishes personal relationship from knowledge about God.
          - pointTime: "1:26:36.12"
            pointText: Reflection on learned truth should lead to prayer, praise and practical response.
          - pointTime: "1:30:07.72"
            pointText: Knowing God gives purpose to present life rather than only a future beyond death.
        chapterScripture:
          - John 17:3
          - Luke 1:34
          - John 17
          - John 17:4-5
          - 1 John 5:10-12
    chapterScripture:
      - John 17:2
      - John 17:3
