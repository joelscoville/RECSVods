  - chapterId: c20260906-learning-prayer-from-jesus
    chapterTitle: Learning to Pray from Jesus’ Example
    chapterKind: sermon
    chapterStart: "45:05.94"
    chapterEnd: "56:52.82"
    points:
      - pointTime: "45:05.94"
        pointText: After praying for humility, the preacher considers Jesus’ intercession in John 17 and
          urges learning prayer through daily practice, drawing on an answer attributed to Billy
          Graham.
      - pointTime: "47:33.94"
        pointText: John 17 reveals an extended communication between the Son and the Father.
      - pointTime: "48:46.32"
        pointText: Jesus' own prayer is distinguished from the prayer taught to his followers in Matthew 6.
      - pointTime: "50:13.02"
        pointText: The portions of Jesus' prayer are connected with his intercession in Hebrews 7.
      - pointTime: "55:58.98"
        pointText: Morning and evening devotional practices illustrate regular prayer and meditation.
    subchapters:
      - chapterId: s0906-prayer-example
        chapterTitle: Prayer Is Learned through Practice
        chapterKind: sermon
        chapterStart: "52:13.66"
        chapterEnd: "56:52.82"
        points:
          - pointTime: "52:13.66"
            pointText: The preacher urges regular prayer and meditation rather than learning only through
              reading or listening, as Jesus prayed often and much.
          - pointTime: "53:40.74"
            pointText: Billy Graham's ministry illustrates the reach and responsibilities of Christian leadership.
          - pointTime: "55:00.22"
            pointText: The preacher recalls Graham's reported wish to have prayed more if he began ministry again.
          - pointTime: "55:58.98"
            pointText: Listeners are encouraged to practise prayer and meditation regularly.
        chapterScripture:
          - John 17
