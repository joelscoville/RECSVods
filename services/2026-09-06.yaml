  - chapterId: c20260906-glory-and-the-cross
    chapterTitle: Christ’s Path to Glory Leads through the Cross
    chapterKind: sermon
    chapterStart: "56:52.82"
    chapterEnd: "1:10:47.7"
    points:
      - pointTime: "56:52.82"
        pointText: The preacher contrasts human recognition with God’s inherent glory, connects Christ’s
          mission and return to the original state of glory with the cross, and recalls encouragement
          from continued service despite suffering.
    chapterScripture:
      - John 16:33
      - John 17:1
      - Psalms 19:1
      - John 17:1-5
  - chapterId: c20260906-eternal-life-as-knowing-god
    chapterTitle: What Is Eternal Life
    chapterKind: sermon
    chapterStart: "1:10:47.7"
    chapterEnd: "1:35:18.42"
    points:
      - pointTime: "1:10:47.7"
        pointText: Questioning eternal life as duration alone, the preacher interprets John 17:3 through
          relational knowledge of God and urges meditation, changed conduct and purposeful service,
          closing in prayer.

          Everyone who believes in Jesus Christ is called by the father and be saved.
    subchapters:
      - chapterId: s0906-knowing-god
        chapterTitle: Knowing God Vs Knowing About God
        chapterKind: sermon
        chapterStart: "1:19:16.04"
        chapterEnd: "1:31:21.22"
        points:
          - pointTime: "1:19:16.04"
            pointText: Eternal life is to know God, the only true God, and Jesus Christ. Knowing God vs Knowing
              about God. The preacher uses John 17:3, his account of ginóskó and Packer’s distinction
              between knowing God and knowing about God to urge lived relationship, reflection and use of
              one’s gifts. Eternal life is oneness with God.
        chapterScripture:
