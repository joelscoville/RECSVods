recordingTitle: That First Stone
serviceDate: 2025-10-26
status: draft
sermonDescription: The woman-caught-in-adultery account challenges selective accusation, self-righteousness and hypocrisy. Acknowledging the passage's manuscript uncertainty, the preacher reads its principles alongside Scripture's wider witness. Jesus' challenge exposes shared sin, while Romans 8 illuminates freedom from condemnation. Mercy is not permission to continue wrongdoing; present grace and final accountability are held together. Listeners are urged to correct their natural bias toward judgment by leading with grace and returning to Christ after failure.
sermonScripture:
  - John 8:1-11
  - Romans 8:1-4
  - 1 Corinthians 6:15-20
sermonTopics:
  - forgiveness
  - hypocrisy
  - repentance
