      - pointTime: "33:08.52"
        pointText: An open heart is presented as more important for receiving God's word than an impressive setting.
      - pointTime: "35:09.32"
        pointText: An impractical chicken project illustrates the need to understand real local conditions rather than assume a distant solution works.
      - pointTime: "37:17.78"
        pointText: A missionary teacher's tribute presents costly educational service as a witness beyond the congregation's comfortable surroundings.
  - chapterId: c20251026-recap
    chapterTitle: Receive the Life Christ Offers without Blocking Its Work
    chapterKind: sermon
    chapterStart: "44:35.4"
    chapterEnd: "49:34.62"
    chapterScripture:
      - John 7:37-39
    points:
      - pointTime: "45:36.02"
        pointText: Christ's invitation to the thirsty links spiritual need with coming to him for life.
      - pointTime: "46:00.64"
        pointText: Receiving the indwelling Spirit is connected with rivers of life that should reach beyond oneself.
      - pointTime: "47:25.68"
        pointText: The gap between that promise and ordinary conduct is examined through the choice to resist transformation.
  - chapterId: c20251026-text-law
    chapterTitle: Read the Account with Its Textual and Legal Context
    chapterKind: sermon
    chapterStart: "49:34.62"
    chapterEnd: "1:01:52.1"
    chapterScripture:
      - John 7:53-8:11
      - Leviticus 20:10
