    points:
      - pointTime: "50:02.04"
        pointText: The manuscript note introduces uncertainty about the account's place in John's original Gospel.
      - pointTime: "51:11.56"
        pointText: The preacher distinguishes textual debate from the account's consistency with wider biblical principles.
      - pointTime: "54:21.02"
        pointText: Israel's civil and ceremonial laws are distinguished from continuing moral obligations.
      - pointTime: "55:35.52"
        pointText: Old Testament law is understood as pointing toward Christ's fuller revelation rather than functioning independently of him.
  - chapterId: c20251026-trap-hypocrisy
    chapterTitle: Expose Selective Accusation and Hypocrisy
    chapterKind: sermon
    chapterStart: "1:01:52.1"
    chapterEnd: "1:16:28.4"
    chapterScripture:
      - John 8:3-6
      - 1 Corinthians 6:15-20
      - Matthew 23
    points:
      - pointTime: "1:02:13.72"
        pointText: Scripture, rather than a film's creative details, establishes that the accusation was intended to test Jesus.
      - pointTime: "1:04:13.24"
        pointText: The absent man exposes a selective application of a law directed toward both participants.
      - pointTime: "1:07:02.8"
        pointText: Paul's account of the body as God's temple connects sexual conduct with belonging and responsibility.
      - pointTime: "1:09:37.28"
        pointText: Fleeing temptation challenges the assumption that strength, wisdom or spiritual reputation make someone immune.
      - pointTime: "1:11:02.94"
        pointText: Self-righteousness is distinguished from hypocrisy, while both damage how people respond to sin.
  - chapterId: c20251026-first-stone
    chapterTitle: Shared Sin Removes the Claim to Throw the First Stone
    chapterKind: sermon
    chapterStart: "1:16:28.4"
    chapterEnd: "1:23:28.04"
    chapterScripture:
      - John 8:7-9
      - Matthew 5:27-28
    points:
      - pointTime: "1:16:34.52"
        pointText: The preacher directs attention back to the shared condition of sin rather than superiority over the accused.
      - pointTime: "1:18:05.46"
        pointText: Jesus' challenge prompts the accusers to examine themselves, with the oldest leaving first.
      - pointTime: "1:19:47.64"
        pointText: Truth exposes the mob's excitement and the false comfort of condemning another without facing oneself.
      - pointTime: "1:21:27.94"
        pointText: Living in truth can release people from damaging choices, while pride can still resist what is plain.
  - chapterId: c20251026-grace-accountability
    chapterTitle: Lead with Grace without Taking Mercy for Granted
    chapterKind: sermon
    chapterStart: "1:23:28.04"
    chapterEnd: "1:33:37.38"
    chapterScripture:
      - John 8:10-11
      - Romans 8:1-4
      - John 9:4
    points:
      - pointTime: "1:23:41.58"
        pointText: Condemnation is explained as judging someone beyond recovery, against Christ's offer of release.
      - pointTime: "1:25:58.24"
        pointText: Romans 8 grounds freedom from condemnation in Christ rather than innocence established by personal effort.
      - pointTime: "1:26:36.98"
        pointText: The instruction to sin no more prevents interpreting mercy as approval of continuing wrongdoing.
      - pointTime: "1:29:26.48"
        pointText: Present grace calls for a gracious response to other people rather than self-appointed condemnation.
      - pointTime: "1:32:26.6"
        pointText: Correcting a natural navigation bias illustrates deliberately correcting the tendency toward harsh judgment.
      - pointTime: "1:32:37.02"
        pointText: Final accountability remains real, so mercy should not be treated as indefinite permission to ignore sin.
