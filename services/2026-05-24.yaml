  - chapterId: c20260524-repentance-forgiveness
    chapterTitle: Seek Forgiveness Rather Than Remain in Regret
    chapterKind: sermon
    chapterStart: "1:23:28"
    chapterEnd: "1:34:40.5"
    points:
      - pointTime: "1:23:28.2"
        pointText: Acknowledging suicide's complexity, Pastor Yong contrasts Judas's regret with Peter's
          restoration, draws on John Stott to reject self-rescue, and urges repentance and
          forgiveness while warning against outward faith without belief.
      - pointTime: "1:24:54.34"
        pointText: Judas' regret is distinguished from repentance that seeks God's help.
      - pointTime: "1:28:20.3"
        pointText: A quotation attributed to John Stott contrasts self-substitution with God's saving substitution.
      - pointTime: "1:30:27.48"
        pointText: Peter's restoration and 1 John 1:9 encourage seeking forgiveness after failure.
      - pointTime: "1:32:59.58"
        pointText: Hebrews 6:4-6 is interpreted as a warning against outward participation without true belief.
    chapterScripture:
      - Matthew 27:3-5
      - John 21:15-17
      - 1 John 1:9
      - Hebrews 6:4-6
