  - chapterId: c20260524-responsibility-denial
    chapterTitle: Temptation Does Not Excuse Our Denial
    chapterKind: sermon
    chapterStart: "56:03.1"
    chapterEnd: "1:23:28"
    points:
      - pointTime: "56:03.1"
        pointText: Pastor Yong rejects prophecy and circumstances as excuses for Judas, uses James to
          distinguish temptation from yielding, and extends responsibility to Peter and to professed
          faith contradicted by conduct.
      - pointTime: "59:55.6"
        pointText: The musical's portrayal of Judas introduces a warning against shifting blame for sin.
      - pointTime: "1:05:16.04"
        pointText: James 1 excludes God as tempter while retaining responsibility for following personal desire.
      - pointTime: "1:12:15.32"
        pointText: Peter's promise is compared with extravagant worship words that may not be reflected in action.
      - pointTime: "1:20:56.28"
        pointText: Outward godliness without transformation is interpreted as denial of Christ's power.
    subchapters:
      - chapterId: s20260524-denial
        chapterTitle: Denial Extends Beyond Judas
        chapterKind: sermon
        chapterStart: "1:09:05.44"
        chapterEnd: "1:23:28"
        points:
          - pointTime: "1:09:05.44"
            pointText: Pastor Yong includes political and religious participants, Peter and the disciples in
              responsibility, then challenges himself and the congregation about words,
              self-reliance and conduct that deny Christ's power.
          - pointTime: "1:11:01.1"
            pointText: Pilate's name in the Creed is connected with the wider authority involved in the crucifixion.
          - pointTime: "1:16:33.96"
            pointText: Military slogans illustrate a gap between strong words and corresponding actions.
          - pointTime: "1:18:14.58"
            pointText: Peter's denial and the disciples' flight show that failure was not confined to Judas.
          - pointTime: "1:20:56.28"
            pointText: The preacher applies denial to self-reliance and conduct that contradicts professed faith.
        chapterScripture:
          - John 13:36-38
          - John 13:38
          - Mark 14:50
          - 1 Peter 3:18
          - 2 Timothy 3:1-5
          - 2 Timothy 3:5
