  - chapterId: c20260524-creed-authority
    chapterTitle: The Apostles' Creed, Tradition and Authority
    chapterKind: qa
    chapterStart: "33:00.58"
    chapterEnd: "36:40.86"
    points:
      - pointTime: "33:00.58"
        pointText: Pastor Yong distinguishes the Creed's uncertain authorship tradition from scriptural
          authority while affirming its declarative and baptismal value and offering his account of
          denominational differences.
      - pointTime: "34:07.3"
        pointText: Historical traditions should be labelled clearly and distinguished from scriptural authority.
      - pointTime: "35:21.4"
        pointText: The Creed's declarative and baptismal significance is affirmed without certainty about its traditional origin story.
