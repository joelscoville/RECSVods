  - chapterId: c20260524-betraying-innocent-christ
    chapterTitle: Judas Betrays the Innocent Christ
    chapterKind: sermon
    chapterStart: "36:40.86"
    chapterEnd: "56:02.52"
    points:
      - pointTime: "36:40.86"
        pointText: After recalling Jesus' loving service and praying for humble hearts, Pastor Yong presents
          Judas's betrayal as uniquely grave because of Jesus' innocence and traces the betrayal
          narrative.
      - pointTime: "39:14.2"
        pointText: Foot washing is explained as lowly service that surprised Peter.
      - pointTime: "42:44.7"
        pointText: The washing image is connected with regular confession by saved but imperfect people.
      - pointTime: "49:06.56"
        pointText: Jesus' innocence is presented as the reason Judas' betrayal is uniquely grave.
      - pointTime: "54:05.76"
        pointText: The morsel, Judas' departure and the other disciples' misunderstanding are traced in John.
    subchapters:
