recordingTitle: The Most Hideous Sin
serviceDate: 2026-05-24
status: draft
sermonDescription: Pastor Yong uses Judas's betrayal of the innocent Christ to challenge excuses for
  sin and the assumption that denial belongs only to Judas. He connects temptation and Peter's
  failure with the congregation's own words and conduct, then contrasts regret with repentance that
  seeks God's forgiveness rather than self-rescue. Acknowledging the complexity of suicide, he
  points to Peter's restoration as encouragement to return after failure.
sermonScripture:
  - John 13:1-20
  - John 14
  - John 13:1-2
sermonTopics:
  - discipleship
  - faith
  - repentance
