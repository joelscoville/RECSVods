recordingTitle: Timing
serviceDate: 2025-09-14
status: draft
sermonDescription: Jesus' delayed and private journey to the Feast of Booths illustrates decisions governed by God's will and timing rather than popularity, fear or pressure from others. Reflecting on a recent assassination, the preacher rejects violence over disagreement while acknowledging evil and opposition to truth. Faithful life includes persecution and practical wisdom, not passive exposure to harm. Scripture and prayerful counsel test whether an unusual course serves God or merely disguises self-interest.
sermonScripture:
  - John 7:1-13
  - Matthew 10:16-23
  - 2 Timothy 3:12-13
sermonTopics:
  - discernment
  - persecution
  - truth
