  - youtubeId: ejbeFoJcwLA
    uploadDuration: "1:43:42.669"
chapters:
  - chapterId: c20251019-worship
    chapterTitle: Worship and Receive the Life Christ Offers
    chapterKind: opening
    chapterStart: "0:07.7"
    chapterEnd: "30:41.3"
    chapterScripture:
      - Psalms 148:1-4
      - Proverbs 23:1-35
      - John 7:37-53
      - Galatians 5:19-24
    points:
      - pointTime: "20:34.32"
        pointText: Jason contrasts competing modern voices with Christ's direct invitation to receive living water.
  - chapterId: c20251019-guidance
    chapterTitle: Discern Guidance without Demanding a Guaranteed Outcome
    chapterKind: qa
    chapterStart: "30:41.3"
    chapterEnd: "48:39.04"
    points:
      - pointTime: "32:33.48"
        pointText: A question asks how to distinguish God's guidance from personal decisions labeled as his guidance.
      - pointTime: "35:09.4"
        pointText: Guidance is tested against Scripture rather than accepted because it promises personal prosperity.
      - pointTime: "42:03.78"
        pointText: Decisions within biblical limits still involve genuine choice, uncertainty and possible challenges.
      - pointTime: "44:56.24"
        pointText: Godly counsel is sought through shared life rather than trying to discern everything alone.
      - pointTime: "45:21.78"
        pointText: Prayer and, for serious decisions, fasting place a plan before God without functioning as a prediction mechanism.
      - pointTime: "45:43.94"
        pointText: Trust that God keeps his people is carried into the result, including outcomes unlike the ones hoped for.
  - chapterId: c20251019-recap
    chapterTitle: Recognize Christ beyond Familiar Human Expectations
    chapterKind: sermon
    chapterStart: "48:39.04"
    chapterEnd: "54:01.2"
    chapterScripture:
      - John 7:25-36
    points:
      - pointTime: "48:40.8"
        pointText: Christ means the anointed one rather than a surname, introducing expectations that can obscure Jesus' identity.
      - pointTime: "49:33.68"
        pointText: Human-shaped assumptions about God are contrasted with reverence toward the Creator.
      - pointTime: "51:13.72"
        pointText: Lives of costly faith are presented as witnesses that Christ is living and real.
      - pointTime: "52:56.08"
        pointText: Mockery is acknowledged alongside the gospel's power rather than treated as proof that faith is false.
  - chapterId: c20251019-divided-response
    chapterTitle: Status and Preconceptions Can Prevent Hearing Christ
    chapterKind: sermon
    chapterStart: "54:01.2"
    chapterEnd: "1:00:12.04"
    chapterScripture:
      - John 7:40-53
    points:
      - pointTime: "54:41.34"
        pointText: Disagreement about Jesus exposes interpretations driven by prior expectations and personal glory.
      - pointTime: "55:50.26"
        pointText: The officers' response recognizes the unusual force of Christ's words.
      - pointTime: "56:21.48"
        pointText: Confidence that Scripture itself can convict supports sharing the word rather than relying only on persuasive prestige.
      - pointTime: "59:49.76"
        pointText: Nicodemus asks for a hearing while the leaders dismiss him through assumptions about Galilee.
  - chapterId: c20251019-thirst-choice
    chapterTitle: Recognize Spiritual Thirst and Come to Its Source
    chapterKind: sermon
    chapterStart: "1:00:12.04"
    chapterEnd: "1:09:44.52"
    chapterScripture:
      - John 7:37
      - John 4:13-14
      - Deuteronomy 30:15-18
    points:
      - pointTime: "1:02:05.74"
        pointText: Christ's invitation interrupts the festival's water symbolism with an open declaration of spiritual life.
      - pointTime: "1:03:49.36"
        pointText: Jesus gives himself as the source of living water rather than merely dispensing a spiritual benefit.
      - pointTime: "1:06:23.74"
        pointText: The conditional invitation is interpreted through recognizing need and deciding to seek relief.
      - pointTime: "1:06:38.82"
        pointText: Spiritual need can remain unaddressed when people believe they are already well.
      - pointTime: "1:08:23.9"
        pointText: Moses' two paths illustrate that clear instruction does not remove personal responsibility to choose a response.
  - chapterId: c20251019-spirit-fruit
    chapterTitle: The Indwelling Spirit Should Overflow in Our Lives
    chapterKind: sermon
    chapterStart: "1:09:44.52"
    chapterEnd: "1:17:09.9"
    chapterScripture:
      - John 7:38-39
      - John 14:15-17
      - Galatians 5:22-23
    points:
      - pointTime: "1:09:48.48"
        pointText: Rivers of living water are connected with the Spirit received by those who believe in Christ.
      - pointTime: "1:10:04.4"
        pointText: John 14 supplies the promise of a helper dwelling with and in believers.
      - pointTime: "1:12:15.12"
        pointText: The Spirit's fruit identifies love, joy, peace and other qualities by which the promised outflow becomes concrete.
      - pointTime: "1:13:28.6"
        pointText: The congregation is asked whether people who know them would actually describe their lives through these qualities.
      - pointTime: "1:15:38.12"
        pointText: The gap between promise and conduct prompts self-examination rather than assuming that God's character has changed.
  - chapterId: c20251019-obedient-transformation
    chapterTitle: Cooperate with Transformation through Everyday Choices
    chapterKind: sermon
    chapterStart: "1:17:09.9"
    chapterEnd: "1:29:35.2"
    chapterScripture:
      - Matthew 5:48
      - Romans 6:16-18
    points:
      - pointTime: "1:18:39.04"
        pointText: Lewis's account of sanctification connects God's purpose of transformation with the possibility of resisting it.
      - pointTime: "1:21:32.68"
        pointText: Daily crossroads include responding to a spouse with harshness or with the grace Scripture calls for.
      - pointTime: "1:22:25.68"
        pointText: A saying attributed to Nouwen presents joy as a repeated choice amid difficult circumstances.
      - pointTime: "1:27:10.94"
        pointText: Romans 6 challenges life centered only on one's preferences by describing a new obedience to righteousness.
      - pointTime: "1:28:50.18"
        pointText: Small acts of care and the widow's gift show that meaningful service need not resemble a famous preacher's work.
  - chapterId: c20251019-response
    chapterTitle: Become a Blessing through God's Strength
    chapterKind: closing
    chapterStart: "1:29:35.2"
    chapterEnd: "1:43:42.669"
    points:
      - pointTime: "1:29:35.44"
        pointText: Response prayer asks for obedience that allows the Spirit's work to make life a blessing beyond oneself.
      - pointTime: "1:34:27.32"
        pointText: Prayer joins reliance on God with practical help and love expressed in deeds.
