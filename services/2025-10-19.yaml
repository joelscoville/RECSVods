recordingTitle: Rivers of Living Water
serviceDate: 2025-10-19
status: draft
sermonDescription: Christ's invitation to the thirsty promises the Spirit's indwelling and an outward flow of life. The preacher first distinguishes biblical guidance from demanding certainty about every decision, then considers divided responses to Jesus. Recognizing spiritual need and choosing to come are joined with the Spirit's fruit. The gap between promised transformation and ordinary conduct is examined through resistance, sanctification and repeated choices, calling believers toward service beyond personal comfort through God's strength.
sermonScripture:
  - John 7:37-53
  - Galatians 5:19-24
  - John 14:15-17
sermonTopics:
  - holy-spirit
  - sanctification
  - service
