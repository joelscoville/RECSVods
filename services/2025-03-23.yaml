recordingTitle: Agnus Dei
serviceDate: 2025-03-23
status: draft
sermonDescription: >-
  John the Baptist's identification of Jesus as the Lamb of God connects Christ with the Passover and God's plan across history. The preacher contrasts sacrificial humility with familiar symbols of power, then follows three movements: the plan transcends time and space, must be revealed and must be shared. Believers receive purpose within that plan and become witnesses who prepare others to receive Christ through truthful proclamation, kindness and ordinary service rather than claiming to control conversion.
sermonScripture:
  - John 1:29-34
  - Exodus 12:1-13
  - Philippians 2:5-8
sermonTopics:
  - salvation
  - knowing-god
  - mission
