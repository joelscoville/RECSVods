  - chapterId: c20260621-knowing-spirit-scripture
    chapterTitle: Knowing the Spirit Begins With Scripture
    chapterKind: sermon
    chapterStart: "1:11:21.7"
    chapterEnd: "1:28:23.86"
    points:
      - pointTime: "1:11:21.92"
        pointText: Yong uses qualified church-size estimates, his account of charismatic history and
          unverified recollections to frame the congregation's position, grounding knowledge of the
          Spirit in Scripture while acknowledging the Trinity's mystery.
      - pointTime: "1:15:13.82"
        pointText: The preacher presents an account of charismatic history beginning with Azusa Street while acknowledging earlier phenomena.
      - pointTime: "1:17:59.22"
        pointText: The congregation's position is distinguished from cessationism and extreme charismatic practices.
      - pointTime: "1:20:06.9"
        pointText: Army-fellowship experiences illustrate the preacher's skepticism toward extraordinary spiritual claims.
      - pointTime: "1:24:08.46"
        pointText: Scripture and the Westminster Confession provide the basis for understanding the Trinity.
    subchapters:
      - chapterId: s20260621-scripture-trinity
        chapterTitle: Scripture Guides Understanding of the Trinity
        chapterKind: sermon
        chapterStart: "1:24:02.94"
        chapterEnd: "1:28:23.86"
        points:
          - pointTime: "1:24:02.94"
            pointText: Yong appeals to Scripture and the Westminster Confession while recognizing limits of
              comprehension and translation, contrasting biblical inquiry with reliance on
              impressions or visions.
          - pointTime: "1:25:35.66"
            pointText: Biblical teaching about the Trinity is affirmed while complete understanding and translation remain limited.
          - pointTime: "1:26:56.18"
            pointText: Biblical inquiry is contrasted with relying on impressions, visions or perceived signs.
        chapterScripture:
          - John 17:17
          - John 14:15-16
    chapterScripture:
      - John 14:16
      - John 14-16
      - John 17:17
      - John 14:15-16
  - chapterId: c20260621-spirit-help-presence
    chapterTitle: The Spirit Helps and Stays With Believers
    chapterKind: sermon
    chapterStart: "1:28:23.86"
    chapterEnd: "1:34:40.56"
    points:
      - pointTime: "1:28:23.86"
        pointText: Yong presents the divine Spirit's intercession and abiding presence with the Father and
          Son as help in weakness and loneliness, including practical support through believers and
          differing readings of 'that day'.
      - pointTime: "1:29:51.64"
        pointText: Romans 8:26-27 explains the Spirit's help and intercession in weakness.
      - pointTime: "1:31:11.6"
        pointText: Different interpretations of 'that day' are considered without claiming unanimous agreement.
      - pointTime: "1:32:18"
        pointText: John 14:21-24 connects indwelling with the promised presence of Father and Son.
      - pointTime: "1:33:10.7"
        pointText: The Spirit's lasting presence is joined with practical help from fellow believers.
    chapterScripture:
      - John 14:16
      - Romans 8:26-27
      - John 14:17-20
      - John 14:21-24
      - John 14:16-24
  - chapterId: c20260621-spirit-truthful-living
    chapterTitle: The Spirit of Truth Calls Us to Truthful Living
    chapterKind: sermon
    chapterStart: "1:34:40.56"
    chapterEnd: "1:41:22.74"
    points:
      - pointTime: "1:34:40.56"
        pointText: Yong applies the Spirit of truth to engineering, online opinion and qualified court
          commentary, urging objective and theological testing of claims before praying for truthful
          living through the Spirit's help.
      - pointTime: "1:36:12.22"
        pointText: Blurred boundaries between opinion and fact are applied to online reactions and algorithmic reinforcement.
      - pointTime: "1:37:29.24"
        pointText: Court decisions illustrate the difficulty of seeking truth, while the system is called the best available.
      - pointTime: "1:38:59.76"
        pointText: The preacher asks whether claims are objectively and theologically true.
      - pointTime: "1:40:32.12"
        pointText: Prayer asks for truthful living in both large and small matters.
    chapterScripture:
      - John 14:16-17
      - Romans 8:26-27
  - chapterId: c20260621-creed-fathers-appreciation
    chapterTitle: Creed and Father's Day Appreciation
    chapterKind: other
    chapterStart: "1:41:22.74"
    chapterEnd: "1:48:30.32"
    points:
      - pointTime: "1:41:22.74"
        pointText: The congregation affirms the Apostles' Creed before an unidentified speaker reflects on
          enduring fatherhood and makes gender-role claims, followed by children's gifts and prayer
          for fathers and families.
      - pointTime: "1:42:08.22"
        pointText: The speaker recalls the change in identity at the birth of his first daughter.
      - pointTime: "1:43:19.68"
        pointText: Parenthood is described as enduring before the Father's Day appreciation.
      - pointTime: "1:44:38"
        pointText: Children distribute tokens of appreciation while fathers stand.
      - pointTime: "1:47:35.78"
        pointText: Prayer asks for fathers' physical, emotional and spiritual health and their care for children.
