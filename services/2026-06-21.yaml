    chapterKind: sermon
    chapterStart: "48:18.92"
    chapterEnd: "1:11:21.02"
    points:
      - pointTime: "48:18.92"
        pointText: Yong argues that love for Christ produces repentant action and lifelong restoration
          beyond rule-keeping or religious transactions, using kindness and marriage illustrations
          while acknowledging continuing failure and temptation.
