  - chapterId: c20260621-learning-serving
    chapterTitle: Following Jesus Means Learning and Serving
    chapterKind: sermon
    chapterStart: "36:13.72"
    chapterEnd: "48:18.92"
    points:
      - pointTime: "36:13.72"
        pointText: Introducing the Spirit's promise, Yong recaps Greater Works as wider ministry reach,
          urging humble lifelong learning, service by every believer and prayer for God's purposes
          rather than wealth-based aspirations or formulas.
      - pointTime: "38:14.3"
        pointText: Philip's question about the Father illustrates the need for lifelong humility.
      - pointTime: "41:14.86"
        pointText: Asking what Jesus would do is offered as an imperfect but useful reminder at life's crossroads.
      - pointTime: "43:24.04"
        pointText: Every believer is entrusted with work, beyond those specifically called as pastors.
      - pointTime: "46:34.6"
        pointText: Starting with available resources leads to a cycle of service, learning and joy.
    chapterScripture:
      - John 14:15-24
      - Romans 8:26-30
      - John 14:8-14
      - John 14:12
      - John 14:13-14
  - chapterId: c20260621-love-restores-life
    chapterTitle: Love for Christ Changes How We Live
    chapterKind: sermon
    chapterStart: "48:18.92"
    chapterEnd: "1:11:21.7"
    points:
      - pointTime: "48:18.92"
        pointText: Yong argues that love for Christ produces repentant action and lifelong restoration
          beyond rule-keeping or religious transactions, using kindness and marriage illustrations
          while acknowledging continuing failure and temptation.
      - pointTime: "50:00.32"
        pointText: Kindness among people of different beliefs shows why doing good alone does not establish Christian identity.
      - pointTime: "54:03.08"
        pointText: A believer's failures are distinguished from persistent harm through grief over sin and a desire to repent.
      - pointTime: "1:00:26"
        pointText: Redemption is presented as rescue and restoration of life, with lifelong sanctification.
      - pointTime: "1:07:49.84"
        pointText: Marriage vows illustrate commitment that endures changes in health and wealth.
    subchapters:
      - chapterId: s20260621-restoration
        chapterTitle: Christ Restores Life Beyond Rule-Keeping
        chapterKind: sermon
        chapterStart: "55:07.78"
        chapterEnd: "1:03:53.96"
        points:
          - pointTime: "55:07.78"
            pointText: Yong distinguishes redemption from lifelong restoration, presenting Christ's commandments
              as pointing to Christ himself and a changed identity rather than a checklist.
          - pointTime: "55:59.92"
            pointText: John 14:6 directs attention to Christ himself rather than a list of rules.
          - pointTime: "58:01.36"
            pointText: The rich young man's encounter shows why following Christ goes beyond a checklist.
          - pointTime: "1:00:26"
            pointText: Rescue from condemnation is distinguished from lifelong restoration of life.
          - pointTime: "1:02:43.3"
            pointText: A changed-identity metaphor illustrates a renewed desire for Christ and the life God intends.
        chapterScripture:
          - John 14:6
          - John 10:10
          - Galatians 5:22-23
      - chapterId: s20260621-transactional-faith
        chapterTitle: Faithful Love Goes Beyond Transactions
        chapterKind: sermon
        chapterStart: "1:03:53.96"
        chapterEnd: "1:11:21.7"
        points:
          - pointTime: "1:03:53.96"
            pointText: Yong challenges religious bargaining and consumer expectations through enduring marriage
              vows, including an unverified account attributed to Pat Robertson, before returning to
              transformation amid temptation.
          - pointTime: "1:05:16.7"
            pointText: Treating a talisman or Bible as a charm illustrates bargaining for divine favor.
          - pointTime: "1:06:41.36"
            pointText: Questions about amenities and school connections illustrate consumer expectations of church.
          - pointTime: "1:07:49.84"
            pointText: Enduring marriage vows illustrate love that is not conditional on health or wealth.
          - pointTime: "1:10:31.04"
            pointText: Changed identity does not eliminate temptation, introducing the need for a helper.
