sermonDescription: Reading the dinner at Bethany in John 12, the preacher contrasts Martha's practical service, Mary's costly devotion and Judas' false concern for the poor. Different gifts have a place in faithful ministry, while real devotion recognizes Christ's worth beyond social expectations and possessions. The treasure, pearl and sower parables lead to a call for receptive hearts that surrender choking cares and bear fruit despite weak faith.
