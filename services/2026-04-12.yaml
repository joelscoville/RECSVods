        chapterKind: sermon
        chapterStart: "56:54.8"
        chapterEnd: "1:05:58.2"
        points:
          - pointTime: "56:54.92"
            pointText: Martha's familiar serving role is considered alongside the earlier call to listen to Jesus.
          - pointTime: "59:03.92"
            pointText: Her continuing service is recognized without a repeated rebuke in John 12.
          - pointTime: "1:01:33.76"
            pointText: Every servant receives a gift and is accountable for using what was entrusted.
          - pointTime: "1:02:40.84"
            pointText: Logistics, food and audiovisual work illustrate essential ministry behind the scenes.
          - pointTime: "1:04:20.94"
            pointText: A welcoming elder's faithful coffee and personal greetings illustrate the value of ordinary service.
