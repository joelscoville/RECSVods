recordingTitle: The Problem of Truth
serviceDate: 2025-03-02
status: draft
sermonDescription: >-
  John's true light challenges a world of competing voices and relative claims. The preacher considers God's truth as encompassing scientific, moral and biblical understanding, and connects freedom with abiding in Christ's word. Yet truth is resisted in public conflicts and personal relationships because human beings suppress what challenges them. Receiving Christ brings the right to become God's children through faith and grace, calling believers toward truthful conduct, humble communication and discernment about what they can change.
sermonScripture:
  - John 1:9-13
  - John 8:31-32
  - Romans 1:18-21
sermonTopics:
  - truth
  - discernment
  - faith
