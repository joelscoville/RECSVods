recordingTitle: Multiplication
serviceDate: 2025-08-03
status: draft
sermonDescription: The feeding of the multitude reveals Christ's compassion and his use of ordinary people as channels of blessing. The preacher contrasts witnessed miracles with the disciples' continued lack of awareness, then presents Andrew and the boy as examples of bringing people and available resources to Jesus. Pursuing worldly glory and confusing unwillingness with inability can prevent surrender. God-given gifts are for the common good, and their faithful use can make life a blessing beyond minimal participation or self-preservation.
sermonScripture:
  - John 6:1-15
  - 2 Corinthians 9:8-11
  - 1 Corinthians 12:7-11
sermonTopics:
  - service
  - stewardship
  - discipleship
