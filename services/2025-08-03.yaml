      - pointTime: "49:54.8"
        pointText: Believers are challenged to be good witnesses rather than become the reason another person rejects the faith.
  - chapterId: c20250803-compassion
    chapterTitle: Everything Begins with God's Compassion
    chapterKind: sermon
    chapterStart: "50:50.34"
    chapterEnd: "1:04:02.1"
    chapterScripture:
      - John 6:1-4
      - Matthew 9:35-38
      - Mark 6:30-34
    points:
      - pointTime: "53:49.91"
        pointText: Jesus' attempt to rest is overtaken by the crowd, setting the contrast between interruption and compassionate response.
      - pointTime: "57:26.31"
        pointText: Compassion is identified as a mark of Christian ministry rather than treating care as an optional extra.
      - pointTime: "1:00:35.97"
        pointText: The preacher's call to service begins with seeing the harassed and helpless people behind a familiar ministry verse.
      - pointTime: "1:01:41.51"
        pointText: God's prior love is presented as the beginning of redemption and the ground for believers' response.
  - chapterId: c20250803-human-channels
    chapterTitle: God's Method Makes People Channels of Blessing
    chapterKind: sermon
    chapterStart: "1:04:02.1"
    chapterEnd: "1:10:54.5"
    chapterScripture:
      - John 6:5-7
    points:
      - pointTime: "1:04:40.27"
        pointText: Christ's test of Philip introduces the choice to work through people despite their limitations.
      - pointTime: "1:04:59.21"
        pointText: God using human channels is distinguished from an inability to act directly himself.
      - pointTime: "1:07:28.19"
        pointText: Refusing to provide help is considered as a failure of responsibility rather than proof that God lacks compassion.
      - pointTime: "1:09:11.95"
        pointText: Remembering earlier miracles does not guarantee awareness of God's presence in the next difficult situation.
  - chapterId: c20250803-bring-surrender
    chapterTitle: Bring People and Their Gifts to Jesus
    chapterKind: sermon
    chapterStart: "1:10:54.5"
    chapterEnd: "1:26:19.2"
    chapterScripture:
      - John 6:8-9
      - 1 Corinthians 12:7-11
    points:
      - pointTime: "1:10:54.73"
        pointText: A boy's modest food supply introduces the possibility that a small gift can matter.
      - pointTime: "1:14:19.01"
        pointText: Andrew's role shows that bringing someone to Christ does not require being the expert preacher oneself.
      - pointTime: "1:19:29.09"
        pointText: The boy's surrender prompts the preacher to ask why so many other people hesitate to offer what they have.
      - pointTime: "1:21:14.95"
        pointText: God's quieter and delayed glory is contrasted with the immediate attraction of visible worldly success.
      - pointTime: "1:25:04.51"
        pointText: The Spirit's gifts are given for the common good, challenging claims that there is nothing one can contribute.
  - chapterId: c20250803-willing-multiplication
    chapterTitle: Willing Surrender Makes a Life of Multiplication Possible
    chapterKind: sermon
    chapterStart: "1:26:19.2"
    chapterEnd: "1:37:59.37"
    chapterScripture:
      - John 6:10-15
      - 2 Corinthians 9:8-11
    points:
      - pointTime: "1:26:19.49"
        pointText: Possessing gifts is distinguished from deciding to use them.
      - pointTime: "1:28:13.65"
        pointText: The Mencius illustration separates genuine inability from unwillingness to take a possible action.
      - pointTime: "1:29:13.35"
        pointText: Multiplication describes resources becoming a wider blessing rather than only adding one small contribution.
      - pointTime: "1:31:25.03"
        pointText: The boy's experience is used to connect surrendered gifts with a life made fuller through service.
      - pointTime: "1:35:34.21"
        pointText: Minimal participation aimed only at remaining acceptable is contrasted with pursuing life's central purpose.
      - pointTime: "1:36:34.95"
        pointText: Paul connects God's sufficient provision with generosity and a harvest of good work.
