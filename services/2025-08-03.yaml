      - pointTime: "38:40.72"
        pointText: The question of making life count introduces purpose beyond simply passing through daily routines.
      - pointTime: "39:01.32"
        pointText: Asking early is distinguished from waiting for a crisis before deciding to use life meaningfully.
      - pointTime: "41:19.48"
        pointText: Scripture is offered as the guide to what makes life valuable rather than relying on surrounding measures of success.
      - pointTime: "45:12.2"
        pointText: The orphanage project connects meaningful life with practical responsibility beyond the safety of one's immediate surroundings.
  - chapterId: c20250803-witness-recap
