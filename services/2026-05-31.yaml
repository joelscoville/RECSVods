  - chapterId: c20260531-glory-humility
    chapterTitle: Glorify God in Suffering and Humility
    chapterKind: sermon
    chapterStart: "38:01.2"
    chapterEnd: "1:07:26.56"
    points:
      - pointTime: "38:01.2"
        pointText: Explaining the Last Supper setting, the preacher connects glory with the cross, defends
          human worth and forgiveness through technological and denominational illustrations, and
          urges everyday faithfulness and childlike humility amid suffering and ageing.
    subchapters:
