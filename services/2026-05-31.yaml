  - chapterId: c20260531-regret-repentance
    chapterTitle: Turn from Regret to Repentance
    chapterKind: sermon
    chapterStart: "29:12.92"
    chapterEnd: "38:01.2"
    points:
      - pointTime: "29:12.92"
        pointText: Recapping Judas’s betrayal, the preacher extends responsibility for failure beyond Judas,
          distinguishes regret from repentance, emphasizes forgiveness and sincere commitment, and
          urges medical help for suicidal distress.
      - pointTime: "30:31.74"
        pointText: Sympathetic portrayals of Judas are contrasted with the preacher's reading of theft and responsibility.
      - pointTime: "33:27.38"
        pointText: Failure extends to Peter and the congregation as regret is distinguished from repentance.
      - pointTime: "35:06.96"
        pointText: The preacher urges serious medical help for people experiencing suicidal distress.
      - pointTime: "37:03.82"
        pointText: Sincere commitment and repentance are urged instead of testing whether one is saved.
    chapterScripture:
      - John 13
      - John 12:6
      - James 1
  - chapterId: c20260531-glory-humility
    chapterTitle: Glorify God in Suffering and Humility
    chapterKind: sermon
    chapterStart: "38:01.2"
    chapterEnd: "1:07:26.56"
    points:
      - pointTime: "38:01.2"
        pointText: Explaining the Last Supper setting, the preacher connects glory with the cross, defends
          human worth and forgiveness through technological and denominational illustrations, and
          urges everyday faithfulness and childlike humility amid suffering and ageing.
      - pointTime: "43:07.7"
        pointText: Glory through the cross is contrasted with ordinary expectations of victory.
      - pointTime: "50:36.84"
        pointText: Human weakness should not diminish life's worth or the need for forgiveness.
      - pointTime: "54:45.7"
        pointText: Glorifying God is applied to every activity, including suffering.
      - pointTime: "1:01:12.58"
        pointText: Childlikeness is explained as humility rather than loss of maturity.
    subchapters:
      - chapterId: s20260531-childlikeness
        chapterTitle: Remain Childlike as You Grow Older
        chapterKind: sermon
        chapterStart: "58:35.4"
        chapterEnd: "1:07:26.56"
        points:
          - pointTime: "58:35.4"
            pointText: Interpreting Jesus’s affectionate address and Matthew 18, the preacher distinguishes
              humility from childishness and uses reported later-life examples to encourage openness
              to God and continuing purpose.
          - pointTime: "59:55.9"
            pointText: Being beloved by God introduces a saying from Matthew 18.
          - pointTime: "1:01:12.58"
            pointText: Humility is considered alongside burdens accumulated with age.
          - pointTime: "1:03:35.1"
            pointText: Childlikeness is distinguished from childishness.
          - pointTime: "1:06:06.64"
            pointText: Reported examples of later-life work encourage openness and continuing purpose.
        chapterScripture:
          - John 13:33
          - 1 John 2-4
          - Matthew 18
