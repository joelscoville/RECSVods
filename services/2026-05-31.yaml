  - chapterId: c20260531-love-identifies-followers
    chapterTitle: Love Identifies Christ’s Followers
    chapterKind: sermon
    chapterStart: "1:07:26.56"
    chapterEnd: "1:16:13.3"
    points:
      - pointTime: "1:07:26.56"
        pointText: The preacher argues that the new command makes love the defining mark of Christ’s
          followers rather than social identity, institutional grandeur or power, urging charities
          to collaborate rather than compete.
      - pointTime: "1:08:22.52"
        pointText: The new commandment is compared with earlier biblical commands.
      - pointTime: "1:10:51.22"
        pointText: Love is contrasted with nationality, dialect and profession as the defining Christian identity.
      - pointTime: "1:12:31.62"
        pointText: An impressive church building raises questions about how God is glorified.
      - pointTime: "1:15:05.16"
        pointText: Competition among charities is challenged through the command to love.
    chapterScripture:
      - John 13:34
      - Deuteronomy 6:4-5
      - Matthew 22
      - John 13:34-35
      - 1 John 4
      - John 13:35
  - chapterId: c20260531-life-beyond-self
    chapterTitle: Share Life Beyond Self and Family
    chapterKind: sermon
    chapterStart: "1:16:13.3"
    chapterEnd: "1:23:06.58"
    points:
      - pointTime: "1:16:13.3"
        pointText: The preacher calls for forgiveness and practical mutual support beyond self and family,
          drawing on Amish community life while questioning insularity and proposing cell groups
          with uncertainty about their outcome.
      - pointTime: "1:17:34.18"
        pointText: Loving others is distinguished from self-hatred and isolated faith.
      - pointTime: "1:19:03.62"
        pointText: Online sermons should not replace forgiving and supporting people in community.
      - pointTime: "1:20:44.04"
        pointText: A mutually supportive community is imagined as a source of reduced anxiety.
      - pointTime: "1:22:44.26"
        pointText: Cell groups are proposed as a way to cultivate shared life without guaranteeing outcomes.
    chapterScripture:
      - John 13:34
  - chapterId: c20260531-love-as-christ-commands
    chapterTitle: Love as Christ Commands
    chapterKind: sermon
    chapterStart: "1:23:06.58"
    chapterEnd: "1:28:17.72"
    points:
      - pointTime: "1:23:06.58"
        pointText: The preacher presents Jesus’s footwashing as the model for love and forgiveness in
          everyday relationships, calling for childlike obedience to a command rather than a
          consumer choice.
      - pointTime: "1:24:44.26"
        pointText: Jesus' model is applied to loving and forgiving family, colleagues and community.
      - pointTime: "1:26:28.9"
        pointText: Conflict among Christian leaders illustrates why love is a command, not an optional suggestion.
      - pointTime: "1:27:26.66"
        pointText: The conclusion calls for visible love beyond one's own household.
    chapterScripture:
      - John 13
      - John 13:34-35
      - John 13:34
