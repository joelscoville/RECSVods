sermonDescription: Concluding John 8, the preacher connects Jesus' calm response to insults with his divine identity and complete security. Thomas Harris's transactional analysis and the image of an onion introduce human insecurity and concealed identities. Scripture guides believers toward Christ through sanctification, while religious leaders' failures call for both confidence in God's word and serious accountability. Living well in the truth is urged alongside practical action against injustice.
