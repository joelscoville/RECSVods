    points:
      - pointTime: "46:10.26"
        pointText: The opposing religious leaders insult Jesus as a Samaritan and demon-possessed man.
      - pointTime: "47:06.84"
        pointText: The cultural force of these insults is explained through the earlier Samaritan encounter.
      - pointTime: "49:59.66"
        pointText: Jesus points to the Father's judgment and the promise of life rather than defending his own glory.
      - pointTime: "50:30.72"
        pointText: The preacher considers why Jesus does not enter an angry quarrel or retaliate.
      - pointTime: "53:31.98"
        pointText: Isaiah's prophecy describes a servant who brings justice without loud quarrelling.
  - chapterId: c20260111-insecurity
    chapterTitle: Human Insecurity and the Layers of Identity
    chapterKind: sermon
    chapterStart: "55:32.4"
    chapterEnd: "1:11:32.34"
    points:
      - pointTime: "55:53.02"
        pointText: Thomas Harris's I'm Okay, You're Okay introduces transactional analysis and insecurity.
      - pointTime: "58:58.28"
        pointText: Different attitudes toward self and others are connected with hopelessness or aggression.
      - pointTime: "1:00:32.6"
        pointText: Being at peace with oneself and accepting others is presented as Harris's desirable outcome.
      - pointTime: "1:04:13.4"
        pointText: An onion illustrates the many layers that can conceal a person's core identity.
      - pointTime: "1:05:41.08"
        pointText: A reported religious leader's failure illustrates the limits of knowing someone through public work.
  - chapterId: c20260111-christ-identity
    chapterTitle: Christ's Divine Identity Is His Ultimate Security
    chapterKind: sermon
    chapterStart: "1:11:32.34"
    chapterEnd: "1:18:36.65"
    chapterScripture:
      - John 8:52-59
      - Hebrews 1:1-4
    points:
      - pointTime: "1:11:32.34"
        pointText: The passage reveals Christ's identity beneath the surface of the argument.
      - pointTime: "1:11:51.24"
        pointText: The leaders question Jesus' promise of life by invoking Abraham and the prophets.
      - pointTime: "1:13:37.32"
        pointText: Jesus' divine identity explains why he does not need to establish himself through quarrels.
      - pointTime: "1:16:26.64"
        pointText: Before Abraham was, I am is considered as a profound declaration of who Jesus is.
      - pointTime: "1:17:42.34"
        pointText: Hebrews 1 reinforces Christ's glory, divine nature and sustaining power.
