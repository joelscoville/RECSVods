        pointText: Believers' insecurity raises the question of how to move toward Christ's example.
      - pointTime: "1:20:20.92"
        pointText: The Westminster Confession describes Scripture's guidance for God's glory, salvation, faith and life.
      - pointTime: "1:22:01.1"
        pointText: 2 Corinthians 3 presents transformation into Christ's image from one degree of glory to another.
      - pointTime: "1:29:06.48"
        pointText: Matthew 23 distinguishes hearing God's word from copying a teacher's unfaithful conduct.
      - pointTime: "1:34:08.6"
        pointText: Living well in the truth is urged alongside appropriate practical action against injustice.
