  - chapterId: c20260111-insults
    chapterTitle: Christ's Calm Response to Insults
    chapterKind: sermon
    chapterStart: "46:10.0"
    chapterEnd: "55:32.4"
    chapterScripture:
      - John 8:48-51
      - Isaiah 42:1-4
