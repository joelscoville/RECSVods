recordingTitle: BC and AD
serviceDate: 2025-12-21
status: draft
sermonDescription: Christmas is presented as more than cultural goodwill or a familiar annual story. Immanuel identifies God's initiative in coming to humanity, while prophecy, the manger and the announcement to shepherds reveal divine action beyond ordinary expectations of grandeur. The preacher connects Christ's historical influence with the shepherds' immediate transformation, asking whether knowing God with us has produced a meaningful before-and-after in each believer's life.
sermonScripture:
  - Matthew 1:18-23
  - Luke 2:1-21
sermonTopics:
  - knowing-god
  - faith
  - salvation
