recordingTitle: Undeserved
serviceDate: 2025-03-09
status: draft
sermonDescription: >-
  The Word becoming flesh reveals God coming to humanity, known through the apostles' lived encounter with Christ. John describes his glory through grace and truth. The preacher explores grace as undeserved, unceasing and unmistakable in Jesus. Undeserved favor calls for humility and service without entitlement; grace upon grace calls for gratitude amid life's difficulties. Christ's example holds grace and truth together, inviting believers to know the Jesus of Scripture and reflect him in daily relationships.
sermonScripture:
  - John 1:14-18
  - 1 John 1:1
sermonTopics:
  - salvation
  - knowing-god
  - service
