    chapterEnd: "54:47"
    subchapters:
      - chapterId: c20250309-undeserved
        chapterTitle: Undeserved Grace Calls for Humility
        chapterKind: sermon
        chapterStart: "25:34.76"
        chapterEnd: "35:11.52"
        chapterScripture:
          - Romans 11:6
          - Luke 17:7-10
        points:
          - pointTime: "26:17.28"
            pointText: Grace is distinguished from a transaction in which a benefit is earned by the recipient.
          - pointTime: "29:10.2"
            pointText: Understanding acceptance as undeserved makes humility a natural response rather than a performance of manners.
          - pointTime: "32:38.24"
            pointText: The unworthy-servant teaching challenges demanding special recognition for fulfilling one's responsibility.
          - pointTime: "34:20.08"
            pointText: Comparing ministry gifts and rewards illustrates how entitlement can displace the joy of serving.
      - chapterId: c20250309-unceasing
        chapterTitle: Unceasing Grace Calls for Gratitude
        chapterKind: sermon
        chapterStart: "35:11.52"
        chapterEnd: "48:03.56"
        chapterScripture:
          - John 1:16
          - John 10:10
        points:
          - pointTime: "36:15.16"
            pointText: Grace upon grace is presented as gift and blessing overflowing from Christ's fullness.
          - pointTime: "37:47.8"
            pointText: Eternal life is held alongside abundant life here and now.
          - pointTime: "40:30.68"
            pointText: Gratitude changes one's relation to what has been received rather than guaranteeing greater wealth.
          - pointTime: "43:37.56"
            pointText: Encounters with poverty challenge habits of comparison, dissatisfaction and taking existing gifts for granted.
          - pointTime: "46:21.12"
            pointText: The appeal redirects attention from constantly pursuing what is absent toward recognizing grace already present.
      - chapterId: c20250309-unmistakable
        chapterTitle: Christ Makes Grace and Truth Known
