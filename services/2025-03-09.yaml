          - Colossians 1:15
          - Colossians 1:19
        points:
          - pointTime: "48:03.56"
            pointText: The law exposing humanity's inability is distinguished from the grace and truth brought through Christ.
          - pointTime: "49:47.44"
            pointText: Parenting illustrates why indulgence without truth or strictness without grace is incomplete.
          - pointTime: "51:29.92"
            pointText: Christ as the image of the invisible God provides a personal focus amid theological complexity.
          - pointTime: "53:34.32"
            pointText: What would Jesus do requires knowing the Jesus of Scripture rather than inventing a preferred version of him.
  - chapterId: c20250309-response
