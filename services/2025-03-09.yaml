    points:
      - pointTime: "12:28.72"
        pointText: The Word becoming flesh is explained through Emmanuel, God with us.
      - pointTime: "15:22.88"
        pointText: Divine initiative is contrasted with humanity's attempts to reach God through religious effort.
      - pointTime: "16:46.68"
        pointText: John's appeal to hearing, seeing and touching emphasizes a lived encounter rather than a theory alone.
      - pointTime: "18:50.44"
        pointText: The preacher distinguishes claims about the historical Jesus from mythological depictions of religious figures.
      - pointTime: "20:33.68"
        pointText: Grace and truth summarize the glory John recognizes in Christ.
  - chapterId: c20250309-grace
