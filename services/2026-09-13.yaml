  - chapterId: c20260913-eternal-life-knowing-god
    chapterTitle: Eternal Life Is Knowing God
    chapterKind: sermon
    chapterStart: "31:50.52"
    chapterEnd: "42:55.22"
    points:
      - pointTime: "31:50.52"
        pointText: Returning to Jesus’ prayer in John 17, the preacher introduces questions about death and
          cremation and describes eternal life as intimate knowledge of God rather than physical
          duration, illustrated by the fruit of the Spirit.
    chapterScripture:
      - John 17:1-5
      - Psalms 1:1-6
      - John 17
      - John 17:3
      - John 17:1-3
      - Galatians 5
  - chapterId: c20260913-resurrection-hope-life-now
    chapterTitle: Resurrection Hope Shapes Life Now
    chapterKind: sermon
    chapterStart: "42:55.22"
    chapterEnd: "1:02:04.28"
    points:
      - pointTime: "42:55.22"
        pointText: The preacher considers mortality, grief, burial and cremation through his account of
          resurrection, acknowledges limited knowledge of the future and returns to eternal life
          beginning with salvation now.
    subchapters:
      - chapterId: s0913-afterlife
        chapterTitle: Hope in Grief amid Limited Knowledge
        chapterKind: sermon
        chapterStart: "46:06.68"
        chapterEnd: "49:45.5"
        points:
          - pointTime: "46:06.68"
            pointText: The preacher distinguishes paradise and Hades from final destinations in his Reformed
              account, connects funeral care with hope and acknowledges limited biblical detail
              about resurrection and judgment.
      - chapterId: s0913-cremation
        chapterTitle: Cremation Need Not Prevent Resurrection
        chapterKind: sermon
        chapterStart: "53:15.46"
        chapterEnd: "57:31.66"
        points:
          - pointTime: "53:15.46"
            pointText: Alongside reported burial preferences and anecdotes, the preacher argues that cremation
              does not prevent God from resurrecting the body while acknowledging practical and
              traditional reasons to prefer burial.
    chapterScripture:
      - 1 Corinthians 13:9-12
  - chapterId: c20260913-knowledge-prayer-practice
    chapterTitle: Turn Knowledge into Prayer and Practice
    chapterKind: sermon
    chapterStart: "1:02:04.28"
    chapterEnd: "1:22:12.54"
    points:
      - pointTime: "1:02:04.28"
        pointText: Drawing on Packer, Acts 17 and Psalms 1, the preacher treats correct knowledge as a
          starting point for meditation that engages doubt and becomes prayer, praise and care for
          others, with local meditation alignment still uncertain.
    subchapters:
      - chapterId: s0913-meditation
        chapterTitle: Meditation Applies Truth to Relationships
        chapterKind: sermon
        chapterStart: "1:12:27.46"
        chapterEnd: "1:16:35.94"
        points:
          - pointTime: "1:12:27.46"
            pointText: The preacher distinguishes his practice of mental rest from Packer’s reflective
              application to family, colleagues and others; local ASR wording and alignment remain
              uncertain.
        chapterScripture:
          - Psalms 1:1-2
    chapterScripture:
      - 1 John 5:3
      - Acts 17
      - Psalms 1:1-2
      - Psalms 1:1-3
  - chapterId: c20260913-knowing-god-changes-life
    chapterTitle: Knowing God Changes How We Live
    chapterKind: sermon
    chapterStart: "1:22:12.54"
    chapterEnd: "1:29:59.46"
    points:
      - pointTime: "1:22:12.54"
        pointText: The preacher presents energy, a larger worldview, boldness in loving action and
          contentment as directions for growth in knowing God, with room for depression, illness,
          small acts and imperfection.
  - chapterId: c20260913-persistent-daily-devotion
    chapterTitle: Grow Through Persistent Daily Devotion
    chapterKind: sermon
    chapterStart: "1:29:59.46"
    chapterEnd: "1:35:55.3"
    points:
      - pointTime: "1:29:59.46"
        pointText: Using disciplined study as a qualified analogy, the preacher urges sustained devotional
          reading, reflection, prayer and action with fellow believers, and closes in prayer for
          deeper knowledge of God and shared joy.
    chapterScripture:
      - Psalms 1:1-3
  - chapterId: c20260913-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:35:55.3"
    chapterEnd: "1:50:28.441"
    points:
      - pointTime: "1:35:55.3"
        pointText: The congregation is invited to affirm the creed, pray and give, then sing Trust and Obey
          and receive the closing blessing before historical anniversary and ministry announcements
          and dismissal.
    chapterScripture:
      - 2 Thessalonians 2
      - 2 Corinthians 13
