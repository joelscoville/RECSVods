  - chapterId: c20260913-eternal-life-knowing-god
    chapterTitle: Eternal Life Is Knowing God
    chapterKind: sermon
    chapterStart: "31:50.52"
    chapterEnd: "42:55.22"
    points:
      - pointTime: "31:50.52"
        pointText: Returning to Jesus’ prayer in John 17, the preacher introduces questions about death and
          cremation and describes eternal life as intimate knowledge of God rather than physical
          duration, illustrated by the fruit of the Spirit.
      - pointTime: "33:58.32"
        pointText: Two questions introduce the afterlife and the relationship between cremation and resurrection.
      - pointTime: "34:37.18"
        pointText: John 17 gives an unusually intimate view of Jesus' prayer to the Father.
      - pointTime: "38:00.66"
        pointText: The preacher looks to John 17:3 to define eternal life rather than relying on popular assumptions.
      - pointTime: "42:03.62"
        pointText: The fruit of the Spirit illustrates the richness of life with God.
    chapterScripture:
      - John 17:1-5
      - Psalms 1:1-6
      - John 17
      - John 17:3
      - John 17:1-3
      - Galatians 5
  - chapterId: c20260913-resurrection-hope-life-now
    chapterTitle: Resurrection Hope Shapes Life Now
    chapterKind: sermon
    chapterStart: "42:55.22"
    chapterEnd: "1:02:04.28"
    points:
      - pointTime: "42:55.22"
        pointText: The preacher considers mortality, grief, burial and cremation through his account of
          resurrection, acknowledges limited knowledge of the future and returns to eternal life
          beginning with salvation now.
      - pointTime: "44:06.8"
        pointText: Recalling his brother's death, the preacher contrasts a known birth date with an uncertain end of life.
      - pointTime: "48:29.98"
        pointText: Resurrection and judgment offer hope even though Scripture does not explain every future detail.
      - pointTime: "55:42.5"
        pointText: God's ability to reconstitute a body is the basis of the preacher's answer about cremation.
      - pointTime: "1:01:17.68"
        pointText: Eternal life begins with salvation even when a believer cannot identify an exact conversion moment.
    subchapters:
      - chapterId: s0913-afterlife
        chapterTitle: Hope in Grief amid Limited Knowledge
        chapterKind: sermon
        chapterStart: "46:06.68"
        chapterEnd: "49:45.5"
        points:
          - pointTime: "46:06.68"
            pointText: The preacher distinguishes paradise and Hades from final destinations in his Reformed
              account, connects funeral care with hope and acknowledges limited biblical detail
              about resurrection and judgment.
          - pointTime: "47:12.58"
            pointText: Christian grief is distinguished from hopelessness at a funeral.
          - pointTime: "48:29.98"
            pointText: The preacher acknowledges the limits of biblical detail about resurrection and judgment.
      - chapterId: s0913-cremation
        chapterTitle: Cremation Need Not Prevent Resurrection
        chapterKind: sermon
        chapterStart: "53:15.46"
        chapterEnd: "57:30.22"
        points:
          - pointTime: "53:15.46"
            pointText: Alongside reported burial preferences and anecdotes, the preacher argues that cremation
              does not prevent God from resurrecting the body while acknowledging practical and
              traditional reasons to prefer burial.
          - pointTime: "54:24.32"
            pointText: A conversation about scarce burial space introduces practical questions in Singapore.
          - pointTime: "55:42.5"
            pointText: Death in fire and later exhumation challenge the idea that resurrection requires bodily preservation.
          - pointTime: "56:46.48"
            pointText: The preacher separates a traditional burial preference from a theological objection to cremation.
    chapterScripture:
      - 1 Corinthians 13:9-12
  - chapterId: c20260913-knowledge-prayer-practice
    chapterTitle: Turn Knowledge into Prayer and Practice
    chapterKind: sermon
    chapterStart: "1:02:04.28"
    chapterEnd: "1:22:09.02"
    points:
      - pointTime: "1:02:04.28"
        pointText: Drawing on Packer, Acts 17 and Psalms 1, the preacher treats correct knowledge as a
          starting point for meditation that engages doubt and becomes prayer, praise and care for
          others.
      - pointTime: "1:04:34.16"
        pointText: Pastors remaining seated on a crowded train illustrate a gap between theological discussion and consideration for others.
      - pointTime: "1:08:43.72"
        pointText: Reflecting on learned truth should lead to prayer and praise without dismissing the need for correct knowledge.
      - pointTime: "1:09:57.72"
        pointText: Paul's address in Athens supports knowledge of God as the foundation of faith.
      - pointTime: "1:19:39.56"
        pointText: Psalms 1 connects meditation with a living response of prayer, praise and action.
    subchapters:
      - chapterId: s0913-meditation
        chapterTitle: Meditation Applies Truth to Relationships
        chapterKind: sermon
        chapterStart: "1:12:27.46"
        chapterEnd: "1:17:49.6"
        points:
          - pointTime: "1:12:27.46"
            pointText: The preacher distinguishes his practice of mental rest from Packer’s reflective
              application to family, colleagues and others.
          - pointTime: "1:13:27.02"
            pointText: The preacher describes his practice of mental rest and responds to criticism of it.
          - pointTime: "1:14:23.9"
            pointText: Distracted attention illustrates the difficulty of resting the mind.
          - pointTime: "1:16:04.5"
            pointText: Love is applied to a spouse, children, colleagues and other people encountered each day.
          - pointTime: "1:16:35.94"
            pointText: Reflective meditation involves consciously thinking before God and reasoning through doubt.
        chapterScripture:
          - Psalms 1:1-2
    chapterScripture:
      - 1 John 5:3
      - Acts 17
      - Psalms 1:1-2
      - Psalms 1:1-3
  - chapterId: c20260913-knowing-god-changes-life
    chapterTitle: Knowing God Changes How We Live
    chapterKind: sermon
    chapterStart: "1:22:09.02"
    chapterEnd: "1:29:59.46"
    points:
      - pointTime: "1:22:09.02"
        pointText: The preacher presents energy, a larger worldview, boldness in loving action and
          contentment as directions for growth in knowing God, with room for depression, illness,
          small acts and imperfection.
      - pointTime: "1:23:18.62"
        pointText: Energy for God is connected with drawing strength from him amid life's difficulties.
      - pointTime: "1:24:04.12"
        pointText: Great thoughts of God should produce a worldview larger than personal comfort or remuneration.
      - pointTime: "1:26:53.6"
        pointText: A proposed Christmas outreach illustrates the call for boldness in loving action.
      - pointTime: "1:28:39.64"
        pointText: Contentment and deep peace are presented as directions for growth rather than evidence of perfection.
  - chapterId: c20260913-persistent-daily-devotion
    chapterTitle: Grow Through Persistent Daily Devotion
    chapterKind: sermon
    chapterStart: "1:29:59.46"
    chapterEnd: "1:35:55.3"
    points:
      - pointTime: "1:29:59.46"
        pointText: Using disciplined study as a qualified analogy, the preacher urges sustained devotional
          reading, reflection, prayer and action with fellow believers, and closes in prayer for
          deeper knowledge of God and shared joy.
      - pointTime: "1:31:05.48"
        pointText: A focused student illustrates persistence, with a qualification that academic achievement is not the goal of spiritual life.
      - pointTime: "1:32:05.3"
        pointText: Daily devotion combines reading with reflection, prayer and action.
      - pointTime: "1:33:11.24"
        pointText: The preacher recalls beginning devotional reading as a child and urges continued growth with fellow believers.
      - pointTime: "1:34:25.04"
        pointText: The closing prayer asks for knowledge of God that changes daily life rather than preoccupation with lesser concerns.
    chapterScripture:
      - Psalms 1:1-3
  - chapterId: c20260913-response-closing
