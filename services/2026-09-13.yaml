          and dismissal.
      - pointTime: "1:38:18.72"
        pointText: The congregation prays for the church's ministry and witness as it enters its thirty-eighth year.
      - pointTime: "1:40:36.4"
        pointText: The leader explains the offerings and the second Sunday's support for Christian Education Ministries.
      - pointTime: "1:43:00.22"
        pointText: Trust and Obey is introduced as a response that moves beyond hearing to obedience.
      - pointTime: "1:46:53.9"
        pointText: Historical announcements explain the forthcoming anniversary service and related arrangements.
    chapterScripture:
      - 2 Thessalonians 2
      - 2 Corinthians 13
