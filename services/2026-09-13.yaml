recordingTitle: Simple but Demanding
serviceDate: 2026-09-13
status: draft
sermonDescription: Drawing on John 17 and Psalms 1, the preacher presents eternal life as knowing
  God, beginning now and extending beyond death even where future details remain unclear. He draws
  on Packer to argue that theological knowledge becomes lived faith through meditation, prayer and
  praise. This relationship should shape care for others, courage and contentment, cultivated
  through persistent daily devotion rather than information alone.
sermonScripture:
  - Psalms 1:1-3
  - John 17:1-5
  - Psalms 1:1-6
sermonTopics:
  - discipleship
  - service
  - faith
