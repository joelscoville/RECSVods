    transcript: |
      But this tribulation continues all the way till today. On a global scale, there are many, many Christians in the world that are persecuted outside of our shore. Closest to us, I suppose, would be places like Myanmar, places like mainland China. Myanmar was quite bad. I think I just saw some internet posting a pastor got executed by the Myanmar military government. And the bigger scale one of the Middle East, all this [words uncertain] situation. But personally to us all too, we have tribulations in our life as well, right? This is something that every single one of us will go through. Either the tribulation come because we are living in a fallen world, or we are fallen ourselves, or the tribulation come because you want to be holy in the sight of God and you want to live a godly life. And the Apostle Paul told Timothy [biblical wording omitted; exact reference not announced].

      But Jesus talked about joy in tribulation. How is it exactly possible? In last week's lesson then, I pointed out that in the teaching of our Lord Jesus Christ, as he was speaking to the disciples, he brought out at least three things. Number one, love. You can go through tribulation because you know that you are beloved of God. And remember [name uncertain], the Catholic priest who spent his entire life pushing this idea of beloved. And it's such an important thing for us to know that you look into the mirror, you must always remind yourself you're a beloved of God. However difficult it is to believe. And a lot of us don't really believe. And I think that most of us don't. We look in the mirror, we see a loser or we see somebody, you know, who just wouldn't make it, right?
    confidence: 0.79
    review_notes: ['103.36s retains the move from persecution to application. Closest corroborated by chunk 0003 offset 588.2–595.2s where chunk 0004 has Grossest. External reports unverified; attributed summary does not assert them as archive facts. ASR Henry Norwin at 2317s left uncertain.']
