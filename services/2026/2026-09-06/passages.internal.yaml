    transcript: |
      Last week I mentioned that if you want to catch up on the past lessons and all that, our worship services actually are all uploaded and also put on the Facebook. Facebook postings are trimmed to the sermons only and so that takes some time and Facebook posting is about maybe a year behind the actual timing. But if you want to look at the live one, this is the particular site you can go to to check. Oh, sorry. Yeah, okay. So the worship videos are all into this particular site and QR code can be used to access it. Then you can go and check if you miss any sermons or you find that you want to find out more or you want to re-look at some of the things that has been taught. So that's a good tool to be used.

      The only price to pay is that you may have to watch KFC [word uncertain] before we start because it's not a subscription model, it's a free model. And so they put out ads and what have you that's not relevant to us. But you know, it's a small price to pay. I'm actually quite [word uncertain] surprised that they allow us to load so many, many things through the years. You know, I don't know, maybe sometime down the line I may have to download everything just to keep in case YouTube collapse, right? So maybe I have to pray for YouTube. So this is a good tool to use. Yeah, there are some things in there that I'm very appreciative of that's free, right? Like YouTube, [names uncertain]. May they survive for a long time because they bring [word uncertain] down quite a lot. Alright.
    confidence: 0.82
