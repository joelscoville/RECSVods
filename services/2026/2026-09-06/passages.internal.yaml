    transcript: |
      Last lesson, we closed chapter 16 and the sermon was entitled Overcoming because it's about our Lord Jesus Christ telling us that the plan of God being revealed, right? So, Jesus said [ESV quotation omitted; reference only: John 16:25-33 — https://www.esv.org/John+16:25-33/]. And you don't have to, I won't go and in turn go and talk to the Father for you. Because this direct [word uncertain] to God without any agent. And that's a very important thing for us to remember. So I spent some time to encourage you to understand. You pray, God will hear you.

      And it is true that scripture says [scripture quotation omitted; James 5, ESV reference only — https://www.esv.org/James+5/]. James chapter 5. At the same time, that's because the righteous are closer to the will of God. And so they won't go and pray nonsense for you. And their prayer is always in line with what it is that God wants. And so that's important for you. But for you, yourself, you must have the confidence to pray and know that God will hear you. Not because you are such a great person, but because you are a child of God. You are covered by the power of the Lord Jesus Christ. And so often times people use the illustration of a jacket, right? That Christ is like a jacket that you wear. And when God looks at you, He looks at a jacket and therefore recognizes you as His beloved. And this is a really very important thing to remember.
    confidence: 0.87
    review_notes: ['John 16 range from 2100s slide; James chapter announced but verse not resolved. ASR direct as at 2094s marked rather than silently corrected.']
  - id: p0906-believers-community
