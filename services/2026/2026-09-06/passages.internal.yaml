    transcript: |
      Because if you look at other religions, it's like so difficult to reach their gods. And so many things you need to do just to speak to God. Or go to some intermediary priest or some guy and you put your trust on this holy man and holy woman. You shouldn't do that. In Christian understanding, priesthood of all believers, you are all children of God. And along line with that, I also believe that you are all servants of God as well, wherever God has placed you to be. Today's sermon, I will expand on that a little bit more.

      And then also that Jesus said [scripture wording omitted; John 16:25-33, ESV reference only — https://www.esv.org/John+16:25-33/]. So on that day is the Pentecost. And then that was the case for the early church. So during the Pentecost, the Holy Spirit came, the early church was established. And we read from Acts chapter 2, the kind of church life that I still feel is a very envious situation. [Scripture wording omitted; Acts 2, ESV reference only — https://www.esv.org/Acts+2/]. At the same time, we see that it did not last. That immediately after that, they were persecuted by the Roman Empire and with horrifying, terrible persecution. And Jesus already said that too in last week's lesson [scripture wording omitted; John 16:25-33, ESV]. And horrendous suffering of the early Christians. Today we know that the case.
    confidence: 0.82
    review_notes: ['Duplicate horrendous suffering at 2239.4–2242.2s removed by comparing chunks 0003 and 0004. Endpoint uses chunk 0003 offset 579.2 + 1665s, a sentence boundary rather than the midpoint-merged fragment. Historical/religious comparisons are the speaker’s assertions.']
  - id: p0906-tribulation-love
    video_id: ZTDYIJUDb0M
