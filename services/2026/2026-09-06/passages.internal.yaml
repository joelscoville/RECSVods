    transcript: |
      Good morning, brothers and sisters in Christ. Every first Sunday of the month we come together to remember the sacrifice of our Lord Jesus Christ in the sacrament of Holy Communion. And in Holy Communion we are being obedient to the command of our Lord Jesus Christ that we should always remember, and that he shed his blood and broke his body for our sake. And every Holy Communion we join together with all the brothers and sisters throughout all generations and all over the world and be part of the body of Christ.

      And I am always reminded that the Holy Communion remind me that I am part of the universal church of Jesus Christ. In the Apostles' Creed we always recite [creed wording omitted]. And the word catholic here is a small c, which means that [wording uncertain] the big C church, which means there is a universal church of Jesus Christ. And so that's what Holy Communion is all about.
