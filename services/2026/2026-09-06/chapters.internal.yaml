  - id: s0906-glory
    video_id: ZTDYIJUDb0M
    start: 3412.82
    end: 4247.7
    type: sermon
    title: Glory, the cross and examples of faith
    confidence: 0.87
    review_notes:
      - Psalms 19:1 shown at 3900s; hymn title Jesus, keep me near the cross and Fanny Crosby shown at 4200s. Personal anecdotes and historical claims remain attributed and unverified.
    scripture:
      - John 16:33
      - John 17:1
      - Psalms 19:1
      - John 17:1-5
    topics:
      - glory
      - faith
    summary: Moving from John 16 to John 17, the preacher links Jesus’ timing and prayer before suffering with the cross, contrasting human recognition through awards and music with what he calls God’s inherent glory. Drawing on Psalms 19 and the Westminster Confession, he connects creation and Christ’s mission with glory and recalls encouragement from Fanny Crosby’s hymns and his first pastor’s continued service despite bombing injuries and severe vision loss.
    keywords:
      - timing
      - glory
      - suffering
      - stations
      - cross
      - recognition
      - fanny crosby
      - first pastor
  - id: s0906-eternal-life
    video_id: ZTDYIJUDb0M
    start: 4247.7
    end: 4756.04
    type: sermon
    title: Asking what eternal life means
    confidence: 0.85
    scripture:
      - John 17:2
    topics:
      - eternal-life
      - service-life
    summary: Connecting John 17:2 with Reformed election, the preacher uses preserved flowers and a former supervisor’s conversation to question eternal life as duration alone, linking the search for significance with what he calls an inbuilt sense of eternity. He weighs a simplified gospel presentation’s usefulness and limits, then discusses demographic change and an unnamed acquaintance’s conversion, contrasting perceived Roman Catholic consistency with Protestant disagreements.
    keywords:
      - election
      - eternal life
      - living forever
      - significance
      - gospel
      - consistency
  - id: s0906-knowing-god
    video_id: ZTDYIJUDb0M
    start: 4756.04
    end: 5623.56
    type: sermon
    title: Knowing God and living in response
    confidence: 0.9
    review_notes:
      - John 17:3 at 4800s, Greek ginóskó at 4880s, Luke 1:34 at 4950s, J. I. Packer at 5100s and 5400s. Do not turn the preacher’s linguistic or doctrinal assertions into archive conclusions.
    scripture:
      - John 17:3
      - Luke 1:34
      - John 17
      - John 17:4-5
      - 1 John 5:10-12
    topics:
      - eternal-life
      - knowing-god
      - prayer
      - glory
    summary: The preacher interprets John 17:3 as knowing God beyond duration, using Greek word study, Luke 1:34, relationship illustrations and Packer’s distinction between knowing God and knowing about God. He urges meditation, prayer and changed conduct in present life, relates John 17:4-5 and 1 John 5 to salvation through Father, Son and Holy Spirit, and encourages using gifts and resources in the body of Christ.
    keywords:
      - john 17
      - eternal life
      - ginóskó
      - intimacy
      - j i packer
      - meditation
      - courtship
      - here and now
      - purpose
      - gifts
