  - id: s0906-high-priestly
    video_id: ZTDYIJUDb0M
    start: 2759.78
    end: 3133.66
    type: sermon
    title: John 17 — the High Priestly Prayer
    confidence: 0.9
    review_notes:
      - Slide at 3000s confirms heading and MacArthur attribution; 3080s displays Hebrews 7:25. Interpretive claims belong to the preacher.
    scripture:
      - John 13-16
      - John 17
      - Matthew 6
      - John 17:1-5
      - Hebrews 7:25
    topics:
      - knowing-god
      - prayer
    summary: The preacher urges continued study despite limited understanding and, citing John MacArthur, distinguishes Jesus’ extended prayer to the Father in John 17 from the prayer taught in Matthew 6. He proposes its setting, outlines its portions and connects it with intercession in Hebrews 7, acknowledging his limitations in prayer and pointing to Jesus’ example.
