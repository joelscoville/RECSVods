      - responsibility
      - discipleship
      - faith
      - stewardship
      - mission
      - discernment
    summary: Pastor Yong reads John 14:12 as entrusting Christ's work to every believer, contrasting selective political recruitment and urging compassionate action through a qualified use of words attributed to Teresa of Avila. Drawing on his creative gifts and service as health permits, he encourages living beyond oneself and interprets greater works as wider reach through evangelism, travel and communication, not work surpassing Christ's in quality.
    keywords:
