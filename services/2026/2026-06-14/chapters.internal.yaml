    summary: From Philip's request and the disciples' persistent misunderstanding, Pastor Yong urges lifelong, Spirit-dependent learning, presenting Jesus' works, Hebrews and Colossians as testimony that Jesus reveals the Father while warning about deceptive signs. Applying Christ's preeminence to daily life, he commends Bible-grounded WWJD, forgiveness and following Jesus over wealthy celebrities, qualifying his criticism of an animal-activism example as no endorsement of cruelty.
