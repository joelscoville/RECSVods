    summary: After sports jokes and a golf story he says may be untrue, Pastor Yong recaps John 14, contrasting his account of Buddhist self-help with trust in Christ, revelation and the Spirit's present help. He cautions against self-righteousness and speculation about salvation, expresses sympathy with a position he attributes to C. S. Lewis, and urges gospel-sharing and humble, prayerful listening.
