    transcript: |
      [Scripture quotation and close exposition omitted.] The sense of intimacy that we have with God, and this is very uniquely Christian actually. [Quoted and closely repeated scripture wording omitted.] This is a hint in a little chapter that the Holy Spirit will be given to us for our ready help in the here and now. So the Christian faith is not just about dying and then having a nice future, which is what many people think religion is all about. [Further explanation omitted.] There is a here and now, for later on we will dwell deeper into this as well. [John 14:6 quotation omitted.] And that was the focus of last week's lesson.
