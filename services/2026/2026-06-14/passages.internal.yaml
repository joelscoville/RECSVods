    type: sermon
    title: The exasperations of Jesus
    summary: The preacher says that repeated teaching did not remove the disciples' misunderstanding and asks listeners to notice the emotion in Jesus' questions.
    questions: [Why does the preacher call this the exasperations of Jesus?]
    topics: [discipleship, knowing-god]
    scripture: [John 14:9, John 8]
    transcript: |
      Now remember that we are now at the tail end of the ministry of Jesus Christ. And the Gospels will not record every single thing that happened, and the disciples were with Jesus for about three and a half years. [Further explanation omitted.] Here, it's quite clearly that Jesus had taught this lesson many, many times. But yet the disciples still did not know. And we see here an expression that is frustrating. And I call this the exasperations of Jesus. And of course, you know, we every time imagine Jesus to be very kind, very gentle. He doesn't seem to get angry. And when you read words, black words printed on white paper, emotions doesn't quite come through quite clearly, right? The languages don't quite put emotion completely. But you can imagine the frustration of Jesus.
    confidence: 0.9
