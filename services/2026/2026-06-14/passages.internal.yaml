    end: 2775.9
    type: sermon
    title: C. S. Lewis, uncertainty and sharing the gospel
    summary: The preacher discusses a position he attributes to C. S. Lewis, expresses sympathy with it, and urges gospel-sharing rather than speculation about who is saved.
    questions: [What practical response does the preacher urge instead of arguing over who is saved?]
    topics: [mission, faith]
    scripture: [John 14:6]
    transcript: |
      [Quotation attributed by the preacher to C. S. Lewis omitted.] So that kind of understanding is that he first affirmed that no matter who goes to the kingdom of God, it must be through Jesus Christ. So in that sense, he understands scripture and he holds on to scripture tightly. He also opened up the way that Jesus may have some people enter the kingdom, which is not through our usual understanding, but it's still through Jesus Christ. This is a quite brilliant way of observing it. And I tend to have great sympathy and inclination towards what C. S. Lewis said. [Further biblical wording omitted.] The correct answer is you go out there and you share the gospel, or you want to keep haggling over whether who is saved, who is not saved, right? [Transition omitted.] Let's come to God in the word of prayer and commit the time to Him.
    confidence: 0.86
    review_notes: ['Attribution and interpretation of Lewis are reported from the recording, not externally authenticated.']
