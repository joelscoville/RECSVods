      [John 14 wording omitted.] Again, you've got to remember that these people were all gathering there, right, with the Last Supper of Jesus. [Transition omitted.] By God's timing, Jesus Christ began to reveal all these very deep and very profound things. And the disciples were all kind of confused, right? They still don't quite understand what is happening. Certainly, I think nobody would ever guess that Jesus is going to die such a terrifying death. Although he did share with them that the Son of Man must die. But still, you know, it's kind of beyond imagination. [Scripture quotation and close retelling omitted.] In other words, he was quite confused. He didn't quite know what was happening. [Jesus' reply omitted.]
