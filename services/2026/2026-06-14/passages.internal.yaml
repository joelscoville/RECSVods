      [Recap of the disciples' distress, Judas and Peter omitted.] We took the opportunity to talk about the various understanding of the troubled heart, especially with Buddhism and kind of self-help. And I took Buddhism as a kind of example because Buddhism is a very good example of a self-help religion. [The speaker's description of Buddhist teaching and scriptural quotations omitted.] To believe in God means that you also want to be completely trusting what God would do for you. [Quotation omitted.] And so we do believe Jesus is the answer. And in today's passage, we will expand on this a little bit more.
