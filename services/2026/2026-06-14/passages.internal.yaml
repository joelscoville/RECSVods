    title: Security in belonging to Christ
    summary: Introducing Known and Loved, the leader contrasts security in belonging to Christ with possessions, achievement and loneliness.
    questions: [Where does the worship leader say our deepest security is found?]
    topics: [faith, knowing-god]
    scripture: []
    transcript: |
      The next hymn is called Known and Loved by CityAlight. [Comments about recalling the melody omitted.] So, its message is beautiful. It is one that we need to hear again and again. In the world today where many people struggle with loneliness, people struggle with their identity, who we are as a person. The song reminds us that our deepest security is found not in what we have, is found not in what we achieve. Our deepest security, our identity, our core being is only found in whose we are or who we belong to. As we sing this song, may we rest in this truth. Because in Christ, we are never truly alone. [Song-title wording omitted.] Let's listen to the hymn for a minute before we sing this song together.
