    end: 2634.16
    type: sermon
    title: Revelation rather than self-sufficiency
    summary: The preacher discusses the exclusive claim of John 14:6 and contrasts reliance on revelation with a self-help approach, using a stopped clock as an illustration.
    questions: [Why does the preacher contrast revelation with self-help?]
    topics: [faith, knowing-god]
    scripture: [John 14:6, Acts 4:12]
    transcript: |
      A very exclusive claim by Jesus Christ that brought about a lot of disagreement and difficulties. [Further commentary on the claim omitted.] We understand that this is a difference between a God-centered or a man-centered approach. When you are God-centered, it means that we believe that the human being is not anywhere good enough to know the way, the truth, or the life. And so we need revelation faith versus a Buddhist concept of self-help faith. We believe that by ourselves, we can never find a way. [Stopped-clock illustration omitted.] Sometimes, even in other religions, other philosophies, you kind of catch a little bit and you think that, oh yeah, they kind of tell the truth. Only sometimes. But self-help faith can never bring us forward. [Acts 4:12 quotation omitted.]
    confidence: 0.86
    review_notes: ['Segment 375 alignment warning is internal. Longer comparison retained as one thought. Assertions about other faiths are attributed, not endorsed. Supporting passage for series proposal only.']
  - id: p20260614-025
    video_id: GlVgMoehT2I
    section_id: s20260614-10
    start: 2634.16
    end: 2697.6
    type: sermon
    title: Humility rather than condemning other people
    summary: Pastor Yong warns that Reformed evangelical convictions can be accompanied by self-righteousness and recounts a friend's humble response to questions about who will enter God's kingdom.
    questions: [What danger does the preacher identify in self-righteous religious certainty?]
    topics: [discipleship, discernment]
    scripture: []
    transcript: |
      I ended the sermon by saying that unhappily there are some ungodly consequences of the Reformed evangelical understanding this very well. Very often people who belong to our camp tend to be known to be very self-righteous, very condemning about other people, get very angry with other people, a lot of hatred, unkindness. [Friend's name and quotation omitted.] I think there's a brilliant answer because it really is an answer of humility and correct awareness that this is a matter for God to decide, not for us to decide. So we don't go around pointing at different people and say you should burn in hell because you are not God. That is a position for God to take.
    confidence: 0.87
    review_notes: ['ASR renders the friend as Miller Fuller; full identity not independently established.']
  - id: p20260614-026
