sermon_description: "Pastor Yong presents knowing Jesus as the foundation for sharing in his work:
  believers learn from the one who reveals the Father and follow his example in daily life. He
  understands the greater works of John 14 as wider reach, entrusted to ordinary believers. Prayer
  supports that calling without guaranteeing desired outcomes, freeing listeners to begin with
  practical kindness and serve beyond themselves."
