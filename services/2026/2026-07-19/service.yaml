sermon_description: The preacher presents Christ’s love as the key to understanding friendship,
  belonging and obedience in John 15. Challenging faith shaped by personal preference, he argues
  that lasting joy and genuine glory depend on Christ. His account of redemption and divine choosing
  locates freedom in belonging to a perfectly good master, whose self-giving love calls Christians
  to trust his word and respond differently in everyday relationships.
