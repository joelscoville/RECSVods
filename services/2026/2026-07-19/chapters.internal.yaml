  - id: s20260719-difficulties
    video_id: rM0Oi8-Y8G4
    start: 2490
    end: 2842
    type: sermon
    title: Conditional friendship and chosen faith
    speaker_id: yong-teck-meng
    confidence: 0.91
    scripture:
      - John 15:12-17
      - John 14:15
      - John 15:16
    topics:
      - discipleship
      - authority
      - faith
      - knowing-god
      - discernment
    summary: Considering John 15:12-17, the preacher questions the connection between friendship, love and obedience, using stories of a child buying friendship and a nephew’s lending to illustrate transactional relationships. He contrasts divine choosing with personal religious selection, citing neighbouring institutions and mixed household altars as examples of worshippers retaining control.
    keywords:
      - commandments
      - buy friendship
      - money
      - choose
  - id: s20260719-human-constructs
    video_id: rM0Oi8-Y8G4
    start: 2842
    end: 3289
    type: sermon
    title: Human constructs and the authority of Scripture
    speaker_id: yong-teck-meng
    confidence: 0.9
    scripture:
      - John 17:17
    topics:
      - discernment
      - truth
      - worship
      - discipleship
      - authority
    summary: The preacher attributes distorted reasoning to the fall and questions inherited cultural assumptions about faith and European-influenced worship forms, imagining distractions around Jesus’s teaching to challenge expectations of order. Contrasting taekwondo routines with free sparring, he challenges leaders’ conduct and reliance on status, urging Scripture rather than background or personal philosophy to guide choices.
    keywords:
      - fallen reason
      - worship
      - training
  - id: s20260719-glory
    video_id: rM0Oi8-Y8G4
    start: 3289
    end: 3779
    type: sermon
    title: Glory and goodness apart from Christ
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - John 15:5
    topics:
      - glory
      - knowing-god
      - truth
      - faith
      - discipleship
    summary: Drawing on John 15:5 and wordplay on Christian identity, the preacher argues that life and glory depend on Christ and on truth, goodness and beauty beyond religious settings. Through disputed sporting examples, a hypothetical purchased national team and an anthem-singing recollection, he questions whether formal citizenship or technical victory brings authentic identification and shared achievement.
    keywords:
      - sovereignty
      - goodness
      - glory
      - truth
      - without christ
