      - knowing-god
      - truth
      - authority
    summary: The preacher frames freedom in Christ as a paradox and condemns racist biblical justifications of historical slavery. Citing MacArthur, he distinguishes belonging to a perfectly good and wise God from subjection to abusive human masters.
