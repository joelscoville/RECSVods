    start: 4073
    end: 4341
    type: sermon
    title: "Doulos: servant or slave?"
    speaker_id: yong-teck-meng
    confidence: 0.9
    scripture:
      - John 15:15
    topics:
      - truth
      - authority
      - discipleship
    summary: Discussing John 15:15 and slavery in Roman and early Christian settings, the preacher argues that translating doulos as servant softens its force. Presenting John MacArthur’s argument about translation sensitivity and Christian identity, he contrasts slavery with voluntary bondservice and introduces freedom in belonging to Christ.
    keywords:
      - doulos
      - early church
      - john macarthur
  - id: s20260719-chosen
