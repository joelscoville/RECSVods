  - id: s20260719-charity-question
    video_id: rM0Oi8-Y8G4
    start: 1720
    end: 2202
    type: question-answer
    title: Doing good without being taken advantage of
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture:
      - Matthew 10:16
      - James 2:17
    topics:
      - discernment
      - service
      - responsibility
      - stewardship
      - faith
    summary: Answering a question about exploitation in charity, the preacher draws on his work and Matthew 10 to urge gentle, discerning, accountable help, preferring organized support over street appeals in his account of Singapore’s welfare provision; his tissue-selling crime anecdote remains unverified. Acknowledging that regulation cannot eliminate fraud, he urges prayerful, sustained involvement and practical action, citing James 2:17 and J217.
    keywords:
      - doing good
      - charitable
      - accountable
  - id: s20260719-recap
    video_id: rM0Oi8-Y8G4
    start: 2202
    end: 2438.06
    type: sermon
    title: "Last-session recap: the vine and God’s goodness"
    speaker_id: yong-teck-meng
    confidence: 0.91
    scripture:
      - John 15:1-11
    topics:
      - knowing-god
      - truth
      - discipleship
      - faith
    summary: Recapping the previous lesson, the preacher places the vine metaphor in the farewell discourse and discusses dependence on Christ, relationships among believers and difficult pruning for fruitfulness. Contrasting Christ with human constructions of truth, he recalls his broad account of God’s goodness as essential to lasting meaning before exploring Christian identity.
    keywords:
      - farewell discourse
      - true vine
      - pruning
      - goodness
      - truth
