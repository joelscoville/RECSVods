    type: testimony
    title: Media ministry beyond likes and engagement
    summary: The worship leader describes late-night media work and explains that serving before God matters more to her than online likes, shares or engagement.
    questions: ['How does the worship leader think about social-media engagement in ministry?']
    topics: [service-life]
    scripture: []
    transcript: |
      [Recording begins during a reference to the anthem.] Just a quick sharing. Actually on the Bahasa side I do some ministry also, and one of the things I do is media. So I have to design Instagram, I have to do slides, I have to do pictures. And one of the struggles with media ministry is that you post online. If you work in a corporate, the objective is to get the likes, the engagement, the shares and things like that. But then I'm doing it at eleven p.m., like, what am I doing in my life? I should be asleep. When I was doing it I was reminded, Coram Deo. Coram Deo means living before God. I'm not doing this for people. I don't know, I do this, maybe I get zero likes, maybe ten likes. How this will impact people, how people who read it will be blessed [wording uncertain]. But I realized, bottom line is that God called me to do this. I should do this and I do this before him. That was something that I remembered when I was practicing this song, My Labour Is Not In Vain. [Song wording omitted.] So when we do ministry, everything is for God. Let us all sing together, My Labour Is Not In Vain.
    confidence: 0.87
    review_notes: ['Opening sample corroborates full ASR. Latin spelling normalized from ASR koram deo; phrase is explained by the speaker. No invented lead-in from previous upload.']
