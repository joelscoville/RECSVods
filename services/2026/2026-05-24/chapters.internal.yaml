    end: 3362.52
    type: sermon
    title: The Most Hideous Sin — Judas and the betrayal
    speaker_id: pastor-yong
    confidence: 0.92
    scripture:
      - Matthew 11:26
      - Genesis 1
      - Genesis 4
      - John 13:21-30
      - Matthew 26:14-16
      - Matthew 27:9-10
      - John 13:21-25
      - John 13:26-30
    topics:
      - discipleship
      - responsibility
      - sacrifice
      - faith
    summary: From a Bible quiz about Matthew 11:26, the first commandment and Cain's murder, Pastor Yong compares historical atrocities with the view that Judas's betrayal is uniquely grave because Jesus is innocent. He traces the silver and prophecy, Jesus' troubled announcement and the disciple he identifies as John, then the morsel identifying Judas and his misunderstood departure to arrange an arrest away from the crowd.
