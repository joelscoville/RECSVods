      - James 1:13-15
      - Genesis 3
      - John 13:14
    topics:
      - responsibility
      - temptation
      - discernment
      - repentance
      - stewardship
    summary: Pastor Yong challenges excuses based on prophecy or circumstances, contrasting Jesus Christ Superstar's sympathetic Judas and Damned for All Time with John's account of his theft. Drawing on James 1, Stephen Tong's Trial and Temptation, running discipline, Adam and Eve and a bird-nesting illustration, he distinguishes encountering temptation from yielding to it and urges vigilance rather than blaming God or the devil.
