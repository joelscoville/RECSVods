  - id: s20260524-denial
    video_id: uJDdItVGgj8
    start: 4144.1
    end: 5007.64
    type: sermon
    title: Not only Judas — Peter and our own denial
    speaker_id: pastor-yong
    confidence: 0.89
    scripture:
      - John 13:36-38
      - John 13:38
      - Mark 14:50
      - 1 Peter 3:18
      - 2 Timothy 3:1-5
      - 2 Timothy 3:5
    topics:
      - responsibility
      - authority
      - hypocrisy
      - discipleship
      - sacrifice
      - faith
      - truth
      - service-life
    summary: Pastor Yong extends responsibility beyond Judas to leaders, crowds, soldiers, Pilate and Peter's denial and the disciples' flight, while noting John at the cross and distinguishing tradition about Peter's death. Through extravagant worship promises, Taiwan army-camp and migration anecdotes, slogans and church legal disputes, he challenges himself and the congregation about outward godliness, self-reliance and misrepresentation that he describes as denying Christ's power.
    keywords:
      - leaders
      - crowd
      - soldiers
      - apostles creed
      - pontius pilate
      - peter
      - taiwan
      - slogans
      - fled
      - godly
  - id: s20260524-repentance
    video_id: uJDdItVGgj8
    start: 5007.64
    end: 5681.24
    type: sermon
    title: Regret, repentance and restoration
    speaker_id: pastor-yong
    confidence: 0.91
    scripture:
      - Matthew 27:3-5
      - John 21:15-17
      - 1 John 1:9
      - Hebrews 6:4-6
    topics:
      - repentance
      - responsibility
      - faith
      - discipleship
      - sacrifice
      - forgiveness
      - hypocrisy
    summary: Contrasting Judas's returned money and suicide with Peter's restoration, Pastor Yong distinguishes regret from repentance and uses a song allusion and John Stott's example and substitution teaching to urge seeking God's help rather than self-rescue, explicitly acknowledging suicide's complexity. He says Judas could have sought forgiveness, encourages those burdened by wrongdoing through John 21 and 1 John 1:9, and interprets Hebrews 6 as warning against outward participation without belief while urging faithful discipleship and repentance after failure.
    keywords:
      - judas
      - peter
      - regret
      - repentance
      - john stott
      - mercy
      - forgiveness
