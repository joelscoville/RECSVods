    summary: Introducing the second half of John 13, Pastor Yong answers a question about the Apostles' Creed's authorship and distinguishes uncertain tradition from Scripture and sola scriptura. He contrasts Protestant and Roman Catholic authority as he understands them while affirming the Creed's declarative and baptismal value despite its uncertain origin story.
