      At the same time, we cannot develop a good character by our own efforts. As I help my students through their frequent meltdowns, I see myself in them too. When their minds are stuck in a loop, they are helpless, just as I am helpless when I am mired with negative thoughts and emotions. They need intervention, and so do I. In the chaos, I remind myself that they are not giving me a hard time, but they are having a hard time. Thank God that while we are struggling with sin, there is divine intervention. He extends His good and gracious hand to help us, a faithful hand that will never let go, with a love that never fails. So let us move on to our third hymn, Jesus Paid It All.
