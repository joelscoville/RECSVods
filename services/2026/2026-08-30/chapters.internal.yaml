    summary: Pastor Yong interprets John 16:33 as a call to courage grounded in Jesus' victory, death, resurrection and ascension rather than empty reassurance. Using Romans 8:24-25, English and Chinese word comparisons and the earlier hymn's theme of trust, he describes hope as patient assurance of a secure destination amid difficulty, not wishful thinking.
