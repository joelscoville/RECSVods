  - id: s20260830-access
    video_id: M9uwSKpB_gk
    start: 2586.52
    end: 3307.62
    type: sermon
    title: Direct access to God in prayer
    speaker_id: pastor-yong
    confidence: 0.91
    scripture:
      - John 13
      - John 16
      - 1 Corinthians 2:6-7
      - John 16:25-26
      - James 5
      - John 16:23-24
    topics:
      - holy-spirit
      - knowing-god
      - prayer
      - forgiveness
      - service
      - faith
      - discipleship
    summary: Pastor Yong traces Jesus' suffering, resurrection and return to the Father as a progressively revealed plan, linking the indwelling Spirit at Pentecost with direct prayer and contrasting his Reformed understanding with his account of Catholic confession. Through a requested prayer visit, a qualified rain joke and a George Muller anecdote, he urges regular personal prayer aligned with God's will and joy, denying that pastors or prominent Christians are necessary intermediaries or automatically pray better.
    keywords:
      - redemption plan
      - hidden wisdom
      - holy spirit
      - priesthood
      - intermediary
      - george muller
      - pray often
  - id: s20260830-community
    video_id: M9uwSKpB_gk
    start: 3307.62
    end: 3974.34
    type: sermon
    title: Joy and shared life in the church
    speaker_id: pastor-yong
    confidence: 0.89
    scripture:
      - Acts 2:1-3
      - Acts 2:44-47
      - John 16:24
      - Acts 2
    topics:
      - holy-spirit
      - service-life
      - discipleship
      - service
      - politics
      - stewardship
    summary: Pastor Yong links Pentecost and Acts 2 sharing with joy, admiring Amish mutual support while questioning separation from outsiders; his accounts of communist privilege, China's economic changes and online shopping illustrate self-interest's challenge to voluntary sharing. He recommends cell groups and practical help without guaranteeing trustworthy relationships, remaining grateful for shared Christian service despite being cheated and disappointed.
    keywords:
      - early church
      - pentecost
      - journey of faith
      - amish
      - cell
  - id: s20260830-tribulation
    video_id: M9uwSKpB_gk
    start: 3974.34
    end: 4509.94
    type: sermon
    title: Tribulation and the burdens of caring
    speaker_id: pastor-yong
    confidence: 0.88
    scripture:
      - John 16:33
    topics:
      - faith
      - peace
      - suffering
      - service
      - prayer
      - service-life
    summary: Pastor Yong contrasts early Christian joy with Roman persecution and traditions of apostles' deaths depicted on shields; against accounts he attributes to other preachers, he rejects uninterrupted emotional peace and urges recovery from disappointment. He describes anxiety from repeated disaster footage and, through a Christian's concern for a friend, the emotional cost of empathetic pastoral care rather than retreat behind status.
    keywords:
      - early church
      - apostles
      - shields
      - suffering
      - disappointment
      - social media
      - empathy
