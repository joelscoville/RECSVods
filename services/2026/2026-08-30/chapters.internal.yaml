    summary: Pastor Yong contrasts the disciples' premature confidence with their coming failure, using Mark 9:24 and Hebrews 11 to describe God's understanding of weak faith, its growth through trials and encouragement from those trusting beyond their lifetimes. He cites his work on Stephen Tong's autobiography, a university-funding example attributed to Tong that contrasts with his own caution, and the displayed example of Nick Vujicic and Kanae Miyahara.
