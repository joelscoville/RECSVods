    summary: With Overcoming displayed, Pastor Yong points to earlier YouTube sermons, welcomes questions, and recaps Jesus' care for confused disciples, departure and return, labour imagery, and the Spirit's coming and access to the Father. Challenging bitter service, he connects joy with the Spirit without requiring constant happiness, illustrates private marital struggles behind public ministry, and prays for humility, attention to God's voice and mercy.
