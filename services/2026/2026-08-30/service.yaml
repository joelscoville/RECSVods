sermon_description: Pastor Yong presents Jesus' promise of overcoming as courage amid trouble, not
  freedom from suffering. The Spirit gives believers direct access to the Father and draws them into
  shared life, even when caring is costly. He urges listeners to remember God's love, seek help for
  weak faith and find patient assurance in Christ's victory rather than expect constant happiness.
