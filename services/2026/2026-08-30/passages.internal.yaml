      Let's come to God in a time of prayer. We thank you, O God, that in this world where so many people don't get to even worship you properly, we are all here listening to your word in comfort and in safety. And what is lacking surely for many of us is a heart that appreciates this privilege and will come to you in humility. So may you grant us that humility, a childlike innocence when we come before you. No matter what burdens we have in our life, may you help us to set them aside so that we can hear your voice, recognize it, turn and follow you. Have special mercy on your unworthy servant. [Scriptural prayer wording omitted.] In Jesus' name we pray. Amen.
