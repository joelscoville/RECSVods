      And being in the will of God, however, brings fullness of joy. [Scripture quotation omitted.] So Christianity is an unusual kind of a faith because we link suffering with joy, tribulation with joy. And today we want to dig deeper into it. But I want you to know that joy is a mark of the presence of God the Holy Spirit. And so no matter what you are going through in life, I'm not saying that we are always up, up, up and very happy all the time. [Illustration involving children omitted.] But if you are an adult and you are involved in ministry, whether you are serving as a chairman, your pianist, usher, or even the preacher, pastor, whoever, if you serve with great bitterness in your heart and dragging your feet, and you go on the pulpit with a “kill me already” kind of look, it's not right.
