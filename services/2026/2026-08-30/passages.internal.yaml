    section_id: s20260830-access
    start: 2586.52
    end: 2639.96
    type: sermon
    title: A snapshot of the unfolding redemption plan
    summary: Pastor Yong traces the farewell discourse from the upper room to Jesus' suffering, resurrection and return to the Father.
    questions: [How does the preacher summarize the plan revealed in the farewell discourse?]
    topics: [holy-spirit, knowing-god]
    scripture: [John 13, John 16]
    transcript: |
      So let me quickly review what's the snapshot so far as to what has happened. We know that Jesus Christ was speaking to the eleven because Judas Iscariot left, right? So we start on chapter 13 in the upper room when Jesus washed the feet of disciples, the Last Supper [further narrative recap omitted]. For the disciples, Jesus then, step by step, progressive revelation revealed that he will be arrested, tried, tortured, and be crucified. Of course, he didn't use the exact words, but he was preparing the disciples for a horrifying thing that will happen.
      But more importantly, he then revealed the processes of what is going to happen: that He will suffer, He will be resurrected, He will return to the Father. And not only that, we will not be left alone.
    confidence: 0.9
  - id: p20260830-024-spirit
    video_id: M9uwSKpB_gk
    section_id: s20260830-access
    start: 2640.2
    end: 2708.3
    type: sermon
    title: From a physical presence to the indwelling Spirit
    summary: Pastor Yong describes the Spirit's coming as a change from following Jesus physically to the Spirit living in every believer.
    questions: [What change does the preacher associate with the Spirit's coming?]
    topics: [holy-spirit, prayer]
    scripture: [John 16]
    transcript: |
      The next stage of things that will happen is God the Holy Spirit will then come and change the whole scenario whereby earlier there was only one Jesus Christ walking along Jerusalem and the surrounding areas with all these physical disciples. But now God the Holy Spirit will live in every single believer forevermore. And so all of a sudden, the approach becomes a global kind of approach. So this is a progressive kind of plan that God has given to humanity. [Further scriptural recap omitted.] And this is the earthly redemption plan that God has revealed [preposition uncertain in ASR] our Lord Jesus Christ. So for those of us who are now here today, because we have the entire revealed will of God with us, it seems like, okay, sure, that's the way it is.
    confidence: 0.91
