      Let us bow our head for the opening prayer. Dear Heavenly Father, we would like to begin this worship service, Lord, by acknowledging that there is only one God worthy to be worshipped and that you, you are that one good God. You exist in three persons, Lord.
      [Prayer's description of Father, Son and Holy Spirit omitted from this excerpt.]
      We thank you, Lord, for this privilege and this luxury of worshipping you. We thank you that you have gathered us over here today, that we sing songs and we listen to the words that you are giving. We ask of you to bless Pastor Yong, the person who is going to deliver your word through his mouth. We ask you for journey mercy of the people who are still coming. And we ask you, Lord, that you bless this worship service, that it may go from beginning to the end, and then this worship service should glorify your name forever. With that, Lord, we thank you again. In Jesus' name we pray. Amen. Please be seated.
