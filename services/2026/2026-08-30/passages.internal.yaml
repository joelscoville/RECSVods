    topics: [faith, worship]
    scripture: []
    transcript: |
      So that is the song. [Quoted song lyric omitted.] So much so in our daily Christian life the narrative is always saying that I will believe in Jesus, right? A lot of times we ask our friends who are non-Christian or anybody, we like, do you believe in Jesus? Now believing and trusting is two very different thing. Like belief is actually claiming the truth of a certain historical something, right? Like if I say I believe Singapore had its independence in the 9th of August 1965, but do I trust it? No. So trust actually has a relational dimension to it. This song is asking us to trust in Jesus. Do you trust Jesus? Sometimes we say we believe in Jesus, but we may not trust in Him. So let us sing this song and really meditate on the word [closing song-related wording omitted].
