    transcript: |
      Today's passage is a continuation of the last discourse of Jesus, meaning before Jesus was crucified, the last things that he said to his disciples. But again before I start, I want to encourage you to ask any questions. This week there's no relevant questions so I'm not going to go into this. But you can ask your questions, put it in the box or send it to this number. And you can ask any questions; that's why it's called Ask Me Anything. It doesn't have to be related to the sermon proper.
      [Anecdote about unanswered questions at Dr. Stephen Tong's sessions omitted.]
      The encouragement to ask questions is so you continue to learn and also to demonstrate to you that actually the truth of God, as the Westminster say, it's sufficient to answer all questions relating to life, faith and salvation.
    confidence: 0.9
