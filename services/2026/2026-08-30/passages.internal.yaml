    questions: []
    topics: [prayer, worship]
    scripture: []
    transcript: |
      Almighty God, we give you thanks and praise for this morning as we all gathered here. By your grace and your mercy, we see a world that is in chaos and in so much trouble. And here we are this morning, peaceful and comfortable and safe to worship you. And so we do pray that you guide us through this morning's worship service so that our spiritual ears are open and our eyes are open to be attuned to you, so that we will hear you speaking to us and recognize your voice, turn and follow you. May everything we do bring glory unto your holy name. In Jesus' name we pray. Amen. This morning our brother Jason will be leading us.
