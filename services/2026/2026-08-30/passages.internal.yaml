    type: sermon
    title: Recap of Jesus' departure and the Holy Spirit
    summary: Pastor Yong reviews the previous lesson, interpreting Jesus' departure and return in relation to crucifixion, resurrection, ascension and the Holy Spirit.
    questions: [How does the preacher explain the previous lesson about seeing Jesus again?]
    topics: [holy-spirit, knowing-god]
    scripture: [John 16]
    transcript: |
      So last week's lesson was on the middle part of John 16 and it is about how Jesus Christ was talking, preparing the disciples. And today we actually will continue a little bit. [Scripture quotations and the speaker's self-correction omitted.] He was talking about how he will be crucified, so they will not see him. However, most interpretation is that a little while you will see me because he will be resurrected, ascended, and then Holy Spirit will come. So God the Holy Spirit will come and that's the Spirit of Christ as well. [Excerpt continues.] Jesus was saying to the disciples that the physical Jesus Christ will ascend and then God the Holy Spirit will come, and they would then access Jesus Christ via the Holy Spirit. Today, we will continue that thought a little bit further.
    confidence: 0.89
    review_notes: ['Clearly a Last Session recap; not a separate current sermon title or series inference.']
  - id: p20260830-020
    video_id: M9uwSKpB_gk
    section_id: s20260830-introduction
    start: 2225.96
    end: 2297.04
    type: sermon
    title: Jesus cares for confused disciples
    summary: Pastor Yong describes the disciples' confused political expectations and Jesus' care for them as he prepares them for his crucifixion.
    questions: [How does the preacher connect Jesus' care with the disciples' confusion?]
    topics: [faith, holy-spirit]
    scripture: [1 Peter 5:7, John 16]
    transcript: |
      But of course, for the disciples, it's a very confusing thing. Remember that at that time, in that moment, they were wondering whether Jesus is going to be very triumphant. And this kind of expectation carried on all the way to the book of Acts, that they keep thinking that Jesus is a political kind of a leader, military leader. So back then, they get all confused. But Jesus Christ, then knowing that they are confused, went ahead and took the initiative to allay their fears even further. So from there, we are reminded that our Lord Jesus Christ cares for us.
      [Quotation of 1 Peter 5:7 omitted.]
      And Jesus told the disciples and revealed to them [scriptural wording omitted]. It's a fallen world because hours after he said that, they will be freaking out because their master, their teacher for three and a half years, will be arrested, tortured, and then will be crucified. That's why they will weep. And then the Romans and the Jews who were against Jesus will all be very happy and will be rejoicing.
    confidence: 0.88
    review_notes: ['Historical and theological descriptions remain the speaker’s account.']
