    type: sermon
    title: The Third Person — introduction and Greater Works recap
    speaker_id: yong-teck-meng
    confidence: 0.94
    scripture:
      - John 14:15-24
      - Romans 8:26-30
      - John 14:8-14
      - John 14:12
      - John 14:13-14
    topics:
      - service-life
      - holy-spirit
      - knowing-god
      - discipleship
      - service
      - discernment
      - mission
      - responsibility
      - prayer
    summary: After greeting fathers and postponing appreciation until after the creed, Yong introduces difficult Spirit teaching with questions and prayer, using Philip and his ministry nerves to urge humble lifelong learning. His recap favors following Jesus over wealth-based models, with qualified guidance and unverified comparisons, interprets greater works as wider reach rather than sinlessness, and urges all believers to start small, learn joyfully through service and pray for God's purposes.
    keywords:
      - third person
      - farewell discourse
      - philip
      - humility
      - lifelong learning
      - would jesus do
      - greater works
      - start small
      - triune
      - holy spirit
  - id: s20260621-love-obedience
    video_id: dNeZD1HUmmE
    start: 2898.92
    end: 3307.78
    type: sermon
    title: Love and obedience — one-way traffic
    speaker_id: yong-teck-meng
    confidence: 0.89
    scripture:
      - John 14:15
      - John 14:21
      - John 14:23-24
      - Ephesians 2:10
      - Luke 18
      - John 14:12
    topics:
      - discipleship
      - faith
      - discernment
      - service
      - hypocrisy
      - repentance
    summary: Reading John 14 alongside Ephesians 2:10, Yong argues that love for Jesus produces good works, while kindness across beliefs, including animal care, does not prove Christian identity. Through the Pharisee and tax collector he distinguishes love from outward compliance, stressing repentance and a changed direction rather than sinlessness.
    keywords:
      - love
      - one way traffic
      - good deeds
      - animals
      - direction
  - id: s20260621-restoration
    video_id: dNeZD1HUmmE
    start: 3307.78
    end: 3833.96
    type: sermon
    title: Christ's commandments and a restored life
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture:
