    title: Scripture and the mystery of the Trinity
    speaker_id: yong-teck-meng
    confidence: 0.9
    scripture:
      - John 17:17
      - John 14:15-16
    topics:
      - truth
      - knowing-god
      - holy-spirit
      - trinity
      - discernment
    summary: Yong grounds understanding of God in scripture and the Westminster Confession's Trinity statement, acknowledging limits of comprehension and translation for begotten and proceeding. Recapping transformed but imperfect life, he urges biblical inquiry into the Spirit's work rather than reliance on impressions, visions or perceived signs.
