    summary: Yong criticizes reward-and-punishment faith, winner culture, religious charms and consumer expectations of church amenities and school connections. Through wedding vows, an elderly couple and a response he attributes to Pat Robertson about Alzheimer's, he urges enduring love and transformed identity while warning that temptation continues.
