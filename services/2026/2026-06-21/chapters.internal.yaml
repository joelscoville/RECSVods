    summary: Yong describes the divine Spirit as helper, advocate, counselor and comforter, relating intercession in Romans 8 to abiding presence with the Father and Son in John 14. He presents this as support rather than magic, discussing resurrection, Pentecost and last-day readings of that day without claiming agreement on his account of the last-day reading.
