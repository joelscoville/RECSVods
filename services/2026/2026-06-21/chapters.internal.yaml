      - discernment
      - holy-spirit
      - truth
    summary: Yong recalls feeling alone as a non-charismatic army fellowship leader and reacting skeptically to tongues instruction, claims of seeing spirits and an extraordinary jumping testimony he translated. He describes pressure from dramatic testimonies and repeats an anecdote attributed to Dr. Tong about a Sundar Singh legend, without verifying these accounts.
