      - John 10:10
      - Galatians 5:22-23
    topics:
      - discipleship
      - discernment
      - knowing-god
      - truth
      - service-life
      - faith
      - holy-spirit
    summary: Using an AI rules image, commandment summaries, the rich young man and a Sunday-school anecdote, Yong argues that Christ's commandments point to Christ himself beyond checklists and worship routines. He distinguishes redemption from lifelong restoration, connecting full, joyous life and the fruit of the Spirit with a wedding couple's scripture choice and a DNA-change metaphor for desiring Christ.
