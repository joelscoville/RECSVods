  - id: s20260621-charismatic-history
    video_id: dNeZD1HUmmE
    start: 4513.82
    end: 4715.34
    type: sermon
    title: The speaker's account of charismatic history
    speaker_id: yong-teck-meng
    confidence: 0.85
    scripture: []
    topics:
      - holy-spirit
      - discernment
      - service-life
    summary: Yong traces charismatic history to the 1906 Azusa Street revival, acknowledging earlier phenomena and describing unverified manifestations, media-driven spread and denominational branches. He contrasts his account of Bible Presbyterian cessationism with the congregation's position, which he describes as non-cessationist but opposed to public tongues and extreme charismatic practice.
    keywords:
      - azusa street
      - media
      - charismatic
