sermon_description: Rev. Yong Teck Meng connects love for Christ with a restored life of obedience
  and service rather than religious bargaining. Turning to Jesus' promise in John 14, he urges
  listeners to understand the Holy Spirit through Scripture rather than dramatic experiences alone.
  He presents the Spirit as divine helper and abiding presence, calling believers to seek truth,
  test claims and live truthfully amid weakness and continuing temptation.
