sermon_description: Pastor Yong presents Jesus' washing of the disciples' feet in John 13 as a call
  to follow him in practical love. Being beloved by Jesus offers assurance beyond worldly
  recognition, yet does not remove the need for humility, confession and responsible living.
  Contrasting Jesus' example with flawed leadership and endless discussion, he urges lowly service
  to become the hallmark of personal and church life.
