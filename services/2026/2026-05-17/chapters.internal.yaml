    summary: Pastor Yong interprets John 13:1 as complete love, noting translation limits and drawing on hymn imagery, Henri Nouwen's writing and a thought he attributes to Augustine about being beloved. Contrasting everyday feelings of failure with that assurance, he uses a claimed sub-two-hour marathon and overlooked runner, alongside his own fleeting media recognition, to urge trust amid unresolved struggles rather than measuring worth by worldly success.
