    summary: Recapping John 12's frustrated political expectations and unbelief, Pastor Yong urges investigating charismatic miracle claims, citing a paranormal challenge while distinguishing miracles from on-demand promises. Connecting Isaiah's prophecy, divine timing and election, he interprets hardening through God's perfection and human fallenness as permitted persistent resistance, rejects blaming God for sin, and urges prayer and hope for change before turning to John 13 and Jesus' good news.
