      - John 14:26
      - John 14:27
    topics:
      - holy-spirit
      - truth
      - discernment
    summary: The preacher reviews objective and subjective truth through everyday examples and Singapore’s pragmatism, linking the Spirit’s illumination and assurance to a view he attributes to Augustine and to the Westminster Confession. Contrasting education with spiritual understanding and local complaints with persecuted Christians including Wang Yi, he emphasizes Christ’s peace and commitment to truth before returning to charismatic churches.
