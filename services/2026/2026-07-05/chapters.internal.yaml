    title: The preacher’s account of the charismatic movement
    confidence: 0.85
    scripture: []
    topics:
      - discernment
      - holy-spirit
      - mission
      - prayer
      - worship
    summary: Discussing Stephen Tong’s ministry, the preacher distinguishes extreme charismatic practice from the wider movement while recounting its origins, second-experience claims, army encounters, laughter, prosperity teaching and media influence. He discusses social self-interest, the Third Wave and a reported miraculous-evangelism encounter, then critiques hypergrace’s treatment of confession and uses megachurch presentation, televised stage effects and a disco-ball conversation to discuss worship expectations.
    keywords:
      - liberalism
      - charismatic
      - second experience
      - army
      - laughter
      - media
      - power evangelism
      - hypergrace
      - megachurch
      - stage
