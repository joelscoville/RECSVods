  - id: s20260531-recap
    video_id: m51rgcZHQmE
    start: 1752.92
    end: 2281.2
    type: sermon
    title: Recap — betrayal, responsibility and repentance
    confidence: 0.9
    review_notes:
      - Previous-session title belongs to the recap only. Medical and historical claims need review.
    scripture:
      - John 13
      - John 12:6
      - James 1
    topics:
      - responsibility
      - knowing-god
      - repentance
      - forgiveness
      - faith
      - discipleship
    summary: Preparing to address the middle of John 13, the preacher disputes sympathetic portrayals of Judas, extends responsibility for failure to other crucifixion participants, Peter and the congregation, and distinguishes regret from repentance. Recounting a counselling visit, he urges medical help for suicidal distress, emphasizes forgiveness over self-reliance and calls for sincere commitment rather than repeatedly testing salvation.
    keywords:
      - john 13
      - judas
      - regret
      - repentance
      - medical help
      - suicidal
      - forgiveness
  - id: s20260531-glory
    video_id: m51rgcZHQmE
    start: 2281.2
    end: 3515.4
    type: sermon
    title: The paradox of suffering and glory
    confidence: 0.91
    review_notes:
      - Includes opening prayer and extended AI illustration. External claims are not fact-checked.
    scripture:
      - John 13:31-35
      - John 13
      - John 13:31-32
    topics:
      - prayer
      - faith
      - discipleship
      - glory
      - responsibility
      - forgiveness
      - worship
    summary: The preacher prays for receptive hearts, places John 13 in its Last Supper setting and uses military memories to connect anticipated suffering with glory through the cross. Drawing on a document he attributes to Pope Leo XIV, technological enhancement and longevity, Terminator and chatbot illustrations, denominational contrasts and references to Stephen Tong, Westminster and John Piper, he argues for human worth, forgiveness in imperfect relationships and glorifying God through trials, joy, work and everyday service; external claims remain unverified.
    keywords:
      - last supper
      - glory
      - suffering
      - encyclical
      - transhumanism
      - post humanism
      - terminator
      - chatbot
      - catholic
      - protestant
  - id: s20260531-childlikeness
    video_id: m51rgcZHQmE
    start: 3515.4
    end: 4046.56
    type: sermon
    title: Childlikeness, humility and growing older
    confidence: 0.89
    review_notes:
      - Review Greek terminology, brief Chinese quotation and medical anecdotes.
    scripture:
      - John 13:33
      - 1 John 2-4
      - Matthew 18
    topics:
      - knowing-god
      - faith
      - discipleship
      - prayer
    summary: The preacher interprets Jesus’s address to confused disciples as affection and connects being loved by God with Matthew 18’s call to humble childlikeness rather than childishness. Through personal reflections and reported news and later-life work anecdotes, he challenges habitual expectations of decline and urges openness to God and continuing purpose amid ageing.
    keywords:
      - disciples
      - childlikeness
      - humility
      - childish
  - id: s20260531-new-mark
    video_id: m51rgcZHQmE
    start: 4046.56
    end: 4573.3
    type: sermon
    title: A new mark of Christ’s followers
    confidence: 0.93
    review_notes: []
    scripture:
