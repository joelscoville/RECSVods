      - Matthew 22
      - John 13:34-35
      - 1 John 4
      - John 13:35
    topics:
      - discipleship
      - service-life
      - knowing-god
      - love
      - glory
      - service
    summary: Focusing on John 13:34 and Maundy Thursday, the preacher compares earlier love commandments with Jesus’s new command and argues that love, rather than nationality, family or profession, identifies Christ’s followers. Drawing on 1 John 4, a German church building and charity-sector experience, he challenges measures of glory based on architecture, denomination, wealth or power and urges collaboration over competition.
    keywords:
      - commandment
      - love
      - mark of christ
      - identity
      - charities
      - competitors
  - id: s20260531-new-life
    video_id: m51rgcZHQmE
    start: 4573.3
    end: 4993.68
    type: sermon
    title: A new model of life together
    confidence: 0.91
    review_notes:
      - Amish and insurance illustrations are speaker claims, not advice from the archive.
    scripture:
      - John 13:34
    topics:
      - discipleship
      - service-life
      - forgiveness
      - service
      - mission
    summary: The preacher advocates shared faith beyond self and family without self-hatred, calling for forgiveness and practical support rather than isolation or replacing community with online sermons. Through an insurance joke and an Amish housebuilding account, he imagines mutual care easing anxiety while questioning inward-looking communities, and proposes cell groups while acknowledging uncertainty about their outcome.
    keywords:
      - greater than self
      - journey of faith
      - family
      - support
      - amish
      - community
