sermon_description: Reading John 13, the preacher presents Jesus’s command to love as the defining
  mark of Christ’s followers and a pattern for shared life beyond self and family. Against the
  background of human failure, suffering and the call to childlike humility, he urges believers to
  take Christ’s example as their measure, forgiving and supporting others in obedience to a command
  rather than personal preference.
