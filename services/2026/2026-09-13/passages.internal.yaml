    topics: [eternal-life]
    scripture: []
    transcript: 'The question asked is related to last week’s sermon, because last week we spoke about eternal life. There were two questions related to it. I’m summarizing; the questions were actually a little bit long. You spoke about eternal life starting now: what about the afterlife? What will happen next? Another one is a little bit more pragmatic question: given that our Lord Jesus is returning and we will be resurrected, what is the Reformed view on cremation? That one is interesting. We actually touched on this before, but some of these topics are pretty real. We want to sometimes take the time to repeat or review some of the teachings so that you will remember them. I will answer these questions later as we go into the text proper.'
