  - id: p0913-jesus-prayer
    video_id: GkmB_KeBlBw
    section_id: s0913-review
    start: 2077.18
    end: 2144.18
    type: sermon
    title: John 17 as an insight into Jesus’ prayer
    summary: The preacher describes John 17 as an unusual view of Jesus addressing the Father and draws attention to Jesus’ own practice of prayer.
    questions: ['Why does the preacher call John 17 the real Lord’s Prayer?']
    topics: [prayer]
    scripture: ['John 17']
    transcript: 'Quick review as to what was taught last week. We entered into John 17, which I told you is considered one of the most important chapters in the Bible by many scholars, because it is a chapter where we get to look into the personal prayer of our Lord Jesus Christ. You will find no other chapters or verses that have such in-depth display of what Jesus prayed. [Unclear ASR phrase about the Trinity.] The interaction between God the Father and God the Son is very precious, very unusual, the insight into it. So this is the real Lord’s Prayer. The Lord’s Prayer that we pray is not the prayer of Jesus, the prayer for us. [Prayer quotation omitted.] One of the key side lessons I wanted to highlight is the role of prayer: we need to be prayerful simply because Jesus Christ was prayerful when he walked the earth.'
    confidence: 0.85
    review_notes: ['ASR “three-room God” not silently retained as a theological term.']
  - id: p0913-pray-more
    video_id: GkmB_KeBlBw
    section_id: s0913-review
    start: 2144.18
    end: 2207.2
    type: sermon
    title: Learning from the desire to pray more
    summary: The preacher attributes a wish to have prayed more to Billy Graham and John Stott, then returns to Jesus’ prayer for glorification.
    questions: ['What lesson does the preacher draw from the wish to pray more?']
    topics: [prayer]
    scripture: ['John 17:1-5']
    transcript: 'No matter what you think about prayer, all you have to remember is that Jesus Christ found the need to pray often and much. I told you last week that the great Billy Graham, when asked, if you had to live your life all over again, what would you do? He said, I will pray more. I discovered that another person said the same thing, John Stott. John Stott was also one of the great Christians who ever lived. Today I want to carry on with the thoughts of J. I. Packer. Packer and John Stott were considered giants in the Christian world in the last century. John Stott said, if I start over again, I’ll pray more. I find it instructive and I feel that’s the thing we all need to do. But when we saw the prayer of Jesus Christ, [quotation omitted; John 17:1, ESV reference only], that was the first thing he prayed.'
    confidence: 0.86
    review_notes: ['Historical quotations are the preacher’s attributions, not independently verified quotations.']
  - id: p0913-glory-suffering
    video_id: GkmB_KeBlBw
    section_id: s0913-review
    start: 2207.2
    end: 2280.66
    type: sermon
    title: Glory despite suffering and the sovereign will of God
    summary: The preacher contrasts worldly ideas of glory with his reading of Jesus’ coming suffering and introduces his Reformed account of divine election.
    questions: ['How does the preacher connect Jesus’ suffering with glory?']
    topics: [faith, eternal-life]
    scripture: ['John 17:1-5']
    transcript: 'It was quite very strange, right? Because terrible sufferings would follow. Therefore the question: what does he mean by glorifying? Right after the prayer he was arrested, tortured, put on a cross, and all kinds of horrifying things happened. But yet he considered those to be glory. [Hymn quotation omitted.] We have problems understanding it because we don’t understand that glory is actually the very nature of God. Our concept of glory is: we glorify ourselves, build a big building, win some award or whatever it is. Whenever things are negative, it’s not glorious. But because glory is the nature of God, Jesus was talking about returning to his original status before the foundation of the world. [Embedded John 17 quotation omitted.] We talked a little bit about the sovereign will of God. This is a Reformed evangelical distinctiveness: we believe that all of us who really belong to Jesus Christ, before the foundation of the world he already chose us.'
    confidence: 0.86
  - id: p0913-eternal-definition
    video_id: GkmB_KeBlBw
    section_id: s0913-review
    start: 2280.66
    end: 2339.56
    type: sermon
    title: Returning to John 17:3 to define eternal life
    summary: The preacher directs listeners to John 17:3 rather than popular assumptions when asking what eternal life means.
    questions: ['Where does the preacher look for the meaning of eternal life?']
    topics: [eternal-life]
    scripture: ['John 17:3']
    transcript: '[Continuation of John 17 paraphrase omitted.] The focus last week was on eternal life, because Jesus said he can give eternal life. So what is eternal life? There are a lot of misconstructions about this still today, and in religion, even in Christianity, we kind of get confused about what eternal life is all about. The answer is in verse 3 because Jesus Christ himself gave the answer. That being the case, I want to encourage you to understand: no matter what you study or know from the rest of the world, just look at John 17 verse 3. [Scripture quotation omitted; John 17:3, ESV reference only.] This is a very unusual thing that may take us by surprise because of the word eternal life.'
    confidence: 0.88
  - id: p0913-knowing-deeply
    video_id: GkmB_KeBlBw
    section_id: s0913-review
    start: 2339.56
    end: 2387.06
    type: sermon
    title: Knowing God deeply rather than superficially
    summary: The preacher emphasizes the limits of language and distinguishes intimate knowledge of God from knowing facts about God.
    questions: ['What distinction between knowing God and knowing about God frames the sermon?']
    topics: [eternal-life, discipleship]
    scripture: ['John 17:3']
    transcript: 'Again I want to remind you that human languages are very limited. When we think about God and the things of God, the English language, Indonesian language, Chinese language, they all have their own limitation. The word eternal life really means to be one with God, to know him. [Greek term and comparison uncertain in ASR; omitted.] Therefore, to know God means you know God deeply, not just superficial knowledge. The difference between knowing about God and knowing God is extremely important. Today we want to focus very much on the last part as an extension of last week’s lesson: what does it really mean to know about God versus knowing God, and also take the opportunity to answer the question that was raised.'
    confidence: 0.85
  - id: p0913-teachable-prayer
    video_id: GkmB_KeBlBw
    section_id: s0913-sermon-prayer
    start: 2387.06
    end: 2446.0
    type: prayer
    title: Asking for humility to hear and follow
    summary: The preacher prays that pride and past successes or failures will not prevent listeners from receiving the message.
    questions: []
    topics: [prayer, discipleship]
    scripture: []
    transcript: 'Let’s come before God in a time of prayer and commit the time to him. We thank you, God, that we can come before you and have a session to really think deeply into what we believe. We know that God the Holy Spirit is in every single one of us who truly believe you, and he is living and real. But we block him often because of our pride and our own reluctance to obey. We do pray that you grant us a heart that is humble and teachable, whoever we may be, however old we are or young we are, whatever we have encountered in our life, the successes and the failures. May we set them all aside, that we can come before you as a little child would before his heavenly Father, so that we will hear you, recognize you, turn and follow. [Scripture-related closing wording omitted; reference not announced.] In Jesus’ name we pray, amen.'
    confidence: 0.87
    review_notes: ['End approximates prayer/sermon transition inside the 2444.18–2452.34s ASR segment; no subsecond certainty claimed.']
  - id: p0913-more-than-duration
    video_id: GkmB_KeBlBw
    section_id: s0913-eternal-life
    start: 2446.0
    end: 2523.62
    type: sermon
    title: Eternal life is more than living physically forever
    summary: The preacher reads the opening of John 17 and describes eternal life as knowing God and sharing in what he calls God’s goodness and beauty.
    questions: ['Why does the preacher say eternal life means more than endless physical life?']
    topics: [eternal-life]
    scripture: ['John 17:1-3']
    transcript: 'The opening verses of John 17 are revolutionary because we get to hear Jesus Christ speak to his Father. [Scripture quotations omitted; John 17:1-3, ESV reference only.] Last week I spent quite a bit of time to tell you that that’s what eternal life means. It’s not just simply living physically forever, but to know God, to be one with God, to be everything that God meant for us to be. Of course then the physical eternity and the living eternity is part of it because God is eternal. But it’s much, much more than that. It is everything which belongs to God, all the wonders of God, all the beauty of God, every wonderful thing.'
    confidence: 0.88
