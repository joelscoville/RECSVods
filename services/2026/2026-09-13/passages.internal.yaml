    scripture: []
    transcript: 'While standing, let me lead you in opening prayer. Our Father in heaven, to you alone be the glory this morning, for you have done great things for us. We thank you for your Son, Jesus Christ, whose sacrifice atoned for our sin and opened the way for us to come before you and call you our Father. Forgive our unbelief and the weaknesses of our faith. We thank you that when you gave us new life, you did not leave us as an infant in the faith. Through your word, Spirit, and this church, RECS, you have nourished us with spiritual milk, with solid food, so that we may grow in maturity.'
