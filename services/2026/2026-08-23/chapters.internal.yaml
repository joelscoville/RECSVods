  - id: s20260823-politics-question
    video_id: QCNrRkiFeKw
    start: 2102.12
    end: 2729.62
    type: question-answer
    title: Christian citizenship and political involvement
    speaker_id: pastor-yong
    confidence: 0.94
    scripture: []
    topics:
      - politics
      - government
      - authority
      - discipleship
      - responsibility
      - justice
      - discernment
    summary: Answering a National Day follow-up, Pastor Yong places allegiance to God's kingdom above family and work roles, urging taxes, voting and conscientious work without withdrawal, aggressive partisanship or unquestioning trust in politicians. Through his international legal comparisons and historical examples, he urges wisdom about resisting government and says the pulpit should teach justice while leaving party choices to individuals.
    keywords:
      - politics
      - allegiance
      - primary identity
      - taxes
      - voting
      - citizenship
      - different countries
      - justice
      - party
      - government
  - id: s20260823-recap
    video_id: QCNrRkiFeKw
    start: 2730.08
    end: 3096.16
    type: sermon
    title: Farewell Discourse recap and sermon prayer
    speaker_id: pastor-yong
    confidence: 0.93
    scripture:
      - John 16
    topics:
      - discipleship
      - politics
      - holy-spirit
      - discernment
      - prayer
    summary: Pastor Yong recalls religious violence and the disciples' pre-crucifixion setting, then outlines creation, fall, redemption and consummation, saying the indwelling Spirit means believers are never alone. He questions AI companions and deceased-person avatars as answers to loneliness, urges shared obedience and prays that listeners recognize God's care and presence.
    keywords:
      - holy spirit
      - loneliness
      - presence
  - id: s20260823-jesus-cares
    video_id: QCNrRkiFeKw
    start: 3097.04
    end: 3625.88
    type: sermon
    title: Jesus knows the disciples' anxiety
    speaker_id: pastor-yong
    confidence: 0.94
    scripture:
      - John 16:16
      - John 16:16-18
      - Romans 8
      - John 16:17-18
      - John 16:19
      - 1 Peter 5:7
    topics:
      - discipleship
      - holy-spirit
      - authority
      - faith
      - prayer
      - worship
    summary: Pastor Yong contrasts the disciples' earthly expectations with a common death-and-resurrection reading of John 16, linking the Spirit's coming with Romans 8 while acknowledging the Trinity's mystery. Describing Jesus' recognition of their anxiety as discernment or supernatural knowledge, he addresses loneliness and hopelessness through 1 Peter 5:7 and biblical, group-centered songs, urging trust in God's promises while acknowledging its difficulty.
    keywords:
      - disciples
      - spirit of christ
      - resurrection
      - pentecost
      - power
      - songs
      - trust
  - id: s20260823-labour
    video_id: QCNrRkiFeKw
    start: 3626.08
    end: 4068.5
    type: sermon
    title: Sorrow and the illustration of childbirth
    speaker_id: pastor-yong
    confidence: 0.92
    scripture:
      - John 16:20
      - Revelation 3:14
      - John 16:21
      - John 16:22
    topics:
      - faith
    summary: Pastor Yong links amen in John 16:20 with Revelation 3:14 and discusses lament through Jesus' childbirth illustration, acknowledging that he lacks a mother's experience. Recalling his sister's labour and his own parenting fears and laughter, he cautions against minimizing childbirth pain and returns to the disciples' shock at the crucifixion before promised joy.
    keywords:
      - amen
      - sorrow
      - laughter
      - disciples
  - id: s20260823-access
    video_id: QCNrRkiFeKw
    start: 4068.68
    end: 4422.02
    type: sermon
    title: Asking the Father in Jesus' name
    speaker_id: pastor-yong
    confidence: 0.93
    scripture:
      - John 16:23
      - Hebrews 10:19-20
      - Hebrews 10:23
      - Hebrews 10:20
      - John 16:16-24
    topics:
      - prayer
      - holy-spirit
      - discernment
      - sacrifice
      - faith
    summary: Pastor Yong links John 16:23 with Pentecost, describing prayer in Jesus' name as serving Christ's purposes rather than self-serving requests. Drawing on Hebrews 10, he contrasts his evangelical understanding with his descriptions of Jewish and Roman Catholic practices, treasures access to the Father through Christ's death and the Spirit, and recalls the disciples' suffering and uncertainty before knowing the outcome.
    keywords:
      - purpose
      - glory
      - access
      - father
      - holy spirit
  - id: s20260823-suffering
    video_id: QCNrRkiFeKw
    start: 4423.34
    end: 4847.22
    type: sermon
    title: Living between redemption and consummation
    speaker_id: pastor-yong
    confidence: 0.91
    scripture:
      - Romans 8:20-21
      - Romans 8:20-23
      - Romans 8:22-23
      - Romans 8:23-25
      - John 16:21
    topics:
      - service
      - service-life
      - responsibility
      - faith
      - eternal-life
      - suffering
    summary: Pastor Yong contrasts pastors who avoid demands with those who share congregational burdens, using Romans 8's already-and-not-yet framework to explain continuing suffering. Recalling disasters and severe childhood illness, he acknowledges difficulty understanding suffering, affirms his Reformed view of God's sovereignty, discusses an objection he attributes to Richard Dawkins and urges patient hope rather than expecting exemption.
    keywords:
      - pastoral
      - not yet
      - suffering
      - health challenges
      - hope
  - id: s20260823-joy
    video_id: QCNrRkiFeKw
    start: 4847.22
    end: 5556.66
    type: sermon
    title: Joy in serving God's purposes
    speaker_id: pastor-yong
    confidence: 0.93
    scripture:
      - John 16:24
      - 1 Thessalonians 5:16
      - Philippians 4:4
      - Matthew 11
      - Matthew 5:11-12
      - Hebrews 1:9
      - Galatians 5:22-23
    topics:
      - prayer
      - service
      - faith
      - eternal-life
      - holy-spirit
      - joy
      - worship
      - service-life
      - discernment
      - discipleship
      - mission
    summary: Pastor Yong connects John 16:24 with joy in God's work, drawing on Paul, John the Baptist, persecution teachings and the Spirit's fruit while allowing despair, illustrated by his account of Mother Teresa. Discussing charismatic reactions to joyless traditional worship, manufactured enthusiasm and poor fellowship, he describes fulfilment in following Christ through Richard Pratt's seminary work in India and his own ministry, urging trust, obedience and mutual encouragement.
    keywords:
      - fullness of joy
      - despair
      - joyless
      - manufactured
      - third millennium
      - journey of faith
