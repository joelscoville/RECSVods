sermon_description: Pastor Yong reads John 16:16-24 as encouragement to trust Christ's care when
  sorrow obscures what lies ahead. He connects the disciples' promised joy with access to the Father
  through Christ and the Spirit, directing prayer toward Christ's purposes. Drawing on Romans 8, he
  acknowledges continuing suffering and periods of despair while urging patient hope, mutual
  encouragement and the joy of participating in God's work.
