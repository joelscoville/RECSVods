sermon_description: Pastor Yong challenges the idea that an easy life proves God's blessing, reading
  John 15 as a call to faithful witness amid opposition. He distinguishes the fallen world's
  hostility from the goodness Christians can recognize through common grace, while exploring the
  conflicting values and responsibilities of following Christ. He urges lifelong service and
  perseverance grounded in Scripture rather than retreat into comfort or passivity.
