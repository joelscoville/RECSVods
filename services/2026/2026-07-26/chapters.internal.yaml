    summary: Recapping love, friendship and election, Pastor Yong challenges cultural assumptions, ethnic church boundaries and habitual or restful churchgoing through a Chinese conference, The Middle and preaching experiences, placing Scripture above opinion. He discusses MacArthur's disputed doulos language, accepting its loving-master emphasis and linking dependence on Christ with extending Christ's love to others.
