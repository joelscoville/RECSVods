    summary: Pastor Yong distinguishes severe persecution from lesser pressures through Open Doors figures, reported Xiamen detentions and an oncologist's distress, Singapore speech cautions, bribe refusal and personal rejection. Citing Timothy, John and Stott, he describes expected opposition through clashing values, reunion priorities, racism, biblical light-darkness contrasts and following Jesus, urging balanced attention to spiritual opposition in counseling and mediation.
