  - id: s20260726-world
    video_id: D7gXD-Mo25s
    start: 2907.54
    end: 3467
    type: sermon
    title: The world's hatred and a disputed interpretation
    speaker_id: pastor-yong
    confidence: 0.9
    scripture:
      - John 15:12-19
      - John 7:7
      - John 15:18-19
    topics:
      - prayer
      - discernment
      - discipleship
      - truth
      - government
      - worship
      - peace
      - mission
    summary: After praying for teachability amid competing influences, Pastor Yong traces the farewell discourse from mutual love to the world's hatred and examines differing meanings of world. He questions condemnation-led evangelism through accounts of MacArthur's COVID resistance, legal conflict and anti-Pope rhetoric, contrasting local compliance and religious-harmony restrictions and discussing historic confessional language and a congregant's preference for divine hatred.
    keywords:
      - humble and teachable
      - world
      - macarthur
      - covid
      - religious harmony
      - condemning
      - evangelism
