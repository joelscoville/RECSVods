      - service
      - mission
      - discernment
      - responsibility
      - stewardship
    summary: Using the Good Samaritan and distinguishing common from special grace, Pastor Yong recognizes goodness beyond Christianity and interprets John's hostile world as its fallen part, separating appreciation of an atheist musician from claims about salvation. His Habitat accounts cover Singapore's housing and flood context, permit obstacles, elderly-home cleaning and lighting disputes, and interfaith volunteers whose generosity he contrasts with churches bargaining over costs.
