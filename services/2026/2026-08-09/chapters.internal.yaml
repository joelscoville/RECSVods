  - id: s20260809-sermon-introduction
    video_id: gO6gc5jL-jU
    start: 2104.7
    end: 2365.44
    type: sermon
    title: National Day reflection and a question about Christianity
    confidence: 0.89
    scripture:
      - Matthew 7
    topics:
      - government
      - service-life
      - faith
      - discipleship
      - discernment
      - politics
    summary: Introducing National Day reflection and question submissions, the preacher addresses difficulty sharing the gospel and fears of a Christian minority through his reading of the narrow way. He distinguishes cultural Christianity from belief, admits he cannot identify everyone in God's kingdom, recalls disagreement with Stephen Tong over final numbers, and uses the National Day logo to connect assumptions about Christian power with citizenship.
    keywords:
      - national day
      - become a minority
      - cultural christianity
