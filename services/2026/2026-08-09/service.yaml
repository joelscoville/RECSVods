sermon_description: Reflecting on National Day, the preacher argues that allegiance to God should
  guide citizenship without turning faith into nationalism or excusing civic responsibility. He
  reads civil authority as accountable to God, urges discernment toward fallible leaders, and weighs
  compassion for migrants alongside fairness to fellow citizens. His call is to contribute honestly
  to the society where one lives, seek its welfare and pray for its leaders.
