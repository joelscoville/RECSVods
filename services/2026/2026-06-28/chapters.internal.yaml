    scripture:
      - John 13
      - Matthew 5
    topics:
      - repentance
    summary: Comparing Peter and Judas, the preacher emphasizes Peter’s repentance and uses an imagined Roman Catholic confession, civil penalties, Matthew 5 and a speck in the eye to contrast quantitative views of wrongdoing with his view of sin before God. He distinguishes earthly consequences, warns against cynicism after leaders’ failures or using forgiveness to abandon holiness, and extends his adultery illustration to pride, anger and love of money.
    keywords:
      - peter and judas
      - repentance
      - forgiveness
      - transactional
      - quantitative
      - qualitative
      - consequences
