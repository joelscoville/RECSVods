  - id: s20260607-sermon-only
    video_id: 8Qjfp-2L5d8
    start: 4024.74
    end: 4910.88
    type: sermon
    title: John 14 and the claim of exclusivity
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture:
      - John 14:4-6
      - John 14:6
      - John 14:6-7
      - Acts 4:8-12
    topics:
      - truth
      - knowing-god
      - faith
      - responsibility
    summary: From Thomas' question, the pastor explores way, truth and life through scholarly and East-West illustrations, contrasts objections and his account of Baha'i inclusivity with Christian exclusivity, and cautions against reckless public claims. He argues for Reformed revelation-faith and human limits while allowing some knowledge through general grace, using political power, moral leadership, an air analogy and the Acts 4 healing account to defend his reading of Christ as the only way.
    keywords:
      - john 14
      - thomas
      - only one way
      - revelation faith
      - self help faith
      - military
      - economic
      - moral leadership
      - peter and john
      - acts 4
  - id: s20260607-sermon-humility
    video_id: 8Qjfp-2L5d8
    start: 4910.88
    end: 5762.32
    type: sermon
    title: Rejecting arrogance and leaving judgment to God
    speaker_id: yong-teck-meng
    confidence: 0.87
    review_notes:
      - Keep the speaker's qualifications about possible exceptions and continuing evangelism together; quotation and ASR issues need listening.
    scripture:
      - John 14:6
      - Philippians 2:9-11
    topics:
      - discipleship
      - mission
      - responsibility
      - prayer
      - eternal-life
      - knowing-god
      - faith
      - service
    summary: Warning against arrogant evangelism in multireligious Singapore, the pastor affirms Christ as the only way while leaving individuals' salvation, including his grandmother's, unknown to him and in God's hands; he urges prayer, loving outreach and help regardless of conversion. Drawing on Lewis and a saying attributed to Wesley, he allows possible exceptions to the usual model under God's sovereignty, but explicitly calls his imagined deathbed encounter unsupported by scripture and unsuitable to preach as a method.
    keywords:
      - arrogance
      - hatred
      - loved ones
      - c s lewis
      - usual model
      - kingdom
      - gospel
      - love
