    summary: Introducing Only and a question about Christian exclusivity, the pastor recaps glory amid suffering and everyday witness, urging childlike expectation and bringing burdens to God rather than relying on worship style. Through examples of religious communities, church changes, dialect identity, family and retirement, he presents Jesus' commanded love as extending beyond social boundaries and isolation into the community expressed in Communion.
