  - id: s20260607-sermon-troubled
    video_id: 8Qjfp-2L5d8
    start: 2881
    end: 3539.72
    type: sermon
    title: The troubled heart and the speaker's comparison with Buddhism
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - John 13-15
      - John 13:38
      - John 14:1
    topics:
      - prayer
      - discipleship
      - faith
      - responsibility
      - meditation
    summary: Praying for receptiveness, the pastor reads John 14 within the continuing farewell discourse, relating Jesus' reassurance after betrayal and predicted denial to the disciples' uncertainty and ordinary troubles. Drawing on childhood memories and everyday examples, he describes Buddhism's eight sufferings and the Eightfold Path, including desire, separation, speech, livelihood and meditation, characterizing the approach as reliant on personal effort.
    keywords:
      - disciples
      - trouble
      - eight sufferings
      - aging
      - desire
      - speech
      - livelihood
      - self help
      - meditation
  - id: s20260607-sermon-hope
