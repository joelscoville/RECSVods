      - knowing-god
      - eternal-life
      - discipleship
      - holy-spirit
    summary: The pastor urges trust in God and Jesus amid contemporary worries, describing Jesus as embodying the invisible God and the Father's house as an intimate, permanent home, with the song There Is a Hope reinforcing that comfort. He reads John 14:3 both as future presence and transformation with Christ and as a promise of the Holy Spirit's sustaining help now.
