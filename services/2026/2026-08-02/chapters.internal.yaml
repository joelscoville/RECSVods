  - id: s20260802-cambodia
    video_id: 1R4gnCvqrOA
    start: 3636.94
    end: 4132.82
    type: sermon
    title: Cambodia recollection — poverty and a mistaken judgment
    speaker_id: pastor-yong
    confidence: 0.82
    review_notes:
      - Keep the initial assumption with the later correction; medical, cultural and autobiographical claims are not independently verified.
    scripture: []
    topics:
      - service
      - mission
      - discernment
      - faith
      - repentance
    summary: Pastor Yong recalls Cambodian housing work with an HIV-support NGO, a former soldier’s hospitality and an anecdote attributed to Stephen Tong; his medical and administrative claims remain unverified. He recounts staff buying a woman’s vegetables to spare her a market walk and her wish to give the money to a temple for a better next life, then admits shame at judging her after learning she had been raped during war, returning to his criticism of future-only religion.
    keywords:
      - farmer
      - stephen tong
      - autobiography
      - temple
  - id: s20260802-sanctification
    video_id: 1R4gnCvqrOA
    start: 4132.82
    end: 4402.64
    type: sermon
    title: Redemption and lifelong sanctification
    speaker_id: pastor-yong
    confidence: 0.9
    scripture:
      - Ephesians 5:15-17
      - Matthew 25
      - Ephesians 5:17
    topics:
      - discipleship
      - faith
      - sanctification
      - stewardship
    summary: Pastor Yong describes sanctification as lifelong growth toward Christ within redemption, citing a statement attributed to Martin Luther against treating faith as merely a ticket to heaven. Linking Ephesians 5 with the talents and rich-man illustrations, he urges purposeful use of time and entrusted resources rather than drifting toward retirement.
