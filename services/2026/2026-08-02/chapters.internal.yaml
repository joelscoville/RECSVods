      - truth
      - service-life
      - faith
    summary: Pastor Yong discusses questions about reincarnation, qigong, out-of-body experiences and prophecy, claimed links with mysticism and vaccination disagreements. Using a doctors’ analogy attributed to Arnold Schwarzenegger while allowing that the dissenter could be right, he urges objective inquiry and describes Scripture as sufficient for salvation, faith and life.
