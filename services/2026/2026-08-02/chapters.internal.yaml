      - holy-spirit
    summary: Recapping the previous session, Pastor Yong criticizes Christian segregation and distinguishes goodness among nonbelievers from what he describes as the fallen world’s opposition to faith. Citing 2 Timothy 3:12, he links opposition to differing worldviews and spiritual allegiance, discusses the cost of witness and presents John 16 as continuing the preceding chapter.
