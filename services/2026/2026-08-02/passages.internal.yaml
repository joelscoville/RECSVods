    transcript: '[Edited ASR excerpts.] I do believe that objective truth and objective evidences and even the scientific method is actually very important. [Car engineering and testing illustration omitted.] In all these things too, I do believe that it is important to seek objective truth and to seek a reasonable understanding of where it’s coming from. At the same time, remember that the Bible is sufficient unto faith relating to the category of the will of God in salvation, in faith and in life. The Westminster Confession of Faith says that the Bible is fully sufficient on it. The Bible doesn’t comment on qigong and all these things because it’s not relevant to the whole scheme of things. I do not place a lot of emphasis on all this, and I don’t think that the church should dwell a lot on things that are not covered by the Bible in relation to salvation, faith and life. [Transition to today’s text.]'
