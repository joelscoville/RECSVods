recordingTitle: A Glimpse
serviceDate: 2026-03-08
status: draft
sermonDescription: Beginning John 11, the preacher considers suffering through Jesus' deliberate delay before visiting Lazarus. The account offers a glimpse of God's knowledge, purpose and timing beyond the disciples' limited perspective. Scripture does not answer every painful why, yet gives sufficient truth for faith and life. He urges honest compassion, walking in the light and trust in God's goodness, freedom from error and love while the future remains unclear.
sermonScripture:
  - John 11:1-16
  - Isaiah 55:6-9
sermonTopics:
  - suffering
  - faith
  - prayer
