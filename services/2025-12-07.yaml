recordingTitle: Dreaming of Swimming in Icy Water
serviceDate: 2025-12-07
status: draft
sermonDescription: Jesus' promise of freedom exposes religious identity that fails to recognize slavery to sin. A burning house mistaken for refreshing water illustrates self-deception and the Spirit's awakening work. The preacher distinguishes spiritual, temporal and eternal consequences from visible success, then presents salvation as a transformation from slave to beloved child. Freedom in Christ enables fruitful life rooted in God's word rather than merely escape from punishment or accumulation of religious effort.
sermonScripture:
  - John 8:31-36
  - Jeremiah 17:5-10
  - 1 John 3:1
sermonTopics:
  - truth
  - salvation
  - discernment
