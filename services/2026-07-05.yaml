  - chapterId: c20260705-abiding-spirit
    chapterTitle: The Spirit Abides and Leads Believers into Truth
    chapterKind: sermon
    chapterStart: "39:26.82"
    chapterEnd: "1:01:30.02"
    points:
      - pointTime: "39:26.82"
        pointText: Responding to a question about charismatic churches, the preacher grounds discernment in
          the Spirit’s illumination, peace and continuing presence, while qualifying his recommended
          resources and illustrating his argument about fear.
      - pointTime: "42:14.26"
        pointText: The Spirit's role as helper is connected with truth.
      - pointTime: "46:28.9"
        pointText: Literary admiration for the Bible is distinguished from assurance through the Spirit's inward work.
      - pointTime: "52:45.66"
        pointText: The preacher recommends MacArthur's work while reserving disagreement with cessationism.
      - pointTime: "57:00.82"
        pointText: Being filled is explained as living out the Spirit's continuing presence.
    subchapters:
      - chapterId: s0705-spirit
        chapterTitle: Live in the Spirit’s Continuing Presence
        chapterKind: sermon
        chapterStart: "54:40.84"
        chapterEnd: "1:01:30.02"
        points:
          - pointTime: "54:40.84"
            pointText: The preacher reads John 14 as promising the Spirit’s continuing presence and challenges
              fear and repeated requests for the Spirit to return.
          - pointTime: "55:47.68"
            pointText: The Spirit's continuing presence is contrasted with practices associated with local religious mediums.
          - pointTime: "57:00.82"
            pointText: Fullness is described as living out an abiding presence rather than receiving a Spirit who repeatedly departs.
          - pointTime: "59:35.48"
            pointText: Fearful hotel staff provide an illustration of the preacher's teaching about the Spirit's presence.
          - pointTime: "1:00:35.02"
            pointText: The Spirit's help and teaching are presented as consistent with Christ.
        chapterScripture:
