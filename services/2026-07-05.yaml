recordingTitle: Signs and Wonders
serviceDate: 2026-07-05
status: draft
sermonDescription: The preacher argues that the Spirit’s abiding presence draws believers toward
  truth and obedience rather than dependence on impressive experiences. Reading John 14 alongside
  Acts and 1 Corinthians 14, he allows private tongues while prioritizing intelligible worship and
  rejecting a required second baptism. His appeal to Deuteronomy 13 calls listeners to test claims
  of wonders, trust God’s sovereignty and hold fast to scripture.
