  - chapterId: c20260705-scripture-and-experience
    chapterTitle: Test Spiritual Experience by Scripture
    chapterKind: sermon
    chapterStart: "1:01:30.02"
    chapterEnd: "1:18:47.76"
    points:
      - pointTime: "1:01:30.02"
        pointText: Distinguishing extreme charismatic practice from the wider movement, the preacher
          contrasts accounts of outward signs and worship expectations with his emphasis on
          scriptural authority, God’s sovereignty and holy living.
      - pointTime: "1:03:59.86"
        pointText: The preacher describes an interpretation of Acts that requires outward signs of a subsequent experience of the Spirit.
      - pointTime: "1:07:25.38"
        pointText: Radio, television and social media are discussed as influences on the spread of religious movements.
      - pointTime: "1:10:55.22"
        pointText: A teaching called hypergrace is contrasted with the congregation's practice of confession.
      - pointTime: "1:15:15.02"
        pointText: Scriptural authority is contrasted with reliance on visions, feelings or tradition.
    chapterScripture:
      - John 14
  - chapterId: c20260705-tongues-and-understanding
    chapterTitle: Tongues Must Build Up the Church
    chapterKind: sermon
    chapterStart: "1:18:47.76"
    chapterEnd: "1:35:32.5"
    points:
      - pointTime: "1:18:47.76"
        pointText: The preacher allows private tongues but requires public interpretation and intelligible
          teaching, using Acts to reject tongues as a required sign of a second baptism while an
          audience-wording discrepancy remains unresolved.
      - pointTime: "1:20:07.42"
        pointText: Acts 2 emphasizes hearers understanding their own languages.
      - pointTime: "1:23:38.68"
        pointText: 1 Corinthians 14:1-2 is used to explain the allowance for private incomprehensible tongues.
      - pointTime: "1:27:32.8"
        pointText: A visitor should be able to understand the preaching rather than leave confused.
      - pointTime: "1:33:04.7"
        pointText: The preacher rejects a required second baptism and locates baptism in the Spirit at receiving Christ.
    subchapters:
