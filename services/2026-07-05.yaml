  - chapterId: c20260705-testing-wonders
    chapterTitle: Test Wonders and Hold Fast to God’s Word
    chapterKind: sermon
    chapterStart: "1:35:32.5"
    chapterEnd: "1:44:35.68"
    points:
      - pointTime: "1:35:32.5"
        pointText: The preacher calls for verifiable evidence of wonders, cites an unsourced medical
          comparison, and urges prayer that trusts God’s sovereignty and obedience to scripture
          rather than impressive signs or popular teaching.
      - pointTime: "1:36:46.08"
        pointText: The preacher questions the evidence for longstanding public healing claims while acknowledging concern for sick loved ones.
      - pointTime: "1:39:30.8"
        pointText: Claims of raising someone from the dead are said to require verifiable evidence.
      - pointTime: "1:40:45.88"
        pointText: Prayer for miracles is encouraged alongside trust in God's sovereign decision.
      - pointTime: "1:42:03.44"
        pointText: Deuteronomy 13 calls for obedience to God's word rather than reliance on impressive signs.
