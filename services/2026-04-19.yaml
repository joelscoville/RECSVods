sermonDescription: The preacher reads Jesus' entry into Jerusalem on a donkey as a revelation of God's humility, love and peace rather than worldly power. Philippians 2 and the fruit of the Spirit connect Christ's example with the character believers should display. Addressing war and public conflict, he argues for discernment and a bias toward gentleness without allowing evil to prosper, trusting Christ's final victory.
