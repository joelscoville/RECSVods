recordingTitle: Press On and Live Forward
serviceDate: 2026-01-04
status: draft
sermonDescription: This New Year sermon contrasts life's recurring seasons with the unfolding of God's plan in time. Christ's coming brings adoption as God's children, changing how believers face an uncertain future. Paul's account of inner renewal and unseen eternal glory encourages hope amid physical decline. Philippians 3 calls for deliberate growth, release from past failures and pressing forward in obedience, illustrated through a husband's faithful care for his wife.
sermonScripture:
  - Ecclesiastes 3:1-22
  - Galatians 4:4-7
  - Philippians 3:12-14
sermonTopics:
  - hope
  - discipleship
  - faith
