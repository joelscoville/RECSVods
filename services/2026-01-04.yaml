    points:
      - pointTime: "1:09:09.41"
        pointText: Christ's coming in the fullness of time supplies God's answer for his people.
      - pointTime: "1:09:59.85"
        pointText: Salvation includes adoption and a transformed status as God's children.
      - pointTime: "1:12:56.93"
        pointText: Knowing God is a lifelong journey requiring childlike humility.
      - pointTime: "1:15:42.11"
        pointText: 2 Corinthians 4 distinguishes physical wasting away from daily renewal within.
      - pointTime: "1:20:09.95"
        pointText: Attention is directed toward unseen eternal realities rather than transient visible success.
  - chapterId: c20260104-press-on
    chapterTitle: Press On in Deliberate Obedience
