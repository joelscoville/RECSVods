    points:
      - pointTime: "1:24:01.07"
        pointText: Paul's forward movement flows from belonging to Christ rather than already being perfect.
      - pointTime: "1:24:41.05"
        pointText: Spiritual growth requires deliberate decision and action rather than waiting for a magical solution.
      - pointTime: "1:26:01.55"
        pointText: A Christian leader's care for his wife illustrates ordinary, costly obedience.
      - pointTime: "1:32:16.37"
        pointText: Forgetting what lies behind means refusing captivity to past failures rather than erasing memory.
      - pointTime: "1:35:12.83"
        pointText: The congregation is urged to act faithfully and make a life-long commitment beyond annual resolutions.
