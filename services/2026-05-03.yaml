sermonDescription: The preacher reads Jesus' troubled soul and coming death in John 12 as a call to glorify God through grief, obedience and witness. Christian joy does not exclude sorrow over a fallen world. He connects glorification with resisting sin and lifting up Christ, urging listeners to walk in the light while life and opportunity remain, finish faithfully and use their gifts in loving service.
