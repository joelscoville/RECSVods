recordingTitle: Hard Sayings
serviceDate: 2025-09-07
status: draft
sermonDescription: Christ's hard sayings are presented as difficult to accept rather than always difficult to understand. His words give spirit and life, including present fullness as well as eternal hope, yet require commitment that a consumer approach to faith resists. Disciples leaving and Peter remaining challenge reliance on popularity or attendance as measures of truth. Peter's movement from belief toward knowing Christ encourages receiving the whole word, trusting grace after failure and continuing in costly obedience.
sermonScripture:
  - John 6:60-71
  - Luke 9:57-62
  - Matthew 7:13-14
sermonTopics:
  - discipleship
  - faith
  - eternal-life
