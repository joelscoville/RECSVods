    chapterEnd: "5:58.46"
    points:
      - pointTime: "1:37.55"
        pointText: The intelligible preparatory prayer begins at confession and continues through the recorded remainder of ACTS and gathered prayer.
  - chapterId: c20250720-worship
    chapterTitle: Worship and Scripture
    chapterKind: opening
    chapterStart: "5:58.46"
    chapterEnd: "31:18.4"
    chapterScripture:
      - Psalms 121:1-4
      - Proverbs 12:1-28
      - John 5:18-29
      - Colossians 1:15-20
    points:
      - pointTime: "5:58.46"
        pointText: Patrick welcomes the congregation before greetings, silent meditation and the call to worship.
      - pointTime: "7:58.62"
        pointText: The call to worship leads into hymns, opening prayer and responsive Bible readings.
      - pointTime: "11:25.4"
        pointText: Opening prayer connects knowing the unseen God with hearing and honoring Jesus Christ.
      - pointTime: "30:14.2"
        pointText: Colossians 1:15-20 is read before the sermon.
  - chapterId: c20250720-conflict-question
    chapterTitle: Seek Truth within Conflict and Acknowledge What We Do Not Know
    chapterKind: qa
    chapterStart: "31:18.4"
    chapterEnd: "42:24.05"
    points:
      - pointTime: "35:00.12"
        pointText: Truth becoming the first casualty is applied to both large-scale war and ordinary personal conflict.
      - pointTime: "36:24.64"
        pointText: Self-interest is distinguished from professed concern for truth in international and personal decisions.
      - pointTime: "40:32.62"
        pointText: The preacher acknowledges not having a complete solution to the conflict being discussed.
      - pointTime: "41:53.9"
        pointText: Attention returns from unresolved questions toward what God's revelation makes known.
  - chapterId: c20250720-church-recap
    chapterTitle: Reform the Church without Abandoning Shared Faith
    chapterKind: sermon
    chapterStart: "42:24.05"
    chapterEnd: "46:42.25"
    chapterScripture:
      - John 5:9-18
      - Hebrews 10:25
    points:
      - pointTime: "42:24.26"
        pointText: The Sabbath-healing recap examines how mistaken readings and misplaced institutional priorities can oppose God's work.
      - pointTime: "43:58.38"
        pointText: Order is valued as a tool while sincere error and hypocrisy still require examination.
      - pointTime: "45:37.26"
        pointText: Continued gathering and reform are urged rather than treating the church's imperfections as a reason to stop meeting.
  - chapterId: c20250720-scripture-devotion
    chapterTitle: God's Word Forms a Life Devoted to Christ
    chapterKind: sermon
    chapterStart: "46:42.25"
    chapterEnd: "1:01:02.3"
    chapterScripture:
      - Mark 4:26-29
      - Luke 24:27
    points:
      - pointTime: "49:29.86"
        pointText: Equipping every believer to act is contrasted with treating the congregation as consumers of a leader's services.
      - pointTime: "53:13.52"
        pointText: The minister's work is distinguished from God producing growth, directing glory away from the human worker.
      - pointTime: "54:19.3"
        pointText: Faithfulness in sowing is emphasized rather than judging oneself solely through visible impact.
      - pointTime: "59:19.22"
        pointText: Scripture is presented as the guiding source for life rather than the competing voices of the world.
      - pointTime: "1:00:05.4"
        pointText: The Bible's witness pointing toward Christ explains why receiving its authority directs a person's whole life toward him.
  - chapterId: c20250720-divine-image
    chapterTitle: Jesus Makes the Invisible God Visible
    chapterKind: sermon
    chapterStart: "1:01:02.3"
    chapterEnd: "1:09:54.6"
    chapterScripture:
      - John 5:18-20
      - Colossians 1:15-20
    points:
      - pointTime: "1:02:19.98"
        pointText: Jesus' claim is distinguished from being an admirable teacher who merely guides others toward God.
      - pointTime: "1:05:43.44"
        pointText: Colossians identifies Christ through the image of God and creation through and for him.
      - pointTime: "1:06:22.56"
        pointText: Christ's preeminence is connected with honoring him in every arena, including culture and art.
      - pointTime: "1:09:07.5"
        pointText: A saying attributed to Gordon describes Christ as God making himself intelligible to humanity.
  - chapterId: c20250720-life
    chapterTitle: Christ Gives Life for the Future and the Present
    chapterKind: sermon
    chapterStart: "1:09:54.6"
    chapterEnd: "1:14:45.4"
    chapterScripture:
      - John 5:21-26
      - John 10:10
    points:
      - pointTime: "1:09:54.86"
        pointText: Christ's declared identity includes life granted through the Father rather than merely another system of religious advice.
      - pointTime: "1:12:36.98"
        pointText: Eternal hope is held alongside life here and now rather than making present existence only an endurance test.
      - pointTime: "1:14:32.94"
        pointText: Confidence in Christ's promise challenges locating secure, full life solely in financial resources or surrounding approval.
  - chapterId: c20250720-truth
    chapterTitle: Christ's Truth Brings Judgment and Freedom from Deception
    chapterKind: sermon
    chapterStart: "1:14:45.4"
    chapterEnd: "1:19:16.9"
    chapterScripture:
      - John 5:22-27
      - John 8:32
    points:
      - pointTime: "1:14:45.64"
        pointText: Authority to judge is connected with the Son of Man's knowledge of human life and its truth.
      - pointTime: "1:16:13.7"
        pointText: Truth's freedom extends beyond sin to the mistaken assumptions and deceptions that bind present life.
      - pointTime: "1:17:56.58"
        pointText: The casino illustration questions counting visible prosperity without considering the costs borne by other people.
  - chapterId: c20250720-way
    chapterTitle: Hearing Christ Calls for a Choice between Life and Judgment
    chapterKind: sermon
    chapterStart: "1:19:16.9"
    chapterEnd: "1:28:41.5"
    chapterScripture:
      - John 5:23-29
    points:
      - pointTime: "1:19:41.34"
        pointText: Hearing and believing Christ is connected with passing from death to life.
      - pointTime: "1:21:22.84"
        pointText: The resurrection distinction is explained through response to God's definition of good rather than earning life by accumulating deeds.
      - pointTime: "1:24:03.64"
        pointText: Congregational life is distinguished from a customer-provider transaction and directed toward serving the Lord.
      - pointTime: "1:26:32.66"
        pointText: Lewis's argument challenges placing Christ's divine claims alongside the category of an ordinary moral teacher.
      - pointTime: "1:28:13.2"
        pointText: The final appeal asks whether life will be devoted to Christ or remain governed by one's own understanding.
  - chapterId: c20250720-response
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:28:41.5"
    chapterEnd: "1:43:29.341"
    chapterScripture:
      - Romans 16:25-27
    points:
      - pointTime: "1:28:41.7"
        pointText: Response prayer asks for faith in the revealed Christ despite unanswered questions and conflicting human voices.
      - pointTime: "1:30:28.18"
        pointText: The congregation recites the Apostles' Creed before pastoral prayer.
      - pointTime: "1:34:23.16"
        pointText: Prayer links perseverance with becoming a practical channel of blessing rather than relying only on personal strength.
      - pointTime: "1:35:05.64"
        pointText: The offertory follows pastoral prayer, with giving instructions for the congregation.
      - pointTime: "1:36:28.56"
        pointText: How Great Thou Art is introduced as the closing hymn.
      - pointTime: "1:39:25.54"
        pointText: Doxology is followed by the benediction from Romans 16:25-27.
      - pointTime: "1:40:47.16"
        pointText: Announcements address the orphanage situation and other ministry opportunities.
      - pointTime: "1:43:23.48"
        pointText: The congregation is dismissed with silent meditation after the notices.
