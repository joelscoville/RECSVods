recordingTitle: Invisible Made Visible
serviceDate: 2025-07-20
status: draft
sermonDescription: Jesus' self-revelation in John 5 is read with Colossians' image of the invisible God. The preacher connects Scripture with Christ's divine identity and preeminence, then follows the themes of life, truth and the way. Life includes present fullness and eternal hope; truth brings freedom and judgment; hearing Christ directs response toward life. Faced with human conflict and unresolved questions, believers are called beyond consumer expectations toward humble obedience and service.
sermonScripture:
  - John 5:18-29
  - Colossians 1:15-20
  - Hebrews 4:15
sermonTopics:
  - knowing-god
  - eternal-life
  - truth
uploads:
  - youtubeId: NhG9qG2js8Q
    uploadDuration: "1:43:29.341"
