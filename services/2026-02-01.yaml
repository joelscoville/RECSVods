  - chapterId: c20260201-sheepfold-context
    chapterTitle: Read the Sheepfold Picture in Its Context
    chapterKind: sermon
    chapterStart: "1:12:45.15"
    chapterEnd: "1:29:49.65"
    chapterScripture:
      - John 9:39-41
      - John 10:1-6
    points:
      - pointTime: "1:12:45.15"
        pointText: John 10 is linked with the same confrontation that ended John 9.
      - pointTime: "1:17:38.81"
        pointText: False religious appearances are considered as something Scripture already anticipates.
      - pointTime: "1:19:22.21"
        pointText: A sheepfold shared by several shepherds explains the gatekeeper and recognition of each voice.
      - pointTime: "1:22:49.17"
        pointText: The word picture is distinguished from a constructed parable and from condemning everyone of another faith.
      - pointTime: "1:26:12.17"
        pointText: Respect for other people's religious freedom is held alongside the claim of complete access through Christ.
  - chapterId: c20260201-called-by-name
    chapterTitle: The Shepherd Knows and Calls His People by Name
    chapterKind: sermon
    chapterStart: "1:29:49.65"
    chapterEnd: "1:39:53.1"
    chapterScripture:
      - John 10:3-6
      - Ephesians 1:6
      - Isaiah 49:16
      - 1 John 3:1
    points:
      - pointTime: "1:29:49.65"
        pointText: The shepherd calling his own by name introduces the value of personal identity.
      - pointTime: "1:31:22.63"
        pointText: Naming is connected with being known as a person rather than remaining anonymous.
      - pointTime: "1:33:07.41"
        pointText: God's beloved is presented as an identity deeper than worldly achievement or insecurity.
      - pointTime: "1:34:48.35"
        pointText: Scriptural images of God knowing his children are contrasted with seeking one's name on earthly honors.
      - pointTime: "1:36:29.45"
        pointText: Recognizing and following Christ's voice is contrasted with a relationship based on what one gets from church.
  - chapterId: c20260201-only-door
    chapterTitle: Christ's Door Is Exclusive and Open to Anyone
    chapterKind: sermon
    chapterStart: "1:39:53.1"
    chapterEnd: "1:47:07.15"
    chapterScripture:
      - John 10:7-10
    points:
      - pointTime: "1:39:53.29"
        pointText: Jesus' door declaration is read against the leaders' claim to control access to God.
      - pointTime: "1:41:36.53"
        pointText: John 10:9 is presented as an exclusive way with an invitation for anyone to enter.
      - pointTime: "1:43:18.43"
        pointText: Going in and out is connected with protection, nurture and pasture.
      - pointTime: "1:44:58.47"
        pointText: Lewis is cited to argue that Christ's claims require a response beyond calling him a good teacher.
      - pointTime: "1:46:38.87"
        pointText: The conclusion connects response to Christ with receiving life and abundance.
  - chapterId: c20260201-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:47:07.15"
    chapterEnd: "2:04:40.517"
    points:
      - pointTime: "1:47:07.47"
        pointText: Prayer asks for appreciation of being known by God and following the shepherd rather than living transactionally.
      - pointTime: "1:52:19.35"
        pointText: Intercession asks for wisdom and direction for church planting beyond the present congregation.
      - pointTime: "1:54:48.39"
        pointText: The first-Sunday second offering is designated for evangelism.
      - pointTime: "1:56:18.49"
        pointText: Saviour, Like a Shepherd Lead Us is introduced before the closing hymn.
      - pointTime: "1:59:22.71"
        pointText: Historical notices invite practical ministry, orphanage fundraising, guitar classes and elderly outreach.
