status: draft
sermonDescription: Beginning John 10, the preacher places the sheepfold illustration in continuity with Jesus' confrontation with the religious leaders after healing the blind man. Christ's claim to be the door is presented as exclusive access with a universal invitation. The shepherd knowing and calling his sheep by name grounds identity as God's beloved, urging personal relationship rather than a transactional approach to worship or a search for agreeable advice.
