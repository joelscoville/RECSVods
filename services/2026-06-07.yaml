  - chapterId: c20260607-love-marks-christs-followers
    chapterTitle: Love Marks Christ's Followers
    chapterKind: sermon
    chapterStart: "34:52.98"
    chapterEnd: "48:01"
    points:
      - pointTime: "34:52.98"
        pointText: Introducing the question of Christian exclusivity, the pastor recaps glory, childlike
          worship and Jesus' command to love beyond social boundaries, presenting shared life rather
          than isolation as the mark of belonging to Christ.
      - pointTime: "36:18"
        pointText: Jesus' glory is considered in relation to coming suffering and a life aligned with God's will.
      - pointTime: "39:22.84"
        pointText: Childlikeness is distinguished from childishness through humility and wonder in worship.
      - pointTime: "42:34.28"
        pointText: The new commandment contrasts identity marked by love with ethnicity and nationality.
      - pointTime: "46:58.64"
        pointText: Loving one another is presented as a command rather than an option.
