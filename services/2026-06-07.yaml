  - chapterId: c20260607-trust-christ-amid-trouble
    chapterTitle: Trust Christ Amid Trouble
    chapterKind: sermon
    chapterStart: "48:01"
    chapterEnd: "1:07:04.74"
    points:
      - pointTime: "48:01"
        pointText: The pastor relates the disciples' uncertainty to human suffering, contrasts his account
          of Buddhist self-effort with trust in Christ, and reads John 14 as promising both a
          lasting home with the Father and the Spirit's sustaining presence now.
    subchapters:
      - chapterId: s20260607-sermon-hope
