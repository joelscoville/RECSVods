  - chapterId: c20260607-trust-christ-amid-trouble
    chapterTitle: Trust Christ Amid Trouble
    chapterKind: sermon
    chapterStart: "48:01"
    chapterEnd: "1:07:04.74"
    points:
      - pointTime: "48:01"
        pointText: The pastor relates the disciples' uncertainty to human suffering, contrasts his account
          of Buddhist self-effort with trust in Christ, and reads John 14 as promising both a
          lasting home with the Father and the Spirit's sustaining presence now.
      - pointTime: "50:19.98"
        pointText: The disciples' expectation of triumph is contrasted with readers who know the outcome.
      - pointTime: "53:01.72"
        pointText: The preacher's account of Buddhist suffering categories begins a comparison with trust in Christ.
      - pointTime: "58:59.72"
        pointText: John 14:1 directs troubled disciples toward trust in God and Jesus.
      - pointTime: "1:06:07.8"
        pointText: The Spirit's sustaining presence provides help now as well as future hope.
    subchapters:
