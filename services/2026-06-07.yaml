sermonDescription: Rev. Yong Teck Meng argues from John 14 and Acts 4 that Christ is the only way to
  the Father, grounding faith in God's revelation rather than human self-sufficiency. He presents
  Christ's presence as comfort for troubled people and urges believers to express conviction through
  love, continuing evangelism while leaving individuals' final destiny to God rather than claiming
  to know whom Christ may save.
