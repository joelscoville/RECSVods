  - chapterId: c20260607-christ-only-way-to-father
    chapterTitle: Christ Is the Only Way to the Father
    chapterKind: sermon
    chapterStart: "1:07:04.74"
    chapterEnd: "1:21:47.9"
    points:
      - pointTime: "1:07:04.74"
        pointText: Addressing objections and religious inclusivity, the pastor argues from John 14 and Acts
          4 that salvation depends on God's revelation in Christ rather than human self-sufficiency,
          while allowing some knowledge through general grace.
      - pointTime: "1:09:22.54"
        pointText: The exclusive clause in John 14:6 is identified as the most difficult claim for hearers.
      - pointTime: "1:13:15.38"
        pointText: The preacher contrasts his account of Baha'i religious inclusivity with Christian exclusivity.
      - pointTime: "1:14:23.46"
        pointText: God revealing truth is distinguished from people finding salvation through self-help.
      - pointTime: "1:18:21.92"
        pointText: An air-for-life analogy is used to argue that a necessity claim is not merely arrogance.
    chapterScripture:
      - John 14:4-6
      - John 14:6
      - John 14:6-7
      - Acts 4:8-12
  - chapterId: c20260607-loving-witness-without-judgment
    chapterTitle: Share Christ's Love and Leave Judgment to God
    chapterKind: sermon
    chapterStart: "1:21:47.9"
    chapterEnd: "1:36:01.7"
    points:
      - pointTime: "1:21:47.9"
        pointText: Affirming Christ as the only way, the pastor urges loving evangelism and help regardless
          of conversion, leaves individuals' salvation to God and allows possible exceptions to the
          usual model, explicitly treating his imagined deathbed encounter as unsupported by
          scripture rather than a method to preach.
      - pointTime: "1:24:36.2"
        pointText: Questions about loved ones challenge evangelism motivated by superiority and certainty about others' final destiny.
      - pointTime: "1:26:54.84"
        pointText: The pastor says he does not know his grandmother's final destiny and trusts God's just judgment.
      - pointTime: "1:29:34.12"
        pointText: Lewis is cited to distinguish salvation through Christ from knowing the full limits of whom Christ may save.
      - pointTime: "1:34:46"
        pointText: Listeners are urged to continue evangelism and treat nonbelievers with love rather than unkindness.
    chapterScripture:
      - John 14:6
      - Philippians 2:9-11
  - chapterId: c20260607-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:36:01.7"
    chapterEnd: "1:49:50.661"
    points:
      - pointTime: "1:36:01.78"
        pointText: The pastor leads prayer for patient, loving witness, with the Apostles' Creed, an
          evangelism offering, All the Way My Saviour Leads Me, doxology, a blessing from Jude and
          community notices completing the service.
      - pointTime: "1:37:31.02"
        pointText: The congregation stands to recite the Apostles' Creed.
      - pointTime: "1:40:01.2"
        pointText: Sustained prayer is encouraged for loved ones who do not know Jesus.
      - pointTime: "1:42:25.58"
        pointText: The first-Sunday second offering is designated for evangelism.
      - pointTime: "1:47:57.7"
        pointText: Historical notices announce the catechism class and invite consideration of gospel-rally participation.
    chapterScripture:
      - Jude 1:24-25
