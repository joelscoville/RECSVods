  - chapterId: c20260607-love-marks-christs-followers
    chapterTitle: Love Marks Christ's Followers
    chapterKind: sermon
    chapterStart: "34:52.98"
    chapterEnd: "48:01"
    points:
      - pointTime: "34:52.98"
        pointText: Introducing the question of Christian exclusivity, the pastor recaps glory, childlike
          worship and Jesus' command to love beyond social boundaries, presenting shared life rather
          than isolation as the mark of belonging to Christ.
