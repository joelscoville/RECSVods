  - chapterId: c20260607-christ-only-way-to-father
    chapterTitle: Christ Is the Only Way to the Father
    chapterKind: sermon
    chapterStart: "1:07:04.74"
    chapterEnd: "1:21:50.88"
    points:
      - pointTime: "1:07:04.74"
        pointText: Addressing objections and religious inclusivity, the pastor argues from John 14 and Acts
          4 that salvation depends on God's revelation in Christ rather than human self-sufficiency,
          while allowing some knowledge through general grace.
    chapterScripture:
      - John 14:4-6
      - John 14:6
      - John 14:6-7
      - Acts 4:8-12
  - chapterId: c20260607-loving-witness-without-judgment
    chapterTitle: Share Christ's Love and Leave Judgment to God
    chapterKind: sermon
    chapterStart: "1:21:50.88"
    chapterEnd: "1:36:02.32"
    points:
      - pointTime: "1:21:50.88"
        pointText: Affirming Christ as the only way, the pastor urges loving evangelism and help regardless
          of conversion, leaves individuals' salvation to God and allows possible exceptions to the
          usual model, explicitly treating his imagined deathbed encounter as unsupported by
          scripture rather than a method to preach.
    chapterScripture:
      - John 14:6
      - Philippians 2:9-11
  - chapterId: c20260607-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:36:02.32"
    chapterEnd: "1:49:50.661"
    points:
      - pointTime: "1:36:02.32"
        pointText: The pastor leads prayer for patient, loving witness, with the Apostles' Creed, an
          evangelism offering, All the Way My Saviour Leads Me, doxology, a blessing from Jude and
          community notices completing the service.
    chapterScripture:
      - Jude 1:24-25
