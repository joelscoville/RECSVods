recordingTitle: Flesh Eating
serviceDate: 2025-08-31
status: draft
sermonDescription: Jesus' promise of living bread challenges a human-centered, transactional approach to religion. The preacher contrasts consumer expectations with God's initiative in drawing people to Christ and sustaining an eternal community. Romans 12 connects that life with renewed understanding rather than conformity to the fallen world. Eating Christ's flesh and drinking his blood is read as believing his sacrifice and continuing in full commitment, not adding a religious label or occasional contribution to an otherwise unchanged life.
