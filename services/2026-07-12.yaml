recordingTitle: To Be Nothing
serviceDate: 2026-07-12
status: draft
sermonDescription: Pastor Yong reads John 15 as a call to find life's meaning in Christ and God's
  goodness rather than achievement or wealth. The Father's care invites confidence, shared
  dependence and fruitfulness through pruning, not guaranteed prosperity or freedom from suffering.
  Contrasting lavish possessions with small acts of service, he argues that lasting value comes from
  alignment with God's truth and goodness, expressed in love, obedience and joy.
sermonScripture:
  - John 15:5
  - John 15
  - John 15:1
sermonTopics:
  - discipleship
  - service
  - faith
