    points:
      - pointTime: "57:00.52"
        pointText: Pastor Yong connects the Father's active care with confidence, mutual dependence and
          abiding through pruning, interpreting removed branches and spiritual fruit without
          promising prosperity or constant happiness.
      - pointTime: "59:02.1"
        pointText: Psalms 121 connects confidence in God with the Father's active care.
      - pointTime: "1:02:14.02"
