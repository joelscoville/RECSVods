recordingTitle: The Law & The Righteousness
serviceDate: 2025-01-12
status: draft
sermonDescription: >-
  Pastor Adrian reads Christ's fulfillment of the law as an invitation to receive God's righteousness through the whole Bible. Moral, civil and ceremonial laws are considered through their purpose and fulfillment in Jesus rather than discarded as irrelevant. Grace brings a changed heart that desires righteousness, not freedom to abandon it. The message challenges both rejection of God's law and a merely measurable, outward obedience, calling believers to meditate, examine themselves and live its spirit with humility.
sermonScripture:
  - Matthew 5:17-20
  - Romans 6:5-14
  - Exodus 22:1
sermonTopics:
  - authority
  - discipleship
  - sanctification
