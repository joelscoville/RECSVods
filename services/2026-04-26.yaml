    chapterEnd: "1:03:16.9"
    chapterScripture:
      - John 12:20-24
      - Acts 10
    points:
      - pointTime: "42:51.32"
        pointText: The Greeks seeking Jesus introduce the gospel reaching beyond the Jewish community.
      - pointTime: "44:47.42"
        pointText: Cornelius illustrates Gentiles who feared God before this wider mission unfolded.
      - pointTime: "48:20.28"
        pointText: Jesus' announcement that the hour has come is explained through God's timing.
      - pointTime: "52:14.78"
        pointText: Glorification includes suffering and crucifixion as well as resurrection and ascension.
      - pointTime: "54:58.38"
