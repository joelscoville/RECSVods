          - pointTime: "1:17:11.34"
            pointText: Good things in life are affirmed as part of God's design.
          - pointTime: "1:20:00.92"
            pointText: John 10:10 contrasts destructive life with the abundant life Christ gives.
          - pointTime: "1:20:35.88"
            pointText: Marriage and moderation illustrate enjoying gifts within God's intended boundaries.
          - pointTime: "1:24:16.84"
            pointText: A personal recollection connects rejection of exploitation with compassion for vulnerable women.
