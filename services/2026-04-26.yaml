sermonDescription: The preacher follows the Greeks seeking Jesus in John 12 into Christ's announcement of glory through death and fruitful sacrifice. He challenges treating sacrificial service as the work of specially gifted leaders alone. Distinguishing the fallen world from the life God redeems, he urges every believer to follow Christ, enjoy God's gifts within his design and live beyond self and family through renewed priorities and practical service.
