    chapterEnd: "33:04.36"
    chapterScripture:
      - Romans 11:25-27
    points:
      - pointTime: "27:26.44"
        pointText: A submitted question connects Romans 11 with current claims about Israel.
      - pointTime: "28:12.5"
        pointText: The passage's partial hardening and the fullness of the Gentiles are read together.
      - pointTime: "29:19.08"
        pointText: Automatic political support or salvation based on race is questioned.
      - pointTime: "30:59.9"
        pointText: Repentance is considered as one explanation of the phrase all Israel.
      - pointTime: "32:12.82"
        pointText: The preacher states his preference for understanding Israel spiritually as those belonging to Christ.
  - chapterId: c20260426-recap-peace
    chapterTitle: God's Way Differs from Worldly Power
    chapterKind: sermon
    chapterStart: "33:04.36"
    chapterEnd: "42:51"
    chapterScripture:
      - John 12:12-19
      - Zechariah 9:9
      - Isaiah 9:6
    points:
      - pointTime: "33:04.36"
        pointText: The triumphal entry is reviewed through the crowd's expectations and Jesus' humble arrival.
      - pointTime: "36:07.46"
        pointText: Love and peace are presented as God's nature rather than a tactical choice.
      - pointTime: "37:48.14"
        pointText: Redeemed community requires accommodation and forgiveness rather than isolation.
      - pointTime: "39:34.16"
        pointText: Just-war reasoning is distinguished from allowing evil to prosper.
      - pointTime: "41:16.84"
        pointText: A bias toward gentleness is urged while awaiting Christ's final peace.
