  - chapterId: c20260426-every-believer
    chapterTitle: Every Believer Is Called to Follow Christ
    chapterKind: sermon
    chapterStart: "1:03:16.9"
    chapterEnd: "1:31:24.76"
    chapterScripture:
      - John 12:25-26
      - John 10:10
      - Romans 12:1-2
