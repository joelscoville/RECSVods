      - pointTime: "1:03:17.22"
        pointText: Sacrifice is not limited to Jesus, apostles or an unusually gifted class of people.
      - pointTime: "1:08:33.16"
        pointText: Francis Chan's critique of sermon-centered church life introduces participation by every believer.
      - pointTime: "1:11:59.64"
        pointText: Whoever is read as a universal call rather than permission for passive spectatorship.
      - pointTime: "1:25:41.54"
        pointText: Serving Christ means following and obeying him, with honor from the Father.
      - pointTime: "1:29:03.4"
        pointText: Romans 12 connects living sacrifice with renewed minds and a cause larger than self and family.
    subchapters:
