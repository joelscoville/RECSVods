recordingTitle: "Stand Firm: Ready to Defend"
serviceDate: 2025-06-15
status: draft
sermonDescription: Brother Patrick considers whether Jonah should be read as history or fiction, calling Christians to defend their hope with gentleness and respect. He examines literary objections, distinguishes biblical scholarship from personal faith and grounds his answer in Scripture, God's power and Jesus' reference to Jonah. The message moves from defending biblical truth to living its implications through obedience, repentance and compassion for people believers may wrongly regard as beyond God's grace.
