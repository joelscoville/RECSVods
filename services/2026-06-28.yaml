recordingTitle: Teaching Us All Things…
serviceDate: 2026-06-28
status: draft
sermonDescription: In John 14, the preacher presents the Holy Spirit as the Helper who directs
  believers toward truth and Christ’s peace. He challenges treating faith as material gain or truth
  as a matter of convenience, urging humble engagement with scripture and a changed way of living.
  Reflecting on persecution and prayer, he argues that Christ’s peace reaches beyond the security
  wealth can offer.
sermonScripture:
  - John 14:26
  - John 14:15-24
  - 2 Timothy 3:16-17
sermonTopics:
  - holy-spirit
  - truth
  - prayer
