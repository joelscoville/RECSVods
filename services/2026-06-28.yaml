        chapterTitle: Forgiveness Leaves Continuing Responsibilities
        chapterKind: sermon
        chapterStart: "37:34.42"
        chapterEnd: "42:54.62"
        points:
          - pointTime: "37:34.42"
            pointText: The preacher’s seed-to-tree illustration and account of supporting single mothers
              distinguish forgiveness from entrenched habits, recovery and ongoing responsibility.
    chapterScripture:
      - John 14:25-31
      - John 13
      - Matthew 5
  - chapterId: c20260628-live-by-truth
    chapterTitle: God’s Truth Must Shape How We Live
    chapterKind: sermon
    chapterStart: "42:54.62"
    chapterEnd: "1:07:02.86"
    points:
      - pointTime: "42:54.62"
        pointText: Linking restoration and the Spirit of truth, the preacher contrasts evidence and
          subjective judgments with pragmatism and self-justification, arguing that God’s truth
          should govern life even under pressure.
    subchapters:
      - chapterId: s0628-objective
