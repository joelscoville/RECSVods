  - chapterId: c20260628-repentance-consequences
    chapterTitle: "Q&A: Forgiveness Does Not Erase Consequences"
    chapterKind: qa
    chapterStart: "28:35.62"
    chapterEnd: "42:55.18"
    points:
      - pointTime: "28:35.62"
        pointText: Following his greeting and question invitation, the preacher contrasts Peter and Judas,
          challenges transactional views of sin and urges repentance while distinguishing
          forgiveness from recovery and continuing responsibilities.
      - pointTime: "30:19.58"
        pointText: A question comparing Peter and Judas introduces repentance and forgiveness.
      - pointTime: "33:41.68"
        pointText: Matthew 5 and a speck-in-the-eye illustration explain why even a small sin matters.
      - pointTime: "35:59.96"
        pointText: Cynicism after a leader's failure is challenged while consequences of wrongdoing are distinguished.
      - pointTime: "41:54.72"
        pointText: Universal sinfulness is not a license; wisdom recognizes consequences early.
    subchapters:
      - chapterId: s0628-consequences
        chapterTitle: Forgiveness Leaves Continuing Responsibilities
        chapterKind: sermon
        chapterStart: "37:34.42"
        chapterEnd: "42:55.18"
        points:
          - pointTime: "37:34.42"
            pointText: The preacher’s seed-to-tree illustration and account of supporting single mothers
              distinguish forgiveness from entrenched habits, recovery and ongoing responsibility.
          - pointTime: "38:18.54"
            pointText: A plant taking root illustrates habits that become harder to leave behind.
          - pointTime: "39:05.02"
            pointText: Forgiveness does not necessarily remove difficulties left by past wrongdoing.
          - pointTime: "40:50.64"
            pointText: Supporting single mothers illustrates continuing practical and emotional responsibilities.
          - pointTime: "41:54.72"
            pointText: Understanding consequences early is presented as wisdom rather than permission to sin.
