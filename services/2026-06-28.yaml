  - chapterId: c20260628-live-by-truth
    chapterTitle: God’s Truth Must Shape How We Live
    chapterKind: sermon
    chapterStart: "42:55.18"
    chapterEnd: "1:07:02.86"
    points:
      - pointTime: "42:55.18"
        pointText: Linking restoration and the Spirit of truth, the preacher contrasts evidence and
          subjective judgments with pragmatism and self-justification, arguing that God’s truth
          should govern life even under pressure.
      - pointTime: "44:56.64"
        pointText: Sanctification is illustrated through growth toward Christ in everyday marital conflict.
      - pointTime: "51:50.98"
        pointText: Repeatable measurements introduce objective truth.
      - pointTime: "59:12.82"
        pointText: A thief-and-bell idiom challenges self-justification that ignores reality.
      - pointTime: "1:04:56.84"
        pointText: A quotation attributed to Jan Hus urges commitment to truth under persecution.
    subchapters:
      - chapterId: s0628-objective
        chapterTitle: Objective Claims Depend on Repeatable Evidence
        chapterKind: sermon
        chapterStart: "51:50.98"
        chapterEnd: "55:30.86"
        points:
          - pointTime: "51:50.98"
            pointText: The preacher uses a hypercar’s performance and price claims, with traffic-light humor, to
              illustrate repeatable evidence rather than independently verified figures.
          - pointTime: "52:51.6"
            pointText: Acceleration and price figures illustrate measurable claims.
          - pointTime: "53:51.62"
            pointText: Expensive cars still encounter ordinary traffic delays, prompting a question about better uses of money.
          - pointTime: "54:49.28"
            pointText: Repeated demonstrations are contrasted with judgments that depend on personal feeling.
      - chapterId: s0628-absolute
        chapterTitle: All Truth Belongs to God
        chapterKind: sermon
        chapterStart: "1:00:44.34"
        chapterEnd: "1:02:51.42"
        points:
          - pointTime: "1:00:44.34"
            pointText: The preacher connects scripture and the Spirit’s teaching with unchanging truth,
              introducing a statement he attributes to Augustine.
          - pointTime: "1:02:06.72"
            pointText: The preacher attributes to Augustine the view that every genuinely true claim belongs to God's truth.
        chapterScripture:
          - 2 Timothy 3:16-17
          - John 14:26
