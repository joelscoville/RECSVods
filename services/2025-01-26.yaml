recordingTitle: The Word
serviceDate: 2025-01-26
status: draft
sermonDescription: >-
  John's Logos is explored beyond the everyday English sense of a word. The preacher draws three implications: God exceeds human comprehension, reaches out personally and makes himself known in Christ. Humility and childlike wonder open a lifelong exploration rather than a claim to have mastered God. The Word's action challenges a detached-watchmaker view of creation, while Christ's divine identity directs listeners beyond treating him merely as an admirable teacher toward trusting and enjoying the God he reveals.
sermonScripture:
  - John 1:1-2
  - Colossians 1:15-20
sermonTopics:
  - knowing-god
  - faith
  - joy
