recordingTitle: RECS 15 February 2026
serviceDate: 2026-02-15
status: draft
sermonDescription: The guest preacher reads Malachi's confrontation with Israel's priests as a challenge to worship that gives God leftovers while protecting self-interest. Honoring the Father and master requires honesty, respect for his word and greater concern for him than for human approval. Christ is presented as the perfect priest, obedient Son and sufficient sacrifice, whose prior love changes worship from mere duty into a willing response.
sermonScripture:
  - Malachi 1:6-8
  - Leviticus 22:21
  - Luke 12:4-5
sermonTopics:
  - worship
  - repentance
  - sacrifice
