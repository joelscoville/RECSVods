      - Romans 13:3-4
  - chapterId: c20260809-discern-fallible-leaders
    chapterTitle: Discern Authority Without Idealizing Leaders
    chapterKind: sermon
    chapterStart: "1:14:02.94"
    chapterEnd: "1:20:51.94"
    points:
      - pointTime: "1:14:02.94"
        pointText: The preacher urges caution about both resisting governments and trusting fallible
          politicians or pastors, drawing on attributed historical accounts and personal activism
          while grounding faith in Christ rather than human leaders.
      - pointTime: "1:15:13.2"
        pointText: The preacher presents Sun Yat-sen and Bonhoeffer as examples of Christians who judged that government should be resisted.
      - pointTime: "1:16:24.36"
        pointText: Bonhoeffer's suffering leads back to caution about believing oneself called to overthrow a government.
      - pointTime: "1:17:23.2"
        pointText: Political institutions require healthy skepticism because they are run by fallible people.
      - pointTime: "1:20:15.82"
        pointText: Faith grounded in Christ should survive a pastor's or politician's failure.
  - chapterId: c20260809-civic-fairness
    chapterTitle: Citizenship Requires Fairness to Others
    chapterKind: sermon
    chapterStart: "1:20:52.66"
    chapterEnd: "1:29:22.42"
    points:
      - pointTime: "1:20:52.66"
        pointText: The preacher rejects religious exemptions from taxes and civic duties, weighs migrant
          compassion against public costs and consent, distinguishes objections to undocumented
          entry from opposition to immigration, and recalls sensitive refugee-policy stories with
          uncertain dates and numbers.
      - pointTime: "1:22:15.32"
        pointText: Public services maintained by people of many beliefs challenge religious exemptions from civic duties.
      - pointTime: "1:23:46.6"
        pointText: Compassion for migrants is weighed alongside borders, costs and fellow citizens' consent.
      - pointTime: "1:25:21.32"
        pointText: The preacher recalls Vietnamese refugees reaching Singapore while acknowledging uncertain dates and numbers.
      - pointTime: "1:28:56.66"
        pointText: The argument returns to God's highest authority, human fallibility and living fairly.
    subchapters:
      - chapterId: s20260809-refugees
        chapterTitle: Vietnamese Refugees and Civic Responsibility
        chapterKind: sermon
        chapterStart: "1:25:21.32"
        chapterEnd: "1:29:22.42"
        points:
          - pointTime: "1:25:21.32"
            pointText: Acknowledging uncertain dates and numbers, the preacher recalls disputed refugee landing
              restrictions and traumatic enforcement stories before connecting chosen citizenship
              with authority, fallibility and fairness.
          - pointTime: "1:26:40.28"
            pointText: The preacher recounts disputed landing restrictions and objections from church and charity leaders.
          - pointTime: "1:27:49.3"
            pointText: Sensitive enforcement stories introduce citizenship as conviction and choice.
          - pointTime: "1:28:56.66"
            pointText: The preacher recaps authority, fallibility and fairness before calling for active contribution.
