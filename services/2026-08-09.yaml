  - chapterId: c20260809-national-allegiance
    chapterTitle: National Allegiance Requires Discernment
    chapterKind: sermon
    chapterStart: "35:04.7"
    chapterEnd: "58:31.48"
    points:
      - pointTime: "35:04.7"
        pointText: The preacher uses cultural Christianity, national symbolism, migration and changing
          loyalties to question assumptions about Christian power and national belonging,
          acknowledging uncertainty about who belongs to God's kingdom and the complexity of
          immigration.
      - pointTime: "37:29.2"
        pointText: Cultural Christian identity is distinguished from belief, without claiming knowledge of who belongs to God's kingdom.
      - pointTime: "40:42.2"
        pointText: Christianity and nationalism are considered through examples of religion becoming entangled with power.
      - pointTime: "51:14.86"
        pointText: A radio discussion introduces the difficult questions of repatriation and unaccompanied young migrants.
      - pointTime: "57:08.06"
        pointText: The congregation's diverse backgrounds and popular loyalties challenge simple ideas of national identity.
    subchapters:
      - chapterId: s20260809-nationalism
        chapterTitle: Nationalism Entangles Faith and Power
        chapterKind: sermon
        chapterStart: "40:42.2"
        chapterEnd: "47:40.62"
        points:
          - pointTime: "40:42.2"
            pointText: The preacher recalls religious and political ceremony in Britain, America and Singapore
              while warning against movements linking Christian faith, patriotism and racial
              supremacy.
          - pointTime: "42:07.98"
            pointText: A British coronation illustrates continuing links between religious office and monarchy.
          - pointTime: "43:51.76"
            pointText: The preacher recalls flags, patriotic hymns and military commemorations in American churches.
          - pointTime: "46:01.8"
            pointText: Political speakers in worship are questioned through a recollection from a former church.
          - pointTime: "47:02.12"
            pointText: The preacher warns against linking Christian faith, patriotism and racial supremacy.
      - chapterId: s20260809-immigration
        chapterTitle: Immigration Tests Law and Compassion
        chapterKind: sermon
        chapterStart: "47:40.74"
        chapterEnd: "55:54.44"
        points:
          - pointTime: "47:40.74"
            pointText: Through his accounts of border enforcement, economic consequences, child migration and
              church responses, the preacher acknowledges competing appeals to law and compassion
              rather than presenting immigration as simple.
          - pointTime: "48:43.3"
            pointText: Food prices illustrate the economic consequences of action against undocumented workers.
          - pointTime: "49:34.22"
            pointText: Migration toward a Spanish enclave is discussed as an attempt to escape poverty.
          - pointTime: "51:14.86"
            pointText: The welfare of children complicates questions about repatriation.
          - pointTime: "54:56.58"
            pointText: A pastor friend's migrant assistance illustrates why appeals to compassion resonate.
    chapterScripture:
      - Matthew 7
  - chapterId: c20260809-god-above-government
    chapterTitle: God's Authority Stands Above Human Government
    chapterKind: sermon
    chapterStart: "58:31.66"
    chapterEnd: "1:14:02.26"
    points:
      - pointTime: "58:31.66"
        pointText: The preacher argues from 1 Samuel 8 and Romans 13 that no human system is God's ultimate
          solution, that allegiance to God limits civil authority, and that governments can
          nevertheless serve the public good.
      - pointTime: "1:01:37.08"
        pointText: Israel's request for a king in 1 Samuel 8 is interpreted as rejection of divine rule.
      - pointTime: "1:05:35.62"
        pointText: A saying attributed to Gandhi is considered through belief in God's highest authority.
      - pointTime: "1:07:54.8"
        pointText: Romans 13 is read as placing God above government rather than making secular authority absolute.
      - pointTime: "1:12:04.54"
        pointText: Disaster relief in Aceh and Chengdu challenges the preacher's assumptions about civil authorities.
    subchapters:
      - chapterId: s20260809-highest-authority
        chapterTitle: Allegiance to God Comes First
        chapterKind: sermon
        chapterStart: "1:06:42.32"
        chapterEnd: "1:11:01.16"
        points:
          - pointTime: "1:06:42.32"
            pointText: Reading Romans 13 alongside the Westminster Confession, the preacher places allegiance to
              God above national and family identities while calling for obedience to laws aligned
              with God's goodness and justice.
          - pointTime: "1:07:54.8"
            pointText: The preacher argues that Romans 13 places God's authority above every other authority.
          - pointTime: "1:08:57.76"
            pointText: Allegiance to God is primary, while nationality and family roles are secondary identities.
          - pointTime: "1:10:15.1"
            pointText: Christians are called to obey laws aligned with God's goodness and justice.
        chapterScripture:
          - Romans 13:1
          - Romans 13:1-2
    chapterScripture:
