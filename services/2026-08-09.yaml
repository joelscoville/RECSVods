    points:
      - pointTime: "10:23.6"
        pointText: The leaders and congregation share hymns, prayers, a video anthem and readings from
          Psalms 93, Proverbs 2, Romans 13 and 1 Peter 2, including encouragement to endure through
          singing or silence during the partly restricted Night Song interval.
    chapterScripture:
      - Psalms 93
      - Proverbs 2
      - Romans 13:1-14
      - 1 Peter 2:13-17
  - chapterId: c20260809-national-allegiance
    chapterTitle: National Allegiance Requires Discernment
    chapterKind: sermon
    chapterStart: "35:04.7"
    chapterEnd: "58:31.48"
    points:
      - pointTime: "35:04.7"
        pointText: The preacher uses cultural Christianity, national symbolism, migration and changing
          loyalties to question assumptions about Christian power and national belonging,
          acknowledging uncertainty about who belongs to God's kingdom and the complexity of
          immigration.
    subchapters:
      - chapterId: s20260809-nationalism
        chapterTitle: Nationalism Entangles Faith and Power
        chapterKind: sermon
        chapterStart: "40:42.2"
        chapterEnd: "47:40.62"
        points:
          - pointTime: "40:42.2"
            pointText: The preacher recalls religious and political ceremony in Britain, America and Singapore
              while warning against movements linking Christian faith, patriotism and racial
              supremacy.
      - chapterId: s20260809-immigration
        chapterTitle: Immigration Tests Law and Compassion
        chapterKind: sermon
        chapterStart: "47:40.74"
        chapterEnd: "55:54.44"
        points:
          - pointTime: "47:40.74"
            pointText: Through his accounts of border enforcement, economic consequences, child migration and
              church responses, the preacher acknowledges competing appeals to law and compassion
              rather than presenting immigration as simple.
    chapterScripture:
      - Matthew 7
  - chapterId: c20260809-god-above-government
    chapterTitle: God's Authority Stands Above Human Government
    chapterKind: sermon
    chapterStart: "58:31.66"
    chapterEnd: "1:14:02.26"
    points:
      - pointTime: "58:31.66"
        pointText: The preacher argues from 1 Samuel 8 and Romans 13 that no human system is God's ultimate
          solution, that allegiance to God limits civil authority, and that governments can
          nevertheless serve the public good.
    subchapters:
      - chapterId: s20260809-highest-authority
        chapterTitle: Allegiance to God Comes First
        chapterKind: sermon
        chapterStart: "1:06:42.32"
        chapterEnd: "1:11:01.16"
        points:
          - pointTime: "1:06:42.32"
            pointText: Reading Romans 13 alongside the Westminster Confession, the preacher places allegiance to
              God above national and family identities while calling for obedience to laws aligned
              with God's goodness and justice.
        chapterScripture:
          - Romans 13:1
          - Romans 13:1-2
    chapterScripture:
      - 1 Samuel 8
      - Romans 13:1
      - Romans 13:1-2
      - Romans 13:3-4
  - chapterId: c20260809-discern-fallible-leaders
    chapterTitle: Discern Authority Without Idealizing Leaders
    chapterKind: sermon
    chapterStart: "1:14:02.94"
    chapterEnd: "1:20:51.94"
    points:
      - pointTime: "1:14:02.94"
        pointText: The preacher urges caution about both resisting governments and trusting fallible
          politicians or pastors, drawing on attributed historical accounts and personal activism
          while grounding faith in Christ rather than human leaders.
  - chapterId: c20260809-civic-fairness
    chapterTitle: Citizenship Requires Fairness to Others
    chapterKind: sermon
    chapterStart: "1:20:52.66"
    chapterEnd: "1:29:22.42"
    points:
      - pointTime: "1:20:52.66"
        pointText: The preacher rejects religious exemptions from taxes and civic duties, weighs migrant
          compassion against public costs and consent, distinguishes objections to undocumented
          entry from opposition to immigration, and recalls sensitive refugee-policy stories with
          uncertain dates and numbers.
    subchapters:
      - chapterId: s20260809-refugees
        chapterTitle: Vietnamese Refugees and Civic Responsibility
        chapterKind: sermon
        chapterStart: "1:25:21.32"
        chapterEnd: "1:29:22.42"
        points:
          - pointTime: "1:25:21.32"
            pointText: Acknowledging uncertain dates and numbers, the preacher recalls disputed refugee landing
              restrictions and traumatic enforcement stories before connecting chosen citizenship
              with authority, fallibility and fairness.
    chapterScripture:
      - Romans 13:5-7
  - chapterId: c20260809-contribute-to-society
    chapterTitle: Contribute to the Society Where You Live
    chapterKind: sermon
    chapterStart: "1:29:22.82"
    chapterEnd: "1:35:29.26"
    points:
      - pointTime: "1:29:22.82"
        pointText: Applying Jeremiah 29:7, the preacher calls for honest National Service, prayer for
          leaders and positive participation in one's host society, acknowledging older people's
          difficulties as he closes with National Day gratitude.
    chapterScripture:
      - Jeremiah 29:7
      - 1 Peter 2:13-17
      - Romans 13
      - 1 Timothy 2
  - chapterId: c20260809-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:35:29.54"
    chapterEnd: "1:49:24.721"
    points:
      - pointTime: "1:35:29.54"
        pointText: The preacher and congregation respond with prayer for responsible living and Singapore,
          the Apostles' Creed, an offering supporting Christian education, Tell It to Jesus,
          doxology and blessing, followed by fellowship and ministry notices and silent meditation.
    chapterScripture:
      - 1 Timothy 2
      - 1 Thessalonians 5
      - 2 Corinthians 13
