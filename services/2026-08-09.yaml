    points:
      - pointTime: "0:16.04"
        pointText: The leaders guide personal adoration, confession, thanksgiving and supplication, welcome
          the congregation on National Day and invite quiet preparation for worship.
  - chapterId: c20260809-worship-scripture
    chapterTitle: Worship and Scripture
    chapterKind: opening
    chapterStart: "10:23.6"
