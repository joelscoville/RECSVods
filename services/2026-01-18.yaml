recordingTitle: Growing in Faith through John 9
serviceDate: 2026-01-18
status: draft
sermonDescription: Jesus' healing of the man born blind challenges automatic blame for suffering and formulaic promises of healing. The preacher distinguishes confidence in God's purpose from claiming to explain another person's pain, urging compassionate presence and practical community support. The healed man's growing recognition of Jesus, together with 2 Peter's call to increasing virtue and love, encourages a faith that matures beyond dependence on crisis or comfortable routines.
sermonScripture:
  - John 9:1-17
  - 2 Peter 1:3-9
sermonTopics:
  - suffering
  - faith
  - sanctification
