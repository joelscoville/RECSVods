    points:
      - pointTime: "1:09:11.14"
        pointText: Jesus' use of mud and the pool illustrates healing through a process rather than a prescribed technique.
      - pointTime: "1:11:12.4"
        pointText: The healed man's account begins a progression in his understanding of Jesus.
      - pointTime: "1:15:19.0"
        pointText: A hymn's warning about comfortable routines illustrates how prosperity can accompany spiritual forgetfulness.
      - pointTime: "1:18:43.04"
        pointText: 2 Peter describes forgotten grace and absent growth as a form of spiritual blindness.
      - pointTime: "1:22:38.44"
        pointText: The congregation is asked who Jesus is to them and urged to grow toward wholehearted worship.
    subchapters:
      - chapterId: s20260118-growth
        chapterTitle: Increasing Faith Rather than Crisis-Only Faith
        chapterKind: sermon
        chapterStart: "1:11:07.75"
        chapterEnd: "1:24:25.8"
        points:
          - pointTime: "1:11:12.4"
            pointText: The man first knows Jesus simply as the man who healed him.
          - pointTime: "1:12:12.76"
            pointText: Desperation can prompt obedience while comfortable circumstances can encourage self-reliance.
          - pointTime: "1:17:34.02"
            pointText: Peter calls for virtue, knowledge, self-control, steadfastness, godliness and love.
          - pointTime: "1:20:25.44"
            pointText: The man's recognition grows from prophet to one sent by God and finally to believing worship.
          - pointTime: "1:22:19.32"
            pointText: This progression challenges believers to keep growing throughout their lives.
