  - chapterId: c20260118-healing
    chapterTitle: The Man Born Blind and Healing without a Formula
    chapterKind: sermon
    chapterStart: "36:17.95"
    chapterEnd: "49:00.3"
    chapterScripture:
      - John 9:1-17
    points:
      - pointTime: "36:18.22"
        pointText: John 9's detailed account of one healing contains several layers of belief and unbelief.
      - pointTime: "37:29.56"
        pointText: The man's blindness from birth introduces the difficulty of congenital illness.
      - pointTime: "42:10.26"
        pointText: Jesus initiates healing without the man requesting it, challenging a fixed healing formula.
      - pointTime: "43:28.0"
        pointText: The preacher's experience of serious eye injury makes the passage personally significant.
      - pointTime: "48:15.52"
        pointText: Practical cataract treatment and Christian charity illustrate opportunities to restore sight.
  - chapterId: c20260118-suffering-purpose
    chapterTitle: Beyond Blame to Compassionate Support
    chapterKind: sermon
    chapterStart: "49:00.3"
    chapterEnd: "1:09:11.14"
    chapterScripture:
      - John 9:2-5
    points:
      - pointTime: "49:00.44"
        pointText: The disciples' question introduces moral causality and the assumption that suffering must identify someone's sin.
      - pointTime: "55:06.04"
        pointText: The problem of evil raises questions about God's power, goodness and knowledge.
      - pointTime: "1:00:46.88"
        pointText: Jesus rejects blame for this man's blindness and identifies God's works being displayed in him.
      - pointTime: "1:04:07.3"
        pointText: The preacher warns against imposing that explanation on every grieving person or suffering child.
      - pointTime: "1:06:50.96"
        pointText: Shared practical support can lessen the burden of facing uncertainty alone.
    subchapters:
      - chapterId: s20260118-accompany
        chapterTitle: Walk with People through Questions We Cannot Answer
        chapterKind: sermon
        chapterStart: "1:04:07.1"
        chapterEnd: "1:09:11.14"
        points:
          - pointTime: "1:04:07.3"
            pointText: One particular healing is not a ready-made explanation for every difficult situation.
          - pointTime: "1:04:38.36"
            pointText: Compassion includes crying and walking with people rather than offering detached religious explanations.
          - pointTime: "1:05:13.64"
            pointText: Admitting that we do not know is compatible with trusting God's purpose.
          - pointTime: "1:06:50.96"
            pointText: The preacher urges a shared journey of faith instead of isolated struggle.
          - pointTime: "1:08:55.32"
            pointText: Loving one another in deeds gives substance to community support.
  - chapterId: c20260118-progressive-faith
    chapterTitle: From Receiving Sight to Worshiping Christ
