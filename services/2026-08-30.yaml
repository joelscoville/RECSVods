  - chapterId: c20260830-spirit-and-direct-access
    chapterTitle: The Spirit Opens Direct Access to the Father
    chapterKind: sermon
    chapterStart: "33:05"
    chapterEnd: "55:07.62"
    points:
      - pointTime: "33:05"
        pointText: Pastor Yong connects Jesus' departure and the indwelling Spirit with joy and direct
          prayer in God's will, urging personal prayer without treating prominent Christians as
          necessary intermediaries or requiring constant happiness.
      - pointTime: "35:49.24"
        pointText: Jesus' departure and return are reviewed in relation to the cross, resurrection, ascension and Spirit.
      - pointTime: "39:12.06"
        pointText: Joy in the Spirit does not require believers to feel happy at every moment.
      - pointTime: "46:27.5"
        pointText: John 16:25-26 is connected with Pentecost and direct prayer to the Father.
      - pointTime: "52:54.66"
        pointText: Believers are urged to pray personally rather than treating prominent Christians as necessary intermediaries.
    subchapters:
