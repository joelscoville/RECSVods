  - chapterId: c20260830-hope-grounded-in-christ
    chapterTitle: Christ's Victory Makes Hope Certain
    chapterKind: sermon
    chapterStart: "1:30:55.66"
    chapterEnd: "1:35:49"
    points:
      - pointTime: "1:30:55.66"
        pointText: Pastor Yong grounds courage in Christ's death, resurrection and ascension, interpreting
          hope as patient assurance amid difficulty rather than wishful thinking or empty
          reassurance.
      - pointTime: "1:32:08.86"
        pointText: Christian hope is grounded in Jesus' victory, death, resurrection and ascension.
      - pointTime: "1:33:14.16"
        pointText: Romans 8:24-25 distinguishes patient assurance from wishful thinking.
      - pointTime: "1:34:34.32"
        pointText: The preacher applies the hymn's theme of trust to difficult circumstances and a secure destination.
    chapterScripture:
      - John 16:33
      - Romans 8:24-25
