  - chapterId: c20260830-shared-joy-amid-suffering
    chapterTitle: Shared Joy Does Not Remove Suffering
    chapterKind: sermon
    chapterStart: "55:07.62"
    chapterEnd: "1:15:07.2"
    points:
      - pointTime: "55:07.62"
        pointText: Pastor Yong commends voluntary mutual care through Acts 2 while acknowledging
          self-interest, unreliable relationships, persecution, disappointment and the emotional
          cost of empathy rather than promising uninterrupted peace.
      - pointTime: "57:59.78"
        pointText: Amish mutual support illustrates practical care, with reservations about separation from outsiders.
      - pointTime: "1:00:49.7"
        pointText: Work incentives and economic changes illustrate the difficulty of sustaining selfless sharing.
      - pointTime: "1:04:08.58"
        pointText: Cell groups and practical help are commended without guaranteeing trustworthy relationships.
      - pointTime: "1:13:25.2"
        pointText: Becoming involved in people's lives carries an emotional cost for pastoral care.
    chapterScripture:
      - Acts 2:1-3
      - Acts 2:44-47
      - John 16:24
      - Acts 2
      - John 16:33
  - chapterId: c20260830-love-and-growing-faith
    chapterTitle: Remember God's Love and Seek Stronger Faith
    chapterKind: sermon
    chapterStart: "1:15:07.2"
    chapterEnd: "1:30:55.66"
    points:
      - pointTime: "1:15:07.38"
        pointText: Pastor Yong counters insecurity with God's love and forgiveness, encourages imperfect
          obedience, and presents the disciples' failures, Hebrews 11 and examples of perseverance
          as encouragement for faith that grows through trials.
      - pointTime: "1:16:45.68"
        pointText: Listeners facing trials are urged to remember God's love.
      - pointTime: "1:20:02.72"
        pointText: Relational, financial and health worries are considered in light of God's care.
      - pointTime: "1:24:04.16"
        pointText: Mark 9:24 and the disciples' failures illustrate faith that needs help and growth.
      - pointTime: "1:29:36.62"
        pointText: Nick Vujicic and Kanae Miyahara are presented as examples of faith and joy amid difficulty.
    subchapters:
      - chapterId: s20260830-faith
        chapterTitle: Weak Faith Can Grow Through Trials
        chapterKind: sermon
        chapterStart: "1:22:31.34"
        chapterEnd: "1:30:55.66"
        points:
          - pointTime: "1:22:31.34"
            pointText: Pastor Yong says God understands weak faith, drawing encouragement from Mark 9:24,
              Hebrews 11 and examples he attributes to Stephen Tong, Nick Vujicic and Kanae
              Miyahara.
          - pointTime: "1:24:04.16"
            pointText: The disciples' failures are connected with the request for help with unbelief in Mark 9:24.
          - pointTime: "1:25:36.06"
            pointText: Hebrews 11 describes trust that looks beyond a person's own lifetime.
          - pointTime: "1:27:14.72"
            pointText: The preacher recalls being encouraged by Stephen Tong's resolve while working on his autobiography.
          - pointTime: "1:29:36.62"
            pointText: The displayed example of Nick Vujicic and his wife encourages faith despite hardship.
        chapterScripture:
          - John 16:29-32
          - Mark 9:24
          - Hebrews 11:13-16
