              better.
          - pointTime: "44:00.2"
            pointText: The Spirit living in believers changes how they experience Christ's presence.
          - pointTime: "46:27.5"
            pointText: The preacher connects Jesus' promise with direct access to the Father through the Spirit.
          - pointTime: "49:25.2"
            pointText: A pastoral prayer visit illustrates why a minister's prayer is not automatically better.
          - pointTime: "52:54.66"
            pointText: Personal, regular prayer is encouraged instead of dependence on human intermediaries.
        chapterScripture:
          - John 13
