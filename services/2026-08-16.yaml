  - chapterId: c20260816-p3-willing-service
    chapterTitle: Maturity Takes Shape in Willing Service
    chapterKind: sermon
    chapterStart: "1:04:21.161"
    chapterEnd: "1:22:10.281"
    points:
      - pointTime: "1:04:21.161"
        pointText: Hadi presents service under God as a privilege, drawing on Nick Vujicic's recorded
          testimony and his own prison ministry to challenge unwillingness and urge humble, obedient
          use of one's gifts for others.
      - pointTime: "1:06:01.04"
        pointText: Nick Vujicic is introduced as an example of finding hope amid disability and bullying.
      - pointTime: "1:12:22.08"
        pointText: Hadi distinguishes lacking ability from being unwilling to serve.
      - pointTime: "1:18:08.08"
        pointText: The sermon is summarized in humility, trust in God's wisdom and good works as fruit of active faith.
      - pointTime: "1:20:48.28"
        pointText: Listeners are asked to consider nearby needs and the gifts or experience they can offer.
    subchapters:
      - chapterId: s0816-p3-testimony
        chapterTitle: Nick Vujicic on Forgiveness and Daily Dependence
        chapterKind: other
        chapterStart: "1:07:55.661"
        chapterEnd: "1:11:29.141"
        points:
          - pointTime: "1:07:55.661"
            pointText: In the recorded clip, Nick Vujicic describes disability, questions about suffering and
              daily dependence on forgiveness; third-party claims remain unverified.
          - pointTime: "1:08:35.72"
            pointText: Nick recalls childhood questions about God's love prompted by disability at school.
          - pointTime: "1:09:11.42"
            pointText: He asks where the God of miracles is amid suffering.
          - pointTime: "1:10:06.92"
            pointText: Forgiveness is described as the greatest miracle he has received.
          - pointTime: "1:10:58.98"
            pointText: He describes daily dependence on God and himself as under construction.
      - chapterId: s0816-p3-prison
        chapterTitle: Beginning Prison Ministry With Trust
        chapterKind: other
        chapterStart: "1:13:19.001"
        chapterEnd: "1:16:53.281"
        points:
          - pointTime: "1:13:19.001"
            pointText: Hadi recounts entering prison ministry despite reluctance, encountering inmates'
              isolation and finding joy in helping them return to society, beginning with trust
              rather than confidence.
          - pointTime: "1:14:30.58"
            pointText: Hadi recalls the application and screening required for prison counseling.
          - pointTime: "1:15:16.5"
            pointText: Visiting restrictions helped him appreciate the isolation experienced by inmates.
          - pointTime: "1:16:14.86"
            pointText: Helping inmates prepare to return to society brought joy to ministry that began with trust.
