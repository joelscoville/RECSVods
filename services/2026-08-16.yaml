  - chapterId: c20260816-p3-pride-hinders-growth
    chapterTitle: Pride Keeps Believers Immature
    chapterKind: sermon
    chapterStart: "42:58.801"
    chapterEnd: "46:20.021"
    points:
      - pointTime: "42:58.801"
        pointText: Resuming mid-sentence after an unmeasured recording gap, Hadi identifies pride in
          personality loyalties, resentment and conditional obedience as resistance to spiritual
          growth, citing William Barclay on pride as a source of other sins.
      - pointTime: "44:12.02"
        pointText: Resentment of recognition and conditional obedience illustrate pride in daily life.
      - pointTime: "45:34.84"
        pointText: Hadi cites William Barclay while describing pride as a source from which other sins grow.
  - chapterId: c20260816-p3-effort-and-divine-growth
    chapterTitle: Work Faithfully and Trust God for Growth
    chapterKind: sermon
    chapterStart: "46:20.021"
    chapterEnd: "1:04:21.161"
    points:
      - pointTime: "46:20.021"
        pointText: Hadi argues that human effort matters although God determines growth and its means, using
          Scripture and practical examples to urge diligence, humble trust and worship without
          claiming complete understanding of sovereignty and responsibility.
      - pointTime: "47:18.86"
        pointText: Disappointment after helping others illustrates the temptation to expect control over visible results.
      - pointTime: "49:24.7"
        pointText: Proverbs distinguishes faithful preparation from control of outcomes.
      - pointTime: "50:37.16"
        pointText: Philippians 2:12-13 is used to explain human effort alongside divine enablement.
      - pointTime: "1:03:28.44"
        pointText: Reaching the limits of understanding is presented as a reason to worship rather than abandon faith.
    subchapters:
      - chapterId: s0816-p3-sovereignty
        chapterTitle: God Ordains the Means as Well as the Outcome
        chapterKind: sermon
        chapterStart: "51:55.501"
        chapterEnd: "56:29.481"
        points:
          - pointTime: "51:55.501"
            pointText: Hadi uses questions about lifespan and an exam illustration to argue that trust in
              ordained outcomes still requires responsible care and diligent preparation.
          - pointTime: "53:20.5"
            pointText: A friend's question asks why nutrition and exercise matter if lifespan is already determined.
          - pointTime: "54:08"
            pointText: Care for one's life remains a responsibility alongside belief in God's sovereignty.
          - pointTime: "54:53.32"
            pointText: An examination example shows that believing in an ordained outcome does not remove the need to prepare.
          - pointTime: "55:58.84"
            pointText: Hadi urges diligence alongside trust as he acknowledges the difficulty of the paradox.
      - chapterId: s0816-p3-limits
        chapterTitle: Faith Does Not Require Complete Understanding
        chapterKind: sermon
        chapterStart: "56:29.481"
        chapterEnd: "1:00:46.741"
        points:
          - pointTime: "56:29.481"
            pointText: Hadi contrasts human limits with God's perspective and argues, citing Scripture, the
              Westminster Confession and Augustine, that faith can precede fuller understanding
              without abandoning logic.
          - pointTime: "57:44.66"
            pointText: Finite human lives and uncertainty about tomorrow are contrasted with God's eternal perspective.
          - pointTime: "58:36.58"
            pointText: The Westminster Confession and Hebrews 11:1 support receiving what is needed for faith without understanding everything.
          - pointTime: "59:35.28"
            pointText: Hadi attributes to Augustine the thought that faith precedes fuller understanding.
        chapterScripture:
          - Isaiah 55:8-9
          - Hebrews 11:1
