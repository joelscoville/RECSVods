  - chapterId: c20260816-p2-grow-beyond-infancy
    chapterTitle: Believers Are Called to Grow Beyond Infancy
    chapterKind: sermon
    chapterStart: "33:00.64"
    chapterEnd: "42:58.801"
    points:
      - pointTime: "33:00.64"
        pointText: Hadi introduces spiritual maturity through 1 Corinthians 3:1-9, praying for growth and
          using Corinth's context and the infancy analogy to distinguish mature faith from
          persistent immaturity while raising questions about human effort under God's control.
      - pointTime: "34:21.7"
        pointText: Hadi introduces questions about growth after conversion, dryness in faith and the purpose of prayer and action.
      - pointTime: "36:26.7"
        pointText: The outline links spiritual immaturity, God's role in growth and the privilege of service.
      - pointTime: "38:50.2"
        pointText: A baby who fails to grow illustrates the problem of persistent spiritual infancy.
      - pointTime: "41:59.44"
        pointText: Hadi distinguishes mature believers, immature believers and unbelievers.
