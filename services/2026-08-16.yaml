    points:
      - pointTime: "42:58.801"
        pointText: Resuming mid-sentence after an unmeasured recording gap, Hadi identifies pride in
          personality loyalties, resentment and conditional obedience as resistance to spiritual
          growth, citing William Barclay on pride as a source of other sins.
  - chapterId: c20260816-p3-effort-and-divine-growth
    chapterTitle: Work Faithfully and Trust God for Growth
    chapterKind: sermon
    chapterStart: "46:20.021"
    chapterEnd: "1:04:21.161"
    points:
      - pointTime: "46:20.021"
        pointText: Hadi argues that human effort matters although God determines growth and its means, using
          Scripture and practical examples to urge diligence, humble trust and worship without
          claiming complete understanding of sovereignty and responsibility.
