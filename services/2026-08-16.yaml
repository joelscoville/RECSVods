recordingTitle: From Infant to Instrument
serviceDate: 2026-08-16
status: draft
sermonDescription: "Hadi Wijaya reads 1 Corinthians 3:1-9 as a call to grow beyond spiritual infancy
  into willing service. He challenges pride and loyalty to personalities, arguing that faithful
  effort matters even though God gives the growth. Receiving that tension with humility, rather than
  demanding complete understanding, leads toward practical obedience: trusting God enough to use
  one's gifts for others, as he illustrates through testimony and his experience in prison
  ministry."
