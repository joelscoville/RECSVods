  - chapterId: c20250727-worship
    chapterTitle: Worship and Scripture
    chapterKind: opening
    chapterStart: "10:27.16"
    chapterEnd: "35:47.9"
    chapterScripture:
      - Psalms 125:1-5
      - Proverbs 13:1-25
      - John 5:30-47
