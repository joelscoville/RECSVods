recordingTitle: Witnesses
serviceDate: 2025-07-27
status: draft
sermonDescription: Christ's judgment is grounded in the Father's will and gives both accountability and hope for unresolved injustice. His appeal to witnesses reflects identifying with human life rather than demanding belief by force. The Father, John the Baptist, Christ's works and Scripture testify to him, yet seeking worldly glory can obstruct recognition. The preacher connects genuine faith with shared community and calls every believer to become a credible witness whose conduct, rather than titles or knowledge alone, points others toward Christ.
sermonScripture:
  - John 5:30-47
  - Hebrews 12:1-3
  - Deuteronomy 19:15
sermonTopics:
  - truth
  - justice
  - church-life
