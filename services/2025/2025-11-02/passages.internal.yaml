    questions: ['What subject does the speaker introduce?', 'What does the opening prayer ask for?']
    topics: [sacrifice, prayer]
    scripture: ['Genesis 22:1-19', 'Romans 12:1-2']
    transcript: |
      Very good morning, Church. Happy Sunday. As Brother Hadi had shared, Reverend Yong is away, preaching at the Reformation Day Seminar in Cebu this weekend, and given the privilege to share the Word of God with you today. So let us commit the time to God in prayer. We pray for God to lead and guide us through his Word by his Holy Spirit.

      Father God, we come before you today with humble hearts, seeking your wisdom and truth. As we listen to your word, teach us what true sacrifice means. Open our hearts to trust you like Abraham, to obey even when it is hard. Let your Holy Spirit speak clearly and draw us nearer to you. In our Lord Jesus Christ’s most precious name we pray. Amen.

      As you have read in Genesis 22 in your responsive reading, today’s passage is titled The Death That Brings Life: Sacrifice. And we’ll be speaking on the sacrifice of Isaac by Abraham. [Brief slide-control exchange omitted.]
    confidence: 0.87
    review_notes: ['Opening sentence has an incomplete grammatical subject in ASR, retained without filling missing words. Both scripture references are trusted metadata confirmed by title slide; the earlier responsive reading is outside this upload.']
  - id: p1102-loss-sacrifice
    video_id: 94fynFHtreg
    section_id: s1102-sacrifice
    start: 86.6
    end: 155.82
    type: sermon
    title: Loss and voluntary sacrifice
    summary: The speaker distinguishes involuntary loss from a chosen sacrifice made for something valued more highly, contrasting despair with hope.
    questions: ['How does the speaker distinguish loss from sacrifice?']
    topics: [sacrifice]
    scripture: []
    transcript: |
      The word sacrifice carries a lot of weight, usually weighing very heavily on our hearts. For some it means loss, for others it means love. But what is the difference between loss and sacrifice? Loss is involuntary. We do not choose to lose something. However, sacrifice is voluntary. We choose to sacrifice with eyes wide open. We have weighed the decisions and choose the path to sacrifice, and for a reason, which brings us to the next point. Loss is giving up something [unclear word; ASR says “without cost”]. Unlike sacrifice, we give up something we value for another thing that we value even more, more important, more worthy. And lastly, loss results in despair and sadness while sacrifice is looked upon with hope and promise.
    confidence: 0.84
    review_notes: ['Uncertain cost/cause wording at 128.66–135.98s not silently resolved.']
