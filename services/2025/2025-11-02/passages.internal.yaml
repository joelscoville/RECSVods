    end: 836.44
    type: sermon
    title: Surrendering what is treasured
    summary: The speaker imagines Isaac’s place in Abraham’s later life and argues that the test concerned his greatest delight rather than something easy to spare.
    questions: ['Why does the speaker describe this test as a deep cut?', 'How does the speaker define costly surrender?']
    topics: [sacrifice]
    scripture: ['Genesis 22:1-19']
    transcript: |
      Isaac’s laughter, footsteps and presence must have filled Abraham’s old age with delight. He was not just Abraham’s son. He was Abraham’s joy and hope. And precisely because Isaac was such a joy, the test for Abraham to sacrifice Isaac at Moriah was a very, very deep cut. God was not asking for something that Abraham hated, but for the very thing he loved most. And what can we learn from here? Surrender is not measured by what we can spare, but by whether we will lay down what we treasure. God was not testing Abraham on the willingness to part with something cheap, but his readiness to trust God with his greatest delight.
    confidence: 0.88
