sermon_description: The speaker presents Abraham’s test as a surrender of treasured gifts and
  divided loyalties, sustained by trust developed through imperfect experience. He connects the
  provision for Isaac with Christ’s sacrifice, while distinguishing Isaac’s spared life from Jesus’
  death and resurrection. Turning to Romans 12, he urges a grateful response to mercy through daily
  surrender, renewed priorities and ordinary acts of obedience that prepare faith for trials.
