  - chapterId: c20260517-receptive-faith-recap
    chapterTitle: "Recap: Respond to Jesus with Faith"
    chapterKind: sermon
    chapterStart: "35:17.22"
    chapterEnd: "47:20.66"
    points:
      - pointTime: "35:17.22"
        pointText: Introducing John 13, Pastor Yong recaps John 12's unbelief, urges scrutiny of miracle
          claims without denying miracles, rejects blaming God for persistent sin, and prays for
          receptive faith.
      - pointTime: "37:11.6"
        pointText: The recap considers disappointment when Jesus' path differed from political expectations.
      - pointTime: "39:40.5"
        pointText: Belief in miracles is distinguished from claims that someone can supply them on demand.
      - pointTime: "41:38.82"
        pointText: Election is distinguished from blaming God for deliberately making people sin.
      - pointTime: "44:01.42"
        pointText: Struggling people are encouraged to keep praying rather than assume change is impossible.
