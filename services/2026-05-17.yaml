        points:
          - pointTime: "1:32:47.5"
            pointText: Using 1 John 4, Pastor Yong challenges unloving leaders' claims to know God and calls the
              church to follow Jesus in love and service as the apostles are prepared to be sent.
          - pointTime: "1:34:44.24"
            pointText: The supporting reading and Jesus' example prepare the apostles for being sent out.
          - pointTime: "1:36:07.08"
            pointText: Following Jesus requires action and love rather than discussion alone.
        chapterScripture:
