      - John 13-17
      - John 13:1-20
      - John 13:1
  - chapterId: c20260517-authority-in-service
    chapterTitle: Jesus Uses His Authority to Serve
    chapterKind: sermon
    chapterStart: "1:01:46.65"
    chapterEnd: "1:13:39.52"
    points:
      - pointTime: "1:01:46.78"
        pointText: Pastor Yong contrasts Judas's responsible choice under temptation with Jesus' authority
          expressed in lowly foot-washing, interpreting Peter's resistance and the disciples'
          limited understanding as calls to humility and lifelong learning.
      - pointTime: "1:03:14.7"
        pointText: People cannot excuse their choices by assigning every responsibility to the devil.
      - pointTime: "1:05:47.86"
        pointText: Jesus uses authority for foot washing instead of a display of power.
      - pointTime: "1:10:11.18"
        pointText: Peter's request for more washing is interpreted as an attempt to grasp spiritual meaning.
      - pointTime: "1:12:59.62"
        pointText: Clear teaching about salvation is distinguished from matters requiring continued study and humility.
    subchapters:
