  - chapterId: c20260517-live-as-beloved
    chapterTitle: Live as Beloved by Jesus
    chapterKind: sermon
    chapterStart: "47:21.94"
    chapterEnd: "1:01:46.65"
    points:
      - pointTime: "47:21.94"
        pointText: Explaining John's distinctive account and Jesus' timing and continuing care, Pastor Yong
          draws on Nouwen to urge trust in being beloved amid unresolved struggles rather than
          seeking worth in fleeting recognition.
      - pointTime: "50:32.54"
        pointText: Jesus' actions are interpreted through God's timing rather than entertainment.
      - pointTime: "52:59.16"
        pointText: John 13:1 is read as expressing complete love, with the limits of translation acknowledged.
      - pointTime: "56:00.3"
        pointText: Nouwen's writing encourages bringing the assurance of being beloved into everyday life.
      - pointTime: "1:01:00.34"
        pointText: Listeners are asked whether unresolved struggles prevent trust in scriptural assurance.
    chapterScripture:
