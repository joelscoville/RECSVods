  - chapterId: c20260517-follow-in-practical-love
    chapterTitle: Follow Jesus in Practical Love
    chapterKind: sermon
    chapterStart: "1:21:58.24"
    chapterEnd: "1:36:52.04"
    points:
      - pointTime: "1:21:58.24"
        pointText: Contrasting Jesus' example with flawed military and political leadership and unproductive
          church discussion, Pastor Yong urges practical lowly service rather than a required
          foot-washing ritual, making love the hallmark of personal and church life.
      - pointTime: "1:24:18.38"
        pointText: Scout and officer-cadet training introduce the preacher's interest in leadership.
      - pointTime: "1:27:07.92"
        pointText: Pressure to decide quickly and coerce followers exposes limits of human leadership.
      - pointTime: "1:31:00.8"
        pointText: John 13:14 is presented as a practical rule for lowly service when abstract theories become confusing.
      - pointTime: "1:36:07.08"
        pointText: Practical action and love are urged as the hallmark of individual and church life.
