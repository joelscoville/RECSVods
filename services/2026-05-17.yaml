      - pointTime: "1:14:54.54"
        pointText: A paid-debt analogy is questioned as an argument against continuing confession.
      - pointTime: "1:15:56.6"
        pointText: Dust on clean feet illustrates daily confession within the service's ACTS preparation.
      - pointTime: "1:17:40.82"
        pointText: 1 Corinthians 3:13-15 contrasts work that survives with being saved while suffering loss.
      - pointTime: "1:20:31.3"
        pointText: The preacher explicitly labels a discussion of future embarrassment as imagination, not biblical teaching.
