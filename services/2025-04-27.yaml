recordingTitle: Transforming Encounter
serviceDate: 2025-04-27
status: draft
sermonDescription: >-
  Brother Victor asks what difference Christ's resurrection makes beyond attendance at church or religious rules. Mary, the fearful disciples and the hostile Paul become unlikely witnesses whose encounters bring transformation. Their testimony leads to two implications: hope of forgiveness, resurrection and eternal life, and the hardship of submitting daily life to Christ's lordship. Abiding in Christ means bringing Scripture into ordinary decisions, taking steps of faith and acting on what believers already know pleases him.
sermonScripture:
  - John 20:1-31
  - 1 Corinthians 15:1-11
sermonTopics:
  - hope
  - discipleship
  - eternal-life
