    chapterTitle: Raise the Next Generation to Know and Trust God
    chapterKind: qa
    chapterStart: "0:01.68"
    chapterEnd: "18:20.6"
    chapterScripture:
      - Proverbs 3:5-6
      - 2 Timothy 3:1-5
