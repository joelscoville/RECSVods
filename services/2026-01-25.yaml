sermonDescription: Concluding John 9, the preacher contrasts the healed man's plain testimony with leaders whose knowledge does not prevent spiritual blindness. Fear and self-preservation can bury truth, while personal relationship with Christ gives lived confidence. Christ seeking the expelled man introduces election and response. The wheat, weeds and net parables address wrongdoing among religious people, and Matthew 7 directs attention to a genuine desire to do God's will rather than impressive religious appearances.
