recordingTitle: The Unchanging Love of God
serviceDate: 2025-08-24
status: draft
sermonDescription: Malachi's disappointed audience is called to remember God's love rather than use difficult circumstances as the measure of his faithfulness. The guest preacher follows three movements in which love is revealed through covenant, election and righteousness. Grace precedes performance and should produce humble trust, while love and justice remain inseparable. Christ's cross supplies the concrete answer to doubt, calling the congregation toward repentance and faithful service rather than religious bargaining or a softened gospel.
sermonScripture:
  - Malachi 1:1-5
  - Romans 5:8
  - Jeremiah 31:3
sermonTopics:
  - love
  - repentance
  - salvation
