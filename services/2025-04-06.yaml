recordingTitle: The First
serviceDate: 2025-04-06
status: draft
sermonDescription: Jesus' first sign at Cana reveals divine purpose through a quiet miracle at a joyful occasion. The preacher considers Mary's response, the servants' obedience and God's goodness beyond the idea of saving the best only for later. Joy belongs within Christian life rather than exclusively to secular pleasure. Acknowledging suffering and the need for empathy, the message calls believers to choose joy daily on the secure foundation of belonging to God and to discover delight through faithful service.
sermonScripture:
  - John 2:1-12
  - Philippians 4:4
sermonTopics:
  - joy
  - discipleship
  - service
