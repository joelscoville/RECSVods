        points:
          - pointTime: "58:39.08"
            pointText: The preacher applies Paul’s willingness to forgo meat to urge caution when exercising a
              legitimate right could harm another believer’s faith.
          - pointTime: "59:46.02"
            pointText: Exercising a legitimate right is weighed against its impact on a weaker believer.
