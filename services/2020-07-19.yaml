  - chapterId: c20200719-trials-and-growth
    chapterTitle: Expect Trials and Learn Through Them
    chapterKind: sermon
    chapterStart: "20:57.06"
    chapterEnd: "39:52.88"
    points:
      - pointTime: "20:57.06"
        pointText: Reading Luke 17 as a continuation of Lazarus, the preacher uses marriage and the debated
          marshmallow findings to discuss temptation in a fallen world and attributes to Stephen
          Tong the paradox that trials are necessary for growth.
    subchapters:
      - chapterId: s0719-test-discussion
        chapterTitle: Delayed Gratification and Competing Explanations
        chapterKind: sermon
        chapterStart: "31:55.7"
        chapterEnd: "34:20.94"
        points:
          - pointTime: "31:55.7"
            pointText: The preacher favors delayed gratification’s practical value while acknowledging family
              background and trust as competing explanations for the apparent link between waiting
              and later success.
    chapterScripture:
      - Luke 16:19-31
      - Luke 17:1-9
      - Genesis 3:17-18
      - 1 Peter 5:8
  - chapterId: c20200719-resist-through-truth
    chapterTitle: Resist Temptation by Believing the Truth
    chapterKind: sermon
    chapterStart: "39:52.88"
    chapterEnd: "48:08.84"
    points:
      - pointTime: "39:52.88"
        pointText: The preacher distinguishes encountering temptation from dwelling on it and argues that
          believing God’s Word and recognizing harmful consequences underlie practical safeguards.
    subchapters:
      - chapterId: s0719-truth
        chapterTitle: Recognize the Cost of Giving In
        chapterKind: sermon
        chapterStart: "42:17.06"
        chapterEnd: "45:55.74"
        points:
          - pointTime: "42:17.06"
            pointText: Applying John 8 to everyday temptation, the preacher draws on adultery counseling and
              harmful habits while acknowledging the difficulty of stopping smoking.
        chapterScripture:
          - John 8:31-32
          - Psalms 119
    chapterScripture:
      - John 8:31-32
      - Psalms 119
  - chapterId: c20200719-avoid-stumbling-blocks
    chapterTitle: Do Not Become a Stumbling Block
    chapterKind: sermon
    chapterStart: "48:08.84"
    chapterEnd: "1:00:39.54"
    points:
      - pointTime: "48:08.84"
        pointText: The preacher applies Luke 17 and Matthew 18 to harmful work, hypocrisy and personal
          rights, also presenting disputed dress/assault reasoning and an unverified Gandhi anecdote
