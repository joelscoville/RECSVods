    points:
      - pointTime: "0:00"
        pointText: Rev. Yong Teck Meng welcomes online participants and reflects on pandemic worship
          restrictions through a wedding account and Yancey’s account of a silent retreat.
  - chapterId: c20200719-scripture-warnings
    chapterTitle: Take Scripture’s Warnings Seriously
    chapterKind: sermon
    chapterStart: "4:51.72"
    chapterEnd: "20:57.06"
    points:
      - pointTime: "4:51.72"
        pointText: The preacher uses Lazarus and judgment to warn against neglect, prays for teachability
          and argues that faith in Scripture reveals coherence in Luke’s teachings.
    subchapters:
      - chapterId: s0719-recap-judgment
        chapterTitle: Neglect Has Eternal Consequences
        chapterKind: sermon
        chapterStart: "8:36.76"
        chapterEnd: "13:15.6"
        points:
          - pointTime: "8:36.76"
            pointText: The preacher connects common grace, judgment and sins of omission with his warning that
              present choices have irreversible eternal consequences.
        chapterScripture:
          - Luke 16:19-31
          - Matthew 25
    chapterScripture:
