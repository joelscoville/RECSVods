  - chapterId: c20200719-trials-and-growth
    chapterTitle: Expect Trials and Learn Through Them
    chapterKind: sermon
    chapterStart: "20:53.46"
    chapterEnd: "39:53.36"
    points:
      - pointTime: "20:53.46"
        pointText: Reading Luke 17 as a continuation of Lazarus, the preacher uses marriage and the debated
          marshmallow findings to discuss temptation in a fallen world and attributes to Stephen
          Tong the paradox that trials are necessary for growth.
      - pointTime: "22:07.86"
        pointText: Luke 17 is read as preparing disciples for trials and temptations.
      - pointTime: "26:12.16"
        pointText: The marshmallow test introduces delayed gratification as an illustration.
      - pointTime: "34:20.94"
        pointText: Fallen humanity and a fallen earth are presented as reasons for trial and temptation.
      - pointTime: "38:26.54"
        pointText: Marital conflict can reveal differences and provide opportunities to learn forgiveness.
    subchapters:
      - chapterId: s0719-test-discussion
        chapterTitle: Delayed Gratification and Competing Explanations
        chapterKind: sermon
        chapterStart: "31:55.7"
        chapterEnd: "34:20.94"
        points:
          - pointTime: "31:55.7"
            pointText: The preacher favors delayed gratification’s practical value while acknowledging family
              background and trust as competing explanations for the apparent link between waiting
              and later success.
          - pointTime: "33:26.42"
            pointText: Studying rather than playing illustrates delayed gratification's practical value.
    chapterScripture:
      - Luke 16:19-31
      - Luke 17:1-9
      - Genesis 3:17-18
