    points:
      - pointTime: "0:01.84"
        pointText: Rev. Yong Teck Meng welcomes online participants and reflects on pandemic worship
          restrictions through a wedding account and Yancey’s account of a silent retreat.
      - pointTime: "0:58.94"
        pointText: A wedding illustrates pandemic restrictions on masks and singing.
      - pointTime: "1:55.6"
        pointText: Worship restrictions introduce reflection on unfamiliar forms of meditation.
      - pointTime: "3:06.12"
        pointText: Yancey's account of a silent retreat illustrates learning from other worship traditions.
      - pointTime: "3:59"
        pointText: Learning not to need things is connected with meditation during restricted worship.
  - chapterId: c20200719-scripture-warnings
    chapterTitle: Take Scripture’s Warnings Seriously
    chapterKind: sermon
    chapterStart: "4:50.06"
    chapterEnd: "20:53.46"
    points:
      - pointTime: "4:50.06"
        pointText: The preacher uses Lazarus and judgment to warn against neglect, prays for teachability
          and argues that faith in Scripture reveals coherence in Luke’s teachings.
      - pointTime: "7:25.22"
        pointText: The rich man and Lazarus introduce the preacher's account of judgment.
      - pointTime: "11:06.56"
        pointText: Sins of omission connect neglect of Lazarus with Matthew 25.
      - pointTime: "13:15.6"
        pointText: The account's conclusion supports the central place of Scripture over impressive signs.
      - pointTime: "19:48.76"
        pointText: Reading in faith is presented as revealing a coherent line through Luke's apparently fragmentary teachings.
    subchapters:
      - chapterId: s0719-recap-judgment
        chapterTitle: Neglect Has Eternal Consequences
        chapterKind: sermon
        chapterStart: "8:36.76"
        chapterEnd: "13:15.6"
        points:
          - pointTime: "8:36.76"
            pointText: The preacher connects common grace, judgment and sins of omission with his warning that
              present choices have irreversible eternal consequences.
          - pointTime: "9:50.2"
            pointText: Ordinary comforts and relationships illustrate common grace.
          - pointTime: "11:06.56"
            pointText: Failing to do what one ought is distinguished from actively doing wrong.
          - pointTime: "12:25"
            pointText: Present choices are connected with eternal consequences.
        chapterScripture:
          - Luke 16:19-31
          - Matthew 25
    chapterScripture:
      - Luke 16:19-31
      - Matthew 8:11-12
