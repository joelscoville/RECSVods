          in his warning against damaging others’ faith.
      - pointTime: "49:44.46"
        pointText: Listeners are asked whether their work directly promotes harm or causes others to fall.
      - pointTime: "55:17.48"
        pointText: Financial abuse and ostentatious pastoral lifestyles are discussed as causes of rejection of Christianity.
      - pointTime: "56:03.8"
        pointText: Hypocrisy, hurtful conduct and neglect can drive others away despite religious appearances.
      - pointTime: "59:46.02"
        pointText: Paul's willingness to forgo meat illustrates considering others before insisting on personal rights.
    subchapters:
