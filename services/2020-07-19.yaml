  - chapterId: c20200719-resist-through-truth
    chapterTitle: Resist Temptation by Believing the Truth
    chapterKind: sermon
    chapterStart: "39:53.36"
    chapterEnd: "48:08.84"
    points:
      - pointTime: "39:53.36"
        pointText: The preacher distinguishes encountering temptation from dwelling on it and argues that
          believing God’s Word and recognizing harmful consequences underlie practical safeguards.
      - pointTime: "42:17.06"
        pointText: John 8 calls for abiding in the Word rather than merely claiming Christian identity.
      - pointTime: "44:10.92"
        pointText: Counseling families affected by adultery illustrates the harm of yielding to temptation.
      - pointTime: "45:55.74"
        pointText: Not handling offering money personally is described as a practical safeguard.
      - pointTime: "47:14.56"
        pointText: Listeners are urged to take the truth they profess seriously.
    subchapters:
      - chapterId: s0719-truth
        chapterTitle: Recognize the Cost of Giving In
        chapterKind: sermon
        chapterStart: "42:14.98"
        chapterEnd: "45:55.24"
        points:
          - pointTime: "42:14.98"
            pointText: Applying John 8 to everyday temptation, the preacher draws on adultery counseling and
              harmful habits while acknowledging the difficulty of stopping smoking.
          - pointTime: "43:31.84"
            pointText: John 8:32 is applied to recognizing temptation and everyday mistakes.
          - pointTime: "44:10.92"
            pointText: The consequences of adultery strengthen the preacher's resolve not to dwell on temptation.
          - pointTime: "45:19.04"
            pointText: Witnessing the consequences of harmful habits can undermine their appeal, while quitting remains difficult.
        chapterScripture:
          - John 8:31-32
          - Psalms 119
    chapterScripture:
      - John 8:31-32
      - Psalms 119
  - chapterId: c20200719-avoid-stumbling-blocks
    chapterTitle: Do Not Become a Stumbling Block
    chapterKind: sermon
    chapterStart: "48:08.84"
    chapterEnd: "1:00:40.58"
