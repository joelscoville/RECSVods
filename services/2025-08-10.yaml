recordingTitle: The Art of the Impossible
serviceDate: 2025-08-10
status: draft
sermonDescription: Christ walking on water reveals divine freedom beyond human expectations and prompts three responses of unbelief, fear and faith. His withdrawal to pray models dependence, while his divinity challenges treating God as dependent on religious transactions. Peter's step from the boat encourages active faith beyond safety, yet his sinking exposes the danger of looking away from Christ. Grace reaches those who falter, calling believers to use their gifts and keep their focus on Jesus rather than approval or circumstances.
sermonScripture:
  - John 6:16-21
  - Matthew 14:22-33
  - Hebrews 12:2
sermonTopics:
  - faith
  - prayer
  - knowing-god
