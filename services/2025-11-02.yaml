          acknowledging uncertainty about his age.
      - pointTime: "19:11"
        pointText: Isaac's birth is presented as a decisive experience strengthening trust in the promise.
      - pointTime: "21:34.9"
        pointText: The speaker invites fathers to consider the imagined emotional cost of Abraham's journey.
      - pointTime: "25:28.24"
        pointText: Isaac's age is explicitly unknown, and the speaker's calculation is offered conditionally.
      - pointTime: "28:30.4"
        pointText: Isaac's lack of resistance is interpreted as voluntary trust in his father.
