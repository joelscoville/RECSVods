    chapterKind: sermon
    chapterStart: "0:00"
    chapterEnd: "7:30.68"
    points:
      - pointTime: "0:00"
        pointText: After greeting and prayer, the speaker distinguishes chosen sacrifice from involuntary
          loss and introduces Abraham’s developing faith through imperfect responses to earlier
          tests.
      - pointTime: "1:26.6"
        pointText: Involuntary loss is distinguished from chosen sacrifice for something valued more highly.
      - pointTime: "3:08.8"
        pointText: Earlier tests begin with Abraham leaving for an unknown destination.
      - pointTime: "5:46.16"
        pointText: Impatience in the Hagar episode is contrasted with trust expressed in intercession for Sodom.
      - pointTime: "6:46.52"
        pointText: Abraham's faith develops through imperfect responses rather than flawless obedience.
