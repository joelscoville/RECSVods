    chapterStart: "7:30.68"
    chapterEnd: "17:11.56"
    points:
      - pointTime: "7:30.68"
        pointText: The speaker presents Isaac as Abraham’s promised heir and greatest delight, interpreting
          the test as a question of allegiance rather than a desire for Isaac’s death.
      - pointTime: "9:02.22"
        pointText: Genesis 17 emphasizes the scale of the promise of descendants and nations.
      - pointTime: "10:09"
        pointText: The covenant is connected with Isaac rather than Abraham's proposed alternative of Ishmael.
      - pointTime: "12:55.02"
        pointText: Isaac is presented as Abraham's greatest delight rather than something easy to spare.
      - pointTime: "16:16.66"
        pointText: The test asks whether the gift has become more important than its giver.
