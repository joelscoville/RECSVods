  - chapterId: c20260614-christs-work-belongs-to-every-believer
    chapterTitle: Christ's Work Is Entrusted to Every Believer
    chapterKind: sermon
    chapterStart: "1:11:03.35"
    chapterEnd: "1:28:07.78"
    points:
      - pointTime: "1:11:03.42"
        pointText: Pastor Yong reads John 14:12 as a call for ordinary believers to use their gifts in
          compassionate service, interpreting greater works as wider reach through evangelism,
          travel and communication rather than surpassing Christ's work in quality.
      - pointTime: "1:12:26.96"
        pointText: God's work is not restricted to pastors, unusually talented people or those with abundant resources.
      - pointTime: "1:17:38.26"
        pointText: A hungry person at the door illustrates action rather than waiting for a miracle to replace responsibility.
      - pointTime: "1:22:44.72"
        pointText: The preacher connects varied gifts with living beyond personal interests.
      - pointTime: "1:26:23.32"
        pointText: Travel and remote communication illustrate greater reach rather than greater quality than Christ's work.
    chapterScripture:
      - John 14:12
  - chapterId: c20260614-pray-and-serve-as-christs-representatives
    chapterTitle: Pray and Serve as Christ's Representatives
    chapterKind: sermon
    chapterStart: "1:28:07.78"
    chapterEnd: "1:37:47.92"
    points:
      - pointTime: "1:28:07.78"
        pointText: Pastor Yong explains prayer in Christ's name as representing his cause, using accounts of
          failed declarations and disappointment to affirm Christ's support without guaranteed
          outcomes and urge small acts of service.
      - pointTime: "1:29:29.54"
        pointText: World Cup wishes challenge the idea that prayer guarantees a preferred result.
      - pointTime: "1:32:32.72"
        pointText: Prayer in Jesus' name is explained as representing Christ's cause rather than using a formula.
      - pointTime: "1:34:56.46"
        pointText: A failed site acquisition illustrates disappointment despite confidence and preparation.
      - pointTime: "1:36:38.16"
        pointText: Listeners are urged to begin practical kindness in ordinary work and daily encounters.
    chapterScripture:
      - John 14:13-14
      - John 14:12-14
      - John 14:12
