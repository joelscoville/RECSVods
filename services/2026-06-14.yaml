  - chapterId: c20260614-knowing-jesus-shapes-our-lives
    chapterTitle: Knowing Jesus Shapes Our Lives
    chapterKind: sermon
    chapterStart: "35:42.12"
    chapterEnd: "1:11:03.35"
    points:
      - pointTime: "35:42.12"
        pointText: Recapping trust in Christ and the Spirit's present help, Pastor Yong urges humble
          learning from Jesus as the Father's revelation and a Bible-grounded pattern for
          forgiveness and daily life rather than self-sufficiency or celebrity imitation.
      - pointTime: "43:54.16"
        pointText: Reformed convictions are paired with a warning against self-righteous speculation about others' salvation.
      - pointTime: "51:43.02"
        pointText: The disciples' years with Jesus illustrate how much humility human understanding requires.
      - pointTime: "1:00:49.7"
        pointText: Hebrews 1 and Colossians 1 are used to explain Jesus' unique revelation of God.
      - pointTime: "1:03:53.24"
        pointText: Asking what Jesus would do requires first knowing him through the Bible.
    subchapters:
      - chapterId: s20260614-11
        chapterTitle: Jesus Reveals the Father
        chapterKind: sermon
        chapterStart: "47:09.26"
        chapterEnd: "1:11:03.35"
        points:
          - pointTime: "47:09.26"
            pointText: Beginning with Philip's request, Pastor Yong develops Jesus' revelation of the Father
              into a call for lifelong learning, discernment about signs and following Christ's
              example.
          - pointTime: "51:43.02"
            pointText: The disciples' continuing confusion challenges assumptions of spiritual mastery.
          - pointTime: "54:32.08"
            pointText: Sermon preparation combines earlier exposition, other preachers and prayer for enlightenment.
          - pointTime: "1:00:49.7"
            pointText: Hebrews 1 and Colossians 1 affirm Christ's revelation of God and place over creation.
          - pointTime: "1:03:53.24"
            pointText: A Bible-grounded knowledge of Jesus is necessary for using him as a pattern in daily decisions.
