      - Ephesians 5:15-17
  - chapterId: c20260802-introduction-paranormal-questions
    chapterTitle: "Introduction and Q&A: Weighing Paranormal Claims"
    chapterKind: qa
    chapterStart: "35:08.78"
    chapterEnd: "42:11.76"
    points:
      - pointTime: "35:08.78"
        pointText: After introducing the sermon texts and thanking co-workers, Pastor Yong addresses
          paranormal claims, mysticism and vaccination disagreements, urging objective inquiry while
          allowing that a medical dissenter could be right and describing Scripture’s sufficiency
          for faith and life.
      - pointTime: "36:11.92"
        pointText: The preacher appreciates co-workers who improve the livestream without needing micromanagement.
      - pointTime: "37:13.96"
        pointText: Questions about reincarnation, qigong and out-of-body experiences are introduced.
      - pointTime: "39:14.28"
        pointText: A doctors illustration retains the qualification that a dissenter could be right.
      - pointTime: "40:46.56"
        pointText: Objective evidence and reasonable inquiry are encouraged alongside Scripture's sufficiency for faith and life.
    chapterScripture:
      - John 16:1-15
      - Ephesians 5:15-17
  - chapterId: c20260802-witness-amid-opposition
    chapterTitle: Witness Amid Opposition Without Segregation
    chapterKind: sermon
    chapterStart: "42:11.76"
    chapterEnd: "52:02.26"
    points:
      - pointTime: "42:11.76"
        pointText: Pastor Yong introduces John 16’s warnings through the cost of witness, criticizes
          segregation and uses his unverified Coptic-martyr account to illustrate faith amid
          opposition, with prayer for receptive hearing.
      - pointTime: "43:31.88"
        pointText: Goodness among nonbelievers is distinguished from the fallen world's opposition to faith.
      - pointTime: "44:50.58"
        pointText: 2 Timothy 3:12 is connected with differences in worldview and spiritual allegiance.
      - pointTime: "47:59.5"
        pointText: John 16:1-3 introduces warnings about religiously motivated persecution.
      - pointTime: "50:28.38"
        pointText: The preacher recounts a worker joining others in professing Christ, while saying he has not watched the violent recording.
    chapterScripture:
      - John 7:7
      - 2 Timothy 3:12
      - John 16:1-15
      - John 16:1-3
      - John 16:2
  - chapterId: c20260802-growth-in-the-present
    chapterTitle: Future Hope Calls for Growth in the Present
    chapterKind: sermon
    chapterStart: "52:02.26"
    chapterEnd: "1:13:22.64"
    points:
      - pointTime: "52:02.26"
        pointText: Pastor Yong moves from unfolding revelation and human limits to a critique of future-only
          religion, using his Cambodia recollection and its correction to argue for sanctification
          and purposeful use of present time.
      - pointTime: "55:15.44"
        pointText: Progressive learning becomes a call for understanding of God to mature with age.
      - pointTime: "59:29.78"
        pointText: Future hope should not be interpreted as making present life meaningless.
      - pointTime: "1:07:40.72"
        pointText: The preacher admits shame at his earlier judgment of a Cambodian woman after learning of her wartime suffering.
      - pointTime: "1:11:38.6"
        pointText: Ephesians 5 and the talents illustration call for purposeful use of time.
    subchapters:
      - chapterId: s20260802-cambodia
        chapterTitle: Future Hope and a Mistaken Judgment in Cambodia
        chapterKind: sermon
        chapterStart: "1:00:36.94"
        chapterEnd: "1:08:49.14"
        points:
          - pointTime: "1:00:36.94"
            pointText: In his unverified Cambodia recollection, Pastor Yong connects a woman’s wish to give
              money to a temple for a better next life with his criticism of future-only religion,
              admitting shame at judging her after learning she had been raped during war.
          - pointTime: "1:01:56.46"
            pointText: The preacher describes his initial judgment, which he later explicitly withdraws.
          - pointTime: "1:05:34.12"
            pointText: Local staff buy the woman's vegetables, sparing her a walk to market.
          - pointTime: "1:06:41.38"
            pointText: Her wish to give the proceeds to a temple is explained through fear of another life in hardship.
          - pointTime: "1:07:40.72"
            pointText: Learning of the woman's wartime suffering causes the preacher to correct his assumption and express shame.
      - chapterId: s20260802-sanctification
        chapterTitle: Redemption Includes Lifelong Growth
        chapterKind: sermon
        chapterStart: "1:08:49.14"
        chapterEnd: "1:13:22.64"
        points:
          - pointTime: "1:08:52.82"
            pointText: Pastor Yong presents sanctification as lifelong growth toward Christ and uses Ephesians 5
              and the talents and rich-man illustrations to urge purposeful stewardship of time
              rather than passive waiting for heaven.
          - pointTime: "1:10:24.8"
            pointText: The preacher argues against treating faith simply as a ticket to heaven.
          - pointTime: "1:11:38.6"
            pointText: Ephesians 5 is connected with stewardship of time and the talents illustration.
          - pointTime: "1:12:51.64"
            pointText: A rich-man illustration warns against foolish use of time.
        chapterScripture:
          - Ephesians 5:15-17
          - Matthew 25
          - Ephesians 5:17
    chapterScripture:
      - John 16:4-6
      - Ephesians 5:15-17
      - Matthew 25
      - Ephesians 5:17
  - chapterId: c20260802-spirit-conviction-remembrance
    chapterTitle: The Spirit Convicts and Recalls Christ’s Teaching
    chapterKind: sermon
    chapterStart: "1:13:22.64"
    chapterEnd: "1:22:17.42"
    points:
      - pointTime: "1:13:22.64"
        pointText: Expounding John 16 and John 14, Pastor Yong presents the Spirit’s worldwide indwelling,
          conviction and remembrance of Christ’s teaching as the basis of believers’ confidence
          rather than reliance on persuasive arguments or human effort alone.
      - pointTime: "1:14:36.26"
        pointText: A relay-race analogy illustrates the Spirit's presence beyond Jesus' earthly location.
      - pointTime: "1:16:48.4"
        pointText: Divine conviction is distinguished from winning a human argument.
      - pointTime: "1:18:43.96"
        pointText: Conviction is summarized in relation to rejection of Christ, righteousness and Satan's defeat.
      - pointTime: "1:21:10.2"
        pointText: John 16:12-15 and John 14:26 explain the Spirit affirming truth and recalling Christ's teaching.
    chapterScripture:
      - John 16:7-11
      - John 14:15-17
      - John 16:8-11
      - John 16:12-15
      - John 14:26
  - chapterId: c20260802-spirit-led-loving-service
    chapterTitle: Depend on the Spirit for Daily Loving Service
    chapterKind: sermon
    chapterStart: "1:22:17.42"
    chapterEnd: "1:33:27.58"
    points:
      - pointTime: "1:22:17.42"
        pointText: Pastor Yong applies the Spirit’s help to changing habits in marriage, regular Scripture
          reading and prayer, and joyful, willing service in a loving community, concluding with
          prayer for active obedience rather than passive waiting.
      - pointTime: "1:23:59.48"
        pointText: Different preferences about making a bed illustrate changing habits out of love for a spouse.
      - pointTime: "1:26:17.76"
        pointText: Forgetting a reading becomes a reason for regular Scripture reading, prayer and consistency.
      - pointTime: "1:27:43.72"
        pointText: John 13:34-35 connects spiritual growth with shared, loving community rather than bitter service.
      - pointTime: "1:30:49.98"
        pointText: Gifted people are urged to respond willingly to opportunities for service.
    subchapters:
      - chapterId: s20260802-marriage
        chapterTitle: Serving a Spouse Through the Spirit’s Help
        chapterKind: sermon
        chapterStart: "1:22:17.42"
        chapterEnd: "1:26:17.76"
        points:
          - pointTime: "1:22:17.42"
            pointText: Drawing on a cell-group study of Timothy Keller’s The Meaning of Marriage, Pastor Yong
              uses differing preferences about making the bed to explore changed habits, love for a
              spouse and dependence on the Spirit.
          - pointTime: "1:23:59.48"
            pointText: Making the bed illustrates changing a personal preference out of love for a spouse.
          - pointTime: "1:25:09.14"
            pointText: The preacher asks whether changed behavior comes through isolated effort or the Spirit's help.
    chapterScripture:
      - John 13:34-35
  - chapterId: c20260802-response-closing
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:33:27.58"
    chapterEnd: "1:47:44.981"
    points:
      - pointTime: "1:33:27.58"
        pointText: The leaders guide the creed, prayer for cell ministry, offerings supporting evangelism,
          an encouragement to pray often, the closing hymn and blessing, then invite fellowship and
          ministry participation through photo-directory, refreshments and community-lunch
          announcements.
      - pointTime: "1:35:55.56"
        pointText: Prayer asks for cell leaders and a community that serves one another in love.
      - pointTime: "1:38:03.52"
        pointText: The first-Sunday second offering is designated for evangelism.
      - pointTime: "1:39:27.64"
        pointText: What a Friend We Have in Jesus is introduced with encouragement to pray often.
      - pointTime: "1:44:21.78"
        pointText: Photo-directory updates and shared refreshments are encouraged as ways to build warmer fellowship.
    chapterScripture:
      - Hebrews 13
