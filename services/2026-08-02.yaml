recordingTitle: The Here and Now
serviceDate: 2026-08-02
status: draft
sermonDescription: Pastor Yong connects John 16 and Ephesians 5 to argue that Christian hope should
  shape life now rather than become passive waiting for heaven. Amid opposition and limited
  understanding, he presents sanctification as ongoing growth and the Spirit as the one who convicts
  and recalls Christ’s teaching. He brings dependence on the Spirit into daily devotion, marriage
  and willing service in a loving community.
sermonScripture:
  - John 7:7
  - 2 Timothy 3:12
  - John 16:1-15
sermonTopics:
  - discipleship
  - faith
  - mission
