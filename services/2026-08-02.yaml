        pointText: With ACTS preparation already underway, the leaders guide confession, thanksgiving and
          personal prayer, introduce Sister Catherine and welcome the congregation after a
          meditative interlude credited to Brother Joshua.
  - chapterId: c20260802-worship-communion-scripture
    chapterTitle: Worship, Communion and Scripture
    chapterKind: opening
    chapterStart: "6:55.3"
    chapterEnd: "35:08.78"
    points:
      - pointTime: "6:55.3"
        pointText: The leaders guide hymns, prayer, Communion and readings from Psalms, Proverbs, John and
          Ephesians, reflecting on belonging to Christ’s community and his care for the disciples
          alongside the video anthem This World Is Not My Home.
    subchapters:
      - chapterId: s20260802-communion
        chapterTitle: Communion Expresses Belonging to Christ’s Community
        chapterKind: communion
        chapterStart: "12:14.34"
        chapterEnd: "21:22.64"
        points:
          - pointTime: "12:14.34"
            pointText: Recalling pandemic disagreements about Communion at home, the minister presents
              participation as belonging to Christ’s community rather than mere ritual and leads the
              congregation in receiving together.
        chapterScripture:
          - 1 Corinthians 11:23-26
    chapterScripture:
