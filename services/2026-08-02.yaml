  - chapterId: c20260802-opening
    chapterTitle: Opening
    chapterKind: opening
    chapterStart: "0:00"
    chapterEnd: "6:55.3"
    points:
      - pointTime: "0:00"
        pointText: With ACTS preparation already underway, the leaders guide confession, thanksgiving and
          personal prayer, introduce Sister Catherine and welcome the congregation after a
          meditative interlude credited to Brother Joshua.
      - pointTime: "0:49.68"
        pointText: The leader invites confession while acknowledging believers' imperfection.
      - pointTime: "2:03.74"
        pointText: Thanksgiving is introduced with time for personal prayer.
      - pointTime: "3:09.36"
        pointText: Worshippers are invited to bring their concerns to God in supplication.
      - pointTime: "6:12.26"
        pointText: The worship leader welcomes the congregation and invites mutual greetings.
  - chapterId: c20260802-worship-communion-scripture
    chapterTitle: Worship, Communion and Scripture
    chapterKind: opening
    chapterStart: "6:55.3"
    chapterEnd: "35:08.78"
    points:
      - pointTime: "6:55.3"
        pointText: The leaders guide hymns, prayer, Communion and readings from Psalms, Proverbs, John and
          Ephesians, reflecting on belonging to Christ’s community and his care for the disciples
          alongside the video anthem This World Is Not My Home.
      - pointTime: "9:42.72"
        pointText: The opening prayer contrasts pride and insecurity with security in God.
      - pointTime: "21:22.64"
        pointText: Proverbs 1:1-33 is introduced for alternating reading.
      - pointTime: "24:58.06"
        pointText: The congregation reads John 16:1-15 responsively.
      - pointTime: "34:32.32"
        pointText: Ephesians 5:15-17 is read before the sermon.
    subchapters:
      - chapterId: s20260802-communion
        chapterTitle: Communion Expresses Belonging to Christ’s Community
        chapterKind: communion
        chapterStart: "12:14.34"
        chapterEnd: "21:22.64"
        points:
          - pointTime: "12:14.34"
            pointText: Recalling pandemic disagreements about Communion at home, the minister presents
              participation as belonging to Christ’s community rather than mere ritual and leads the
              congregation in receiving together.
          - pointTime: "13:46"
            pointText: Communion is described as belonging to Christ's community rather than merely completing a ritual.
          - pointTime: "15:02.74"
            pointText: The Lord's Prayer is followed by the institution reading from 1 Corinthians 11.
          - pointTime: "16:17.9"
            pointText: Baptized Christians are invited to receive the elements and wait to partake together.
          - pointTime: "19:04.34"
            pointText: The minister invites the congregation to stand and partake before asking Brother Hadi to pray.
        chapterScripture:
          - 1 Corinthians 11:23-26
    chapterScripture:
      - Psalms 92:1-4
      - 1 Corinthians 11:23-26
      - Proverbs 1:1-33
