sermonDescription: Reading Jesus' tears in John 11 alongside Hebrews 4, the preacher presents Christ as fully divine and human, the perfect example who understands suffering without sin. He acknowledges the mystery of Christ's knowledge and the paradoxes of trials, discipline and grief. Rather than promise answers to every painful question, he urges shared compassion and confidence in approaching Christ's throne of grace for help.
