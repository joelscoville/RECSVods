  - id: p0719-lazarus-account
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-rich-man
    start: 291.72
    end: 366.52
    type: sermon
    title: Revisiting the rich man and Lazarus
    summary: The preacher reviews his previous sermon and explains why some readers treat the rich man and Lazarus as an actual event rather than a parable.
    questions: ['Why does the preacher discuss whether the Lazarus account is a parable?']
    topics: [discernment]
    scripture: ['Luke 16:19-31', 'Matthew 8:11-12']
    transcript: |
      The last session we had together was an interesting session for me, actually. I entitled it Where the Sun Does Not Shine because it was focused on this narrative relating to the rich man and Lazarus. I've always been fascinated by this account because I read so many years ago that some people believe it was a real account, not just a parable, because of a couple of things. Jesus did not say that it is a parable. That's important because in most of the parables he would just come out and say this is a parable, this is a story, but this one he did not. Second, more importantly, there was a name associated with a character, and that's Lazarus. This is the only time it has happened in all the parables Jesus told, so people kept wondering whether it's a real event or not. Whether it's a real event or not is actually important, because if it is a real event, then what Jesus said about paradise and Hades and the fire and all that are all factual. But if it is just a parable, perhaps Jesus was trying to use that as an illustration. You see there's a difference even in small things like that.
    confidence: 0.86
    review_notes: ['300s recap slide supplies the previous sermon’s two references. Claims about Jesus’ parables remain attributed.']
  - id: p0719-purple-cloth
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-rich-man
    start: 366.52
    end: 445.22
    type: sermon
    title: Purple cloth and a snail-rescuing aside
    summary: The preacher describes the rich man’s luxury through a purple-dye illustration, questions his own shellfish figure, and makes an aside about rescuing snails.
    questions: ['How does the preacher illustrate the rich man’s wealth?']
    topics: [discipleship]
    scripture: ['Luke 16:19-31']
    transcript: |
      As usual, Jesus told a story with very extreme description. [Description from Luke 16:19 omitted; reference only.] It's a very extreme thing. I explained to you why purple cloth is important. It is made from a shellfish, the murex shellfish, and you've got to crush twelve thousand of them. Later I was talking to Patricia about it. I don't know whether it's true that it's twelve thousand. Twelve thousand is a lot! Maybe, but even one thousand is a lot. You get a slave to go to the lake or the seaside to catch all these shells and crush them to squeeze out the purple juice or whatever it is. Just to let you know, Patricia is a snail rescuer. As we walk, sometimes you step on snails. Pat is one of those people who has rescued many snails in her lifetime. But she always puts the snail on the wrong side! The snail is trying to cross the road to the other side; she puts it back here. If I'm the snail, it's like, hello, I just spent the last two hours crawling here, and then you put me on the wrong side. So you catch the murex and crush them, like you crush the snail, take the juice and make a purple linen cloth. That's how rich the guy was.
    confidence: 0.85
    review_notes: ['The preacher himself questions the shellfish count. No independent historical verification.']
  - id: p0719-death-judgment
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-rich-man
    start: 445.22
    end: 516.76
    type: sermon
    title: The preacher’s account of death and judgment
    summary: The preacher contrasts the rich man’s abundance with Lazarus’s need and outlines his understanding of paradise, Hades, resurrection and final judgment.
    questions: ['What understanding of death and judgment does the preacher draw from the account?']
    topics: [faith]
    scripture: ['Luke 16:19-31']
    transcript: |
      [Repeated narrative description from Luke 16 omitted.] The rich people were so rich that they would use bread to wipe their mouths and then throw away the bread, like you throw tissue paper, and all the beggars would go after that. In the illustration, the fact was that Lazarus was seen by the rich man; that's what it meant, looking for the scraps. But the illustration had a frightening aspect in what will happen at death. I explained that our understanding is that when the people of God die, immediately you are in paradise. But if you do not know Jesus Christ or reject Jesus Christ, when you die immediately you will be in Hades. When Jesus comes again, the resurrection of the body will happen, your soul will join with your body, and then you face the final judgment throne. For the people of God, we are judged for rewards, not for life or eternal punishment. People who do not belong to God will be judged for eternity and eternal punishment. That's in a nutshell what we believe in, and we get some of our understanding from the illustration of the rich man and Lazarus.
    confidence: 0.86
    review_notes: ['Theological and historical statements are preserved as the preacher’s exposition.']
  - id: p0719-hell-absence
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-judgment
    start: 516.76
    end: 590.2
    type: sermon
    title: Eternal punishment and the absence of goodness
    summary: The preacher rejects annihilation as an easy alternative to eternal punishment and stresses what he calls the absence of God’s goodness.
    questions: ['What does the preacher find most frightening about hell?']
    topics: [faith]
    scripture: ['Luke 16:19-31']
    transcript: |
      Still, the idea of hell is very difficult: whether it's eternal torment, or some people believe in annihilation, where you get punished for a while and then are totally destroyed forevermore. The theory and theology is very appealing, I suppose, to some extent, and a lot of people are kind of biased towards it. However, the fact is that Hades and hell in the Bible is a topic that was most preached by our Lord Jesus Christ, and he absolutely definitely described it as an eternal kind of [torment; ASR says atonement]. It is a biblical teaching that should not be challenged so easily because you have no Bible basis if you want to challenge whether it's annihilation or whatever thought you may have. What we can accept is that that's what the Bible has said. At the same time, remember that when we talk about Hades, the most frightening thing is not just physical torment that the Taoists or Buddhists or Muslims or Hindus all have a similar concept of. It is the real absence of God. Not that God disappeared, but the absence of all the goodness of God.
    confidence: 0.82
    review_notes: ['Torment/atonement is an explicit ASR uncertainty. Comparative religious claims are attributed, not independently validated.']
  - id: p0719-common-grace
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-judgment
    start: 590.2
    end: 666.56
    type: sermon
    title: Everyday goodness and common grace
    summary: The preacher uses ordinary comforts and relationships to explain common grace and why he finds the loss of all goodness difficult to imagine.
    questions: ['How does the preacher illustrate common grace?']
    topics: [faith]
    scripture: []
    transcript: |
      Even after I preached to you, I kept thinking about what I said, and thinking deeply about what it means to have an absence of good. It's a very frightening thought, because all of us seated here and watching from cyberspace are under the common grace of God. [Biblical quotation about sunshine omitted; exact reference not stated.] Even the most evil person on earth today is enjoying the goodness of God. You enjoy a cold glass of water; that's good. You enjoy people who love you and people whom you love. Even the most evil person would do that, and it's good. You enjoy a cold glass of beer as you shout victory over the ruling party; that's a kind of goodness. Can you imagine not having any of these things? All goodness is associated with God, every single good. [Quotation attributed to James omitted; exact reference not stated.] Just on that point alone, it should send chills down your spine. It is not something you can actually understand because you are enjoying goodness even as I speak; you are sitting down very comfortably. Hell really is quite unimaginable. But whatever the case may be, remember that God is just.
    confidence: 0.85
    review_notes: ['No precise reference invented for the sunshine or James allusions.']
  - id: p0719-sins-omission
    video_id: Z-vRVB-WucA
    section_id: s0719-recap-judgment
    start: 666.56
    end: 745
    type: sermon
    title: Sins of commission and omission
    summary: The preacher distinguishes doing wrong from failing to do what one ought, and connects the rich man’s neglect of Lazarus with Matthew 25.
    questions: ['What does the preacher mean by a sin of omission?']
    topics: [responsibility, discipleship]
    scripture: ['Luke 16:19-31', 'Matthew 25']
    transcript: |
      He cannot be not just. While we may be challenged when it comes to the way we feel about such things, you need not worry that there will come a stage when you say, this is very unfair. It won't happen because God is just. [Biblical confession quotation omitted; exact citation not supplied.] That brought us to why the rich man suffered the way he did. [Repeated Luke 16 description omitted.] The way a lot of us do today. The answer is that there are different kinds of sins. Sins of commission are the sins you do when you should not have done it. Sins of omission are things that you should do but never do. The rich man saw Lazarus every single day and did nothing. This is consistent with the biblical teaching in Matthew 25. [Matthew 25 quotation and narrated exchange omitted; reference only.]
    confidence: 0.87
    review_notes: ['Matthew 25 is explicitly named; no unspoken verse range supplied.']
