sermon_description: Rev. Yong Teck Meng reads Luke 17 as a connected call to take faith seriously
  amid unavoidable trials and temptations. Drawing on the rich man’s neglect, delayed gratification
  and everyday choices, he argues that believing God’s Word helps people resist temptation and
  recognize the harm they can cause others. He urges listeners to put others’ faith ahead of
  personal rights and to practice restoration and forgiveness rather than become stumbling blocks.
