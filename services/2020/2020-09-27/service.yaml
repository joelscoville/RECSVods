    topics: [authority, discipleship]
    scripture: ['Luke 20:9-19']
    transcript: |
      At the same time there is a reflection of how the rejection of God's messenger is the same as us messing up our individual life despite the many, many warnings of God. [Parable retelling and embedded scripture quotations omitted; Luke 20:9-19.] It's a prophecy that Jesus Christ would be crucified and will die for us. [Further parable retelling omitted.] Because God will always love us, God will always care for us—how can it be that one day God will choose not to deal with us anymore? That's something that Jesus Christ would not agree with. [Cornerstone quotation/allusion omitted; Luke 20.] I ended the sermon by reminding you that God's attribute, God's existence, is a twin-track kind of idea.
    confidence: 0.82
    review_notes: ['Retelling contains extended scriptural speech; explicit omissions retain timing and prevent presenting a reconstructed reading.']
