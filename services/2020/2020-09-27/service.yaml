    transcript: |
      One of the other reasons why we will not meet next week is because a lot of our brothers and sisters are mobilized to support the convention from here. They need to go and man the AV and the Zoom and all that, because it's reaching out to so many places in the world. Especially for mainland China, there's always the challenge of the particular IP being blocked by the Chinese government. Then they have to do their thing to reroute and all that. So that's why it will be very strenuous to attempt a worship service at the same time. Again, next week we will not be here. We will be supporting this convention.
    confidence: 0.85
    review_notes: ['Network restrictions are the speaker’s account; no independent technical verification.']
  - id: p0927-religious-credentials
    video_id: W2IZ6MUX-Yk
    section_id: s0927-word
    start: 276.4
    end: 340.18
    type: sermon
    title: Recapping the dangers of religious credentials
    summary: The preacher reviews the previous lesson on Jesus’ authority and discusses dangers in organized religion and different church leadership structures.
    questions: ['What danger does the preacher associate with organized religion?']
    topics: [authority, discernment]
    scripture: ['Luke 20:1-19']
    transcript: |
      Let's continue with our preaching today in the middle part of Luke chapter 20. Let's review what was taught in the last lesson. The last lesson was about whether it's the carrot or the stick, because it started off with our Lord Jesus Christ being challenged on his authority. [Scriptural question omitted; Luke 20.] I spoke a little bit about the dangers of organized religion. I didn't know that this struck a chord. Quite a few people wrote to me and talked about it too, because they agree with the idea that sometimes organized religion, which is what we are, by the way, carries its own danger. You have authority, you have a degree, then you get to be on the pulpit in an organized faith. Some churches don't do that, for example the house churches or the brethren churches. [Unclear title wording omitted.] At max, they have elders. It is a rotational kind of leadership style. Every church has a different kind of setup.
    confidence: 0.86
    review_notes: ['300s recap slide identifies previous passage Luke 20:1-19 and previous title Carrot or Stick. Denominational descriptions remain attributed.']
  - id: p0927-word-authority
    video_id: W2IZ6MUX-Yk
    section_id: s0927-word
    start: 340.18
    end: 428.46
    type: sermon
    title: Scripture rather than credentials as the test of teaching
    summary: The preacher says teaching must be assessed by scripture rather than academic or institutional status, then recalls Jesus’ response to insincere challengers.
    questions: ['How should a teacher’s authority be assessed?', 'Why does the preacher contrast sincerity with religious status?']
    topics: [authority, discernment]
    scripture: ['Luke 20:1-19', 'Psalms 18:27']
    transcript: |
      Jesus was questioned about his authority, and the important thing for us to remember is that in the Reformed Evangelical movement we emphasize the supremacy of the Word of God. In this convention many of the speakers do that too. It is part of the Reformed understanding. We want you to understand that it is not about organized religion per se, but the authority at the end of the day for any one of us is the Word of God. I don't care whether you have ten PhDs or not. If you preach nonsense, then you preach nonsense. How do you know? The answer is the Word of God. Even if a person is not so-called officially recognized, so long as the person is operating upon the authority of the Word of God, then that should be the most important thing. [Recap of Jesus’ question about John and Psalm quotation omitted; Luke 20; displayed Psalms 18:27.] Our Lord Jesus Christ did not treat the Pharisees and the scribes with too much courtesy because they were deceptive people and hypocrites. One of the teachings is that if you are not sincere in your heart, then God will use strange methods or difficult methods to deal with you.
    confidence: 0.85
    review_notes: ['400s slide labels Psalm quotation 18:27, matching ASR; possible reference error retained for review, not silently corrected or quoted.']
  - id: p0927-vineyard-stewards
    video_id: W2IZ6MUX-Yk
    section_id: s0927-vineyard
    start: 428.46
    end: 486.54
    type: sermon
    title: The vineyard as a picture of accountable stewardship
    summary: The preacher retells the wicked-tenants illustration and interprets the vineyard as a reminder that people manage what belongs to God.
    questions: ['What stewardship lesson does the preacher draw from the vineyard?']
    topics: [stewardship]
    scripture: ['Luke 20:9-19', 'Isaiah 5']
    transcript: |
      Last week's lesson was really about the parable of the wicked tenants. [Biblical narrative retelling omitted; Luke 20:9-19.] From there, there are a lot of lessons to be learned, because this was from the song of vineyard taken from Isaiah chapter 5. One of the key lessons is that the vineyard represents the whole world. It is a reminder to us all that everything we have belongs to God. For us, we are living in this world; we are like the tenants who are supposed to manage the vineyard for God and then pay the dues and to be accountable to God Almighty. This is a fact that very, very—may I emphasize again—very, very few people understand.
    confidence: 0.85
    review_notes: ['Narrative omitted conservatively as scripture-related material; interpretation retained as the preacher’s analogy.']
  - id: p0927-generosity
    video_id: W2IZ6MUX-Yk
    section_id: s0927-vineyard
    start: 486.54
    end: 557.1
    type: sermon
    title: Chuck Feeney as an illustration of generosity
    summary: The preacher admires Chuck Feeney’s giving and contrasts large-scale philanthropy with Christians’ responsibility to regard wealth as entrusted rather than owned.
    questions: ['Why does the preacher bring up Chuck Feeney’s generosity?']
    topics: [stewardship]
    scripture: ['Luke 20:9-19']
    transcript: |
      I gave the example of Chuck Feeney, whom today I still continue to admire greatly. After the service we were discussing about this in my family. I've tried my best to find whether this guy is a Christian and all that. [Uncertain recollection about correspondence and another philanthropist’s parents omitted.] People like Bill Gates, Chuck Feeney, Warren Buffett, they are like the most generous persons in the history of mankind, and yet they are really honestly speaking not driven by any biblical kind of consideration. In a sense it puts us to shame. It also demonstrates that really very few people understand that what you have really doesn't belong to you. I think none understand more than Chuck Feeney, because he gave away eight billion dollars of his wealth, and finally he has two million left. Still a lot of money, but compared to eight billion, that's really crazy. This guy understood this, that the vineyard belongs to the Lord; it's not mine.
    confidence: 0.81
    review_notes: ['600s slide verifies Chuck Feeney spelling. Giving totals and religious identities are the preacher’s assertions, not independently established.']
  - id: p0927-creation-care
    video_id: W2IZ6MUX-Yk
    section_id: s0927-warning
    start: 557.1
    end: 616.84
    type: sermon
    title: Stewardship includes care for creation
    summary: The preacher connects rejection of God’s messengers with misuse of the world and explains why he calls environmental responsibility creation care.
    questions: ['Why does the preacher use the term creation care?']
    topics: [stewardship]
    scripture: ['Luke 20:9-19']
    transcript: |
      The rejection of all the messengers is an indication and a repeat of the history of the Jews, where they forever and ever go after the prophets and kill them. It's also a rejection of God's warning. From there we learn the lesson that indeed we are people who mess up the whole world, the vineyard. Creation care actually is a very important aspect of a Christian's life as well, and I'm involved in creation care ministry as well. In other words, environmental care. We put creation care to remind you that it's created by God. [Aside about terminology omitted.] We use the word creation care for Christians to understand that the world belongs to God and we are the stewards of the world, so don't mess up the world.
    confidence: 0.84
    review_notes: ['Broad historical characterization is preserved as the preacher’s interpretation, not an archive assertion about Jewish people.']
  - id: p0927-rejected-warning
    video_id: W2IZ6MUX-Yk
    section_id: s0927-warning
    start: 616.84
    end: 677.9
    type: sermon
    title: Ignoring warnings and presuming on God’s care
    summary: The preacher reads the rejected son and judgment in the parable as warnings against assuming that divine love makes accountability unnecessary.
