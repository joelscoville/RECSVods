    transcript: |
      Talking about that, I have a very important announcement I need to make. In the coming week, as you know, our global convention will begin October the first to six, and it's going to be completely via cyberspace. As of this morning, more than 17,000 people have registered for the global convention from 63 countries. [Unverified registration address omitted.] For the past many days, many, many people have been scrambling, including myself, to get ready for the convention. [Uncertain volunteer names omitted.] Translation work and all that stuff. Quite tough, because everything is moving very rapidly. This is like a six-day convention with speakers from all over the world, all very prominent speakers. All the sermons are going to be translated into three languages. [First language name unclear in ASR], Mandarin and English. The topics are great. I have translated, I think by now, about ten already, and learned a lot. When you translate you learn a lot from the speaker. I do encourage you to come on board, register and participate.
    confidence: 0.83
    review_notes: ['Attendance figures and arrangements are historical announcements, not current instructions or independently verified counts.']
  - id: p0927-next-sunday
    video_id: W2IZ6MUX-Yk
