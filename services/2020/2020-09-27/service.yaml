    questions: ['Why will the congregation not meet the following Sunday?']
    topics: [church-life]
    scripture: []
    transcript: |
      Because of this, next Sunday will be the fourth day of the convention. [Timetable phrase unclear.] The convention timetable is the same as our worship service. Therefore we will be supporting the convention instead of having our worship service. To put it simply, we will not meet next Sunday, and I encourage you to then latch on to the convention, where they will have Sunday worship service from Jakarta and senior pastor will be speaking. So one more time, next week we will not be meeting for one week to support the convention, and you are to then go online to watch the convention live from Jakarta. Please do continue to pray for this, because it is a very big deal.
    confidence: 0.86
    review_notes: ['Next Sunday is relative to the trusted 2020 service date, not the current week.']
  - id: p0927-online-reach
    video_id: W2IZ6MUX-Yk
    section_id: s0927-convention
    start: 178.5
    end: 241.64
    type: announcements
    title: Online ministry beyond geographical limits
    summary: The preacher contrasts the potential reach of online ministry with the capacity and logistics of physical conventions, while questioning how view counts should be interpreted.
    questions: ['What opportunities and uncertainties does the preacher see in online ministry?']
    topics: [church-life]
    scripture: []
    transcript: |
      Seventeen thousand; by next week I expect it to exceed twenty-over thousand people globally watching, these 63 countries. I didn't know there's so many countries who would tap into what we are watching. That's one of the flip sides of having cyberspace ministry, and it is the same with our preaching here as well. The highest hit rate for our sermons exceeded 630 people. I don't know whether they are real numbers or some guy just keeps pressing the button, or some kid somewhere is pressing a button. Whatever the case is, you see that cyberspace approach enables you to break out of the geographical kind of boundary. In the past all our big conventions in Jakarta can perhaps at max have six, seven thousand people because of the physical location. The amount of logistics involved in hosting so many people is just incredible. Now the work has shifted more to cyberspace, so all the cyberspace people are very busy.
    confidence: 0.85
    review_notes: []
  - id: p0927-convention-support
    video_id: W2IZ6MUX-Yk
    section_id: s0927-convention
