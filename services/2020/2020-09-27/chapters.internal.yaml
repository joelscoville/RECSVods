    summary: Rev. Yong Teck Meng greets the online congregation and asks participants to turn on their cameras.
    keywords: []
  - id: s0927-convention
    video_id: W2IZ6MUX-Yk
    start: 41.22
    end: 276.4
    type: announcements
    title: Online convention and next Sunday’s arrangements
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture: []
    topics:
      - church-life
    summary: The preacher encourages registration for the October 1–6 international online convention, describing translation work and local broadcast volunteers, and suspends next Sunday’s usual meeting in favor of its Jakarta worship service. He contrasts online reach with physical-event limits while questioning what view counts mean.
    keywords:
      - global convention
      - translation work
      - next sunday
  - id: s0927-word
    video_id: W2IZ6MUX-Yk
    start: 276.4
    end: 428.46
    type: sermon
    title: Recap — authority and organized religion
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - Luke 20:1-19
      - Psalms 18:27
    topics:
      - authority
      - discernment
    summary: The preacher revisits Jesus’ authority, dangers in organized religion and differing church leadership structures. He urges testing teaching by scripture rather than credentials or institutional status, recalling Jesus’ response to insincere challengers.
    keywords: []
  - id: s0927-vineyard
    video_id: W2IZ6MUX-Yk
    start: 428.46
    end: 557.1
    type: sermon
    title: Recap — stewardship and generosity
    speaker_id: yong-teck-meng
    confidence: 0.85
    scripture:
      - Luke 20:9-19
      - Isaiah 5
    topics:
      - stewardship
    summary: The preacher interprets the wicked tenants’ vineyard as a reminder that people manage what belongs to God. He admires Chuck Feeney’s giving and contrasts philanthropy with Christians’ responsibility to treat wealth as entrusted rather than owned.
    keywords:
      - vineyard
      - chuck feeney
  - id: s0927-warning
    video_id: W2IZ6MUX-Yk
    start: 557.1
    end: 721.58
    type: sermon
    title: Recap — creation care and taking warnings seriously
    speaker_id: yong-teck-meng
    confidence: 0.85
    scripture:
      - Luke 20:9-19
    topics:
      - stewardship
      - authority
      - discipleship
    summary: The preacher connects rejection of God’s messengers with misuse of the world and calls environmental responsibility creation care. He reads the rejected son and judgment as warnings against presuming on divine love, urging active faith that holds love and righteousness together.
    keywords:
      - creation
      - love and righteousness
  - id: s0927-opening-prayer
    video_id: W2IZ6MUX-Yk
    start: 721.58
    end: 768.72
    type: prayer
    title: Prayer for humble attention
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture: []
    topics:
      - prayer
    summary: The preacher prays that those present and online will listen with humility, set aside distractions and respond to God’s word.
    keywords: []
  - id: s0927-world-politics
    video_id: W2IZ6MUX-Yk
    start: 768.72
    end: 915.06
    type: sermon
    title: Politics in everyday life — America and the region
    speaker_id: yong-teck-meng
    confidence: 0.84
    scripture:
      - Luke 20:19-26
    topics:
      - politics
    summary: The preacher introduces the Caesar passage through the approaching 2020 American election and electoral habits. He cites South China Sea and Taiwan tensions as further examples of politics affecting neighboring societies.
    keywords: []
  - id: s0927-singapore
    video_id: W2IZ6MUX-Yk
    start: 915.06
    end: 1028.28
    type: sermon
    title: Singapore’s political culture
    speaker_id: yong-teck-meng
    confidence: 0.82
    scripture: []
    topics:
      - politics
      - discernment
    summary: The preacher compares Singapore’s election culture with more dramatic political environments through campaign symbols, technocratic leadership and public-speaking styles. He urges Christians to think carefully about political complexity.
    keywords:
      - singapore
      - election
  - id: s0927-with-politics
    video_id: W2IZ6MUX-Yk
    start: 1028.28
    end: 1255.28
    type: sermon
    title: The claim that God supports our politics
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - Psalms 109:8
    topics:
      - politics
      - discernment
      - authority
    summary: The preacher critiques claims of divine backing for nations or parties through church flags, patriotic worship and a campaign using Psalms 109:8 against President Obama. He presents liberation theology as another example and gives his account of the Catholic Church’s response.
    keywords:
      - patriotic
      - liberation theology
  - id: s0927-under-politics
    video_id: W2IZ6MUX-Yk
    start: 1255.28
    end: 1447.34
    type: sermon
    title: Treating religion as subordinate to political power
    speaker_id: yong-teck-meng
    confidence: 0.82
    scripture: []
    topics:
      - politics
      - authority
      - discernment
    summary: The preacher uses chess pieces and changing church-state power to criticize subordinating religion to rulers or other interests. He cites Facebook reports about religious symbols and an altered biblical story in China as illustrations of political control, not verified events.
    keywords:
      - chess
      - bishop
  - id: s0927-above-politics
    video_id: W2IZ6MUX-Yk
    start: 1447.34
    end: 1581.62
    type: sermon
    title: Does God’s supremacy excuse rejecting civil rules?
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture: []
    topics:
      - government
      - authority
      - discernment
    summary: The preacher discusses John MacArthur and appeals to God’s supremacy against public-health rules, explicitly calling his hypothetical mask refusal an illustration, not an instruction. He also describes Christian anarchist objections to taxes and civil rules, urging scripture as the test of competing approaches.
    keywords: []
  - id: s0927-spies
    video_id: W2IZ6MUX-Yk
    start: 1581.62
    end: 1720.38
    type: sermon
    title: Luke 20 — hostility and false sincerity
    speaker_id: yong-teck-meng
    confidence: 0.87
    scripture:
      - Luke 20:19-20
      - Matthew 13:24-26
    topics:
      - authority
      - discernment
    summary: The preacher connects the hostile leaders and deceptive spies in Luke 20:19-20 with abuse of religious power. Recalling pastoral encounters with apparent sincerity, he introduces Matthew 13’s weeds as a reason not to lose faith when religious appearances mislead.
    keywords:
      - luke 20
      - spies
      - weeds
  - id: s0927-weeds
    video_id: W2IZ6MUX-Yk
    start: 1720.38
    end: 1877.56
    type: sermon
    title: The weeds and the wheat — examine yourself
    speaker_id: yong-teck-meng
    confidence: 0.83
    review_notes:
      - ASR repeatedly confuses weed/wheat. Ambiguous clauses are omitted rather than reversed by guesswork.
    scripture:
      - Matthew 13:24-30
      - Matthew 13:27-30
    topics:
      - discernment
      - discipleship
    summary: The preacher uses the wheat-and-weeds image and a satire of church elections to warn that religious language and manners do not establish sincerity. After reading the rest of the parable, he cautions against surprise at church scandals and urges self-examination.
    keywords: []
  - id: s0927-tax-trap
    video_id: W2IZ6MUX-Yk
    start: 1877.56
    end: 1988.84
    type: sermon
    title: The tribute question as a trap
    speaker_id: yong-teck-meng
    confidence: 0.85
    scripture:
      - Luke 20:21-22
      - Luke 20:19-26
    topics:
      - government
      - authority
      - discernment
    summary: The preacher explains the tribute question’s religious framing and symbolism of Roman domination. He describes it as a trap designed to turn people against Jesus whichever answer he gave, reversing Jesus’ earlier question about John’s authority.
    keywords:
      - tribute
      - trap
      - roman
  - id: s0927-wise
    video_id: W2IZ6MUX-Yk
    start: 1988.84
    end: 2043.82
    type: sermon
    title: Discernment without gullibility
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - Matthew 22:18
      - Mark 12
      - Matthew 10:16
    topics:
      - discernment
    summary: The preacher connects Jesus’ discernment in the parallel accounts with Matthew 10:16, arguing that Christians should recognize deceptive appearances.
    keywords: []
  - id: s0927-denarius
    video_id: W2IZ6MUX-Yk
    start: 2043.82
    end: 2091.48
    type: sermon
    title: The denarius illustration
    speaker_id: yong-teck-meng
    confidence: 0.78
    review_notes:
      - Coin-person identification in ASR is historically questionable; no independent numismatic verification or silent correction.
    scripture:
      - Luke 20:24-25
    topics:
      - government
    summary: The preacher illustrates the coin in Jesus’ response, describing its image, material and irregular manufacture before returning to the answer about Caesar.
    keywords:
      - denarius
  - id: s0927-fairness
    video_id: W2IZ6MUX-Yk
    start: 2091.48
    end: 2190.52
    type: sermon
    title: Giving back and ordinary fairness
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture:
      - Luke 20:22-25
      - Luke 20:25
    topics:
      - government
      - justice
    summary: The preacher interprets Jesus’ answer as giving back fairly rather than turning ordinary obligations into religious disputes. He applies this to commerce, rejecting cheating or preferential dealing based simply on a seller’s Christian identity.
    keywords:
      - giving back
      - taxes
      - fairness
  - id: s0927-public-services
    video_id: W2IZ6MUX-Yk
    start: 2190.52
    end: 2284.22
    type: sermon
    title: Taxes sustain the people who sustain society
    speaker_id: yong-teck-meng
    confidence: 0.87
    scripture:
      - Luke 20:25
    topics:
      - government
      - justice
    summary: The preacher argues that Christians benefit from public safety and services provided by people of many beliefs, and that taxation fairly sustains that shared system.
    keywords:
      - taxes
  - id: s0927-romans-order
    video_id: W2IZ6MUX-Yk
    start: 2284.22
    end: 2431.08
    type: sermon
    title: Romans 13 — government and public order
    speaker_id: yong-teck-meng
    confidence: 0.9
    scripture:
      - Romans 13:1-7
      - 1 Peter 2
      - Romans 13:1
      - 1 Corinthians 14:33
    topics:
      - government
      - authority
      - discipleship
    summary: The preacher reads Romans 13 as recognizing civil authority even under a brutal Roman Empire because government maintains public order. He connects 1 Corinthians 14:33 with public administration and personal discipline, rejecting disorder as a Christian ideal.
    keywords:
      - romans 13
      - order
      - personal life
  - id: s0927-romans-conscience
    video_id: W2IZ6MUX-Yk
    start: 2431.08
    end: 2619.3
    type: sermon
    title: Romans 13 — civil responsibility and conscience
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture:
      - Romans 13:2-4
      - Romans 13:4-5
      - Romans 13:5-7
      - Romans 13:7
    topics:
      - government
      - authority
      - justice
      - discernment
    summary: The preacher says nonbelieving rulers may serve God’s purposes, recalling a senior pastor’s distinction about a destructive ruler, while rejecting political dissatisfaction as a blanket exemption from law. Applying Romans 13, he urges conscience beyond party loyalty and fair support for the system people benefit from rather than election excitement.
    keywords:
      - conscience
      - anti establishment
  - id: s0927-expectations
    video_id: W2IZ6MUX-Yk
    start: 2619.3
    end: 2698.44
    type: sermon
    title: The limits of idealizing political leaders
    speaker_id: yong-teck-meng
    confidence: 0.83
    scripture: []
    topics:
      - politics
      - discernment
    summary: The preacher discusses disappointment surrounding a Myanmar leader as a warning against assuming that a favored replacement can easily solve political problems, then calls for fair engagement.
    keywords: []
  - id: s0927-kuyper
    video_id: W2IZ6MUX-Yk
    start: 2698.44
    end: 2792.1
    type: sermon
    title: Abraham Kuyper and meaningful political engagement
    speaker_id: yong-teck-meng
    confidence: 0.87
    scripture: []
    topics:
      - politics
      - discipleship
    summary: The preacher urges meaningful Christian political engagement, presenting Abraham Kuyper’s theology, church involvement and political leadership as an example. He admires Kuyper’s varied abilities and describes his own effort to read him.
    keywords:
      - involved in politics
      - abraham kuyper
  - id: s0927-highest
    video_id: W2IZ6MUX-Yk
    start: 2792.1
    end: 2867.42
    type: sermon
    title: Civil obligations under God’s highest authority
    speaker_id: yong-teck-meng
    confidence: 0.89
    scripture:
      - Luke 20:24-26
    topics:
      - government
      - authority
    summary: Returning to Luke 20, the preacher argues that Jesus’ answer teaches fairness toward civil society while placing God above politicians and all other authorities.
    keywords: []
  - id: s0927-servant
    video_id: W2IZ6MUX-Yk
    start: 2867.42
    end: 2944.74
    type: sermon
    title: Learning confidence as a servant of God
    speaker_id: yong-teck-meng
    confidence: 0.84
    scripture: []
    topics:
      - authority
      - discipleship
    summary: The preacher recalls working with his senior pastor and says confidence in serving Christ should prevent servility toward wealthy or powerful people.
    keywords: []
  - id: s0927-commission
    video_id: W2IZ6MUX-Yk
    start: 2944.74
    end: 3073.92
    type: sermon
    title: Christ’s authority and the Great Commission
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - Matthew 28:18-20
    topics:
      - authority
      - discipleship
    summary: The preacher links the Great Commission to Christ’s authority, urging changed lives and influence in the world rather than arrogance. He uses a hypothetical national leader’s visit to question excessive nervousness or deference when Christians represent Christ.
    keywords: []
  - id: s0927-apathy
    video_id: W2IZ6MUX-Yk
    start: 3073.92
    end: 3148.38
    type: sermon
    title: Apathy and ignorance are not options
    speaker_id: yong-teck-meng
    confidence: 0.86
    scripture:
      - Matthew 28:18-20
    topics:
      - discipleship
      - politics
      - government
    summary: The preacher rejects both apathy and chosen ignorance, urging Christians to understand public obligations and take an active, informed role in society.
    keywords:
      - apathy
  - id: s0927-sellout
    video_id: W2IZ6MUX-Yk
    start: 3148.38
    end: 3373.56
    type: sermon
    title: Caution about political alliances and endorsements
    speaker_id: yong-teck-meng
    confidence: 0.83
    scripture: []
    topics:
      - politics
      - discernment
    summary: The preacher warns against compromising the church through political alliances, citing relationships with Hitler and Philippine leaders as cautionary examples. Discussing evangelical prayer for American candidates, he warns that prayer is not proof of divine endorsement and that endorsements can damage Christian witness.
    keywords: []
  - id: s0927-spheres
    video_id: W2IZ6MUX-Yk
    start: 3373.56
    end: 3497.22
    type: sermon
    title: Distinct responsibilities of church, state and education
    speaker_id: yong-teck-meng
    confidence: 0.83
    scripture: []
    topics:
      - authority
      - politics
      - discernment
    summary: The preacher applies a quotation attributed to Abraham Kuyper to the distinct responsibilities of church, state and education. He illustrates confused institutional boundaries with an account of purchasable academic credentials, arguing against making education solely a business.
    keywords: []
  - id: s0927-distance
    video_id: W2IZ6MUX-Yk
    start: 3497.22
    end: 3544
    type: sermon
    title: Institutional distance is not permanent silence
    speaker_id: yong-teck-meng
    confidence: 0.88
    scripture: []
    topics:
      - government
      - politics
      - discernment
    summary: The preacher distinguishes private political activity from endorsements in the church’s name. He recommends an arm’s-length institutional relationship while allowing that grave evil may require church action.
    keywords:
      - evil
  - id: s0927-bonhoeffer
    video_id: W2IZ6MUX-Yk
    start: 3544
    end: 3658.5
    type: sermon
    title: Bonhoeffer as an example of resisting grave evil
    speaker_id: yong-teck-meng
    confidence: 0.82
    scripture:
      - Luke 20:25
    topics:
      - government
      - justice
      - discipleship
    summary: The preacher recounts Dietrich Bonhoeffer’s theology, resistance to Nazism and death as an example of exceptional action against grave evil. He expresses admiration and introduces the conclusion with an attributed quotation about silence and evil.
    keywords:
      - bonhoeffer
      - face of evil
      - silence
  - id: s0927-conclusion
    video_id: W2IZ6MUX-Yk
    start: 3658.5
    end: 3820.34
    type: sermon
    title: Civil responsibility, allegiance and the need for wisdom
    speaker_id: yong-teck-meng
    confidence: 0.9
    scripture:
      - Luke 20:19-26
      - Romans 13:1-7
      - Luke 20:25
    topics:
      - government
      - authority
      - discipleship
      - justice
      - discernment
    summary: The preacher urges fair taxation and civil obedience in support of public order while keeping highest allegiance to God, allowing that severe wrongdoing may require action. He calls for scripturally guided, active service to Christ and careful discernment rather than apathy, automatic partisanship or destructive reactions.
    keywords:
      - highest allegiance
  - id: s0927-closing-prayer
    video_id: W2IZ6MUX-Yk
    start: 3820.34
    end: 3906.8154375
    type: prayer
    title: Prayer for wise and active lives
    speaker_id: yong-teck-meng
    confidence: 0.86
    review_notes:
      - Prayer onset is an approximate cut within a mixed ASR segment. Creed slide is visible before the prayer ends; no creed speech is supplied.
    scripture:
      - Matthew 28:18-20
    topics:
      - prayer
      - government
      - justice
      - discipleship
    summary: The preacher thanks God for teaching about politics and secular government, praying for truthful, honorable lives. He asks for wisdom in responding to perceived injustice in government or society and prays against passive inaction.
    keywords:
      - truthful
      - wisdom
