recordingTitle: Out of the World
serviceDate: 2025-11-23
status: draft
sermonDescription: Jesus' claim to be from above exposes the distance between divine reality and fallen human assumptions. His warning that the opportunity to respond will end introduces urgency. Quantitative success is distinguished from essential worth through education, possessions, natural beauty and AI-generated worship. Salvation is grounded in belonging to the great I Am rather than balancing deeds, while Christ's faithful life and John's testimony invite personal knowledge, transformed fellowship and fuller joy.
sermonScripture:
  - John 8:21-30
  - Matthew 6:28-29
  - 1 John 1:1-4
sermonTopics:
  - knowing-god
  - discernment
  - salvation
