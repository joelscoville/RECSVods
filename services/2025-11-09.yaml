recordingTitle: To Be a Holy Servant
serviceDate: 2025-11-09
status: draft
sermonDescription: A replay of Stephen Tong's preaching in Seoul calls gospel messengers to holiness, repentance and single-hearted service. God's kingdom and witness to Christ's death and resurrection are distinguished from institutional or national agendas. Yong applies the message to every believer rather than clergy alone. Baptism, membership and Communion then express belonging to Christ and a community responsible for mutual care, while warning that outward participation is not automatic salvation.
sermonScripture:
  - 1 Peter 1:13-16
  - Romans 12:1-21
  - 2 Timothy 2:21
sermonTopics:
  - sanctification
  - repentance
  - service
