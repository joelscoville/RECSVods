recordingTitle: The First of Seven
serviceDate: 2025-08-17
status: draft
sermonDescription: Jesus' first I Am declaration redirects the crowd from seeking gifts toward receiving the giver. Enduring life is distinguished from temporary benefits and a merit-based exchange with God. The manna account reveals dependence on God's word within hunger and testing. Christ is the bread himself rather than merely a source of solutions, while human glory can obstruct belief. His promise to keep those given by the Father grounds assurance beyond personal achievement and asks what listeners actually believe.
sermonScripture:
  - John 6:22-40
  - Deuteronomy 8:1-3
  - Ephesians 2:8-9
sermonTopics:
  - faith
  - salvation
  - eternal-life
