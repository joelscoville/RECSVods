recordingTitle: The Christ
serviceDate: 2025-10-12
status: draft
sermonDescription: Christ means God's anointed one, not a surname or merely a familiar human teacher. The preacher contrasts prevailing expectations of the Messiah with Jesus' revelation of his origin and divine identity. Biblical friendship and love are held alongside reverence for the Lord rather than making God contingent on human calculation. Colossians affirms Christ's preeminence, while signs, costly witnesses and ordinary conduct encourage persevering faith despite mockery and call listeners to recognize Jesus as God, Savior and Lord.
sermonScripture:
  - John 7:25-36
  - Colossians 1:15-20
  - Hebrews 12:1
sermonTopics:
  - knowing-god
  - faith
  - persecution
