      - pointTime: "21:50.04"
        pointText: Patrick connects living water with a thirst for meaning and joy that earthly pleasures cannot finally satisfy.
      - pointTime: "25:26.2"
        pointText: The ensemble's introduction presents music and art as a way of exploring feeling and preparing to receive God's word.
      - pointTime: "30:49.16"
