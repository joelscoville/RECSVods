  - chapterId: c20251012-shared-anniversary
    chapterTitle: Use Our Limited Time in a Shared Journey of Faith
    chapterKind: other
    chapterStart: "31:56.05"
    chapterEnd: "39:20.46"
    points:
      - pointTime: "34:01.02"
        pointText: The service's anniversary prompts reflection on finite time and choosing what is worth doing.
      - pointTime: "35:57.54"
        pointText: Encountering Christians under pressure challenges advice offered from comfortable circumstances without comparable experience.
      - pointTime: "37:39.42"
        pointText: Connection with other believers can bring prayer, care and support to people facing difficulty rather than leaving them isolated.
  - chapterId: c20251012-training-recap
    chapterTitle: Education Is a Tool, and Truth Is the Standard
    chapterKind: sermon
    chapterStart: "39:20.46"
    chapterEnd: "48:26.5"
    chapterScripture:
      - John 7:14-24
    points:
      - pointTime: "40:23.54"
        pointText: The recap asks whether formal qualifications establish the right to speak or success in a rapidly changing field.
      - pointTime: "42:42.86"
        pointText: Formal theological training is valued as a way of learning what one does not yet understand.
      - pointTime: "45:34.32"
        pointText: Education is distinguished from the task it serves, avoiding both worship of credentials and dismissal of useful training.
      - pointTime: "46:08.1"
        pointText: A teacher's claim must be evaluated through truth rather than accepted or rejected by academic status alone.
  - chapterId: c20251012-anointed-one
    chapterTitle: Recognize Jesus as God's Anointed One
    chapterKind: sermon
    chapterStart: "48:26.5"
    chapterEnd: "1:01:20.5"
    chapterScripture:
      - John 7:25-27
      - Malachi 3:1
    points:
      - pointTime: "50:34.48"
        pointText: The sermon title introduces how existing knowledge and expectations can obstruct recognizing the Christ.
      - pointTime: "51:30.84"
        pointText: Christ and Messiah identify the anointed one rather than Jesus' surname or a generic label for savior.
      - pointTime: "52:52.68"
        pointText: The distinction matters because Jesus Christ asserts God's chosen deliverer rather than merely another historical person.
      - pointTime: "56:15.16"
        pointText: Political, military and human expectations are contrasted with the identity Jesus actually reveals.
      - pointTime: "59:59.54"
        pointText: Human-shaped assumptions about the divine are identified as a recurring obstacle beyond the original crowd.
  - chapterId: c20251012-human-calculation
    chapterTitle: Christ's Love Does Not Make Him Subject to Our Calculations
    chapterKind: sermon
    chapterStart: "1:01:20.5"
    chapterEnd: "1:13:29.45"
    chapterScripture:
      - John 13:34
      - John 15:15
      - Hebrews 2:11
    points:
      - pointTime: "1:03:06.46"
        pointText: Beloved of God is presented as a believer's fundamental identity.
      - pointTime: "1:03:21.12"
        pointText: Biblical friendship and brotherhood explain genuine closeness to Christ without settling the full question of his identity.
      - pointTime: "1:09:03.68"
        pointText: Pascal's wager introduces an approach that calculates potential gains and losses from belief.
      - pointTime: "1:12:07.2"
        pointText: The preacher critiques a human-centered approach that treats the believer as in control of God's existence or relevance.
  - chapterId: c20251012-divine-lord
    chapterTitle: Receive Christ as God, Savior and Lord
    chapterKind: sermon
    chapterStart: "1:13:29.45"
    chapterEnd: "1:21:49.24"
    chapterScripture:
      - John 7:28-31
      - Isaiah 55:8-9
      - Colossians 1:15-20
    points:
      - pointTime: "1:14:01.16"
        pointText: Christ is not made contingent on human reasoning, preference or permission.
      - pointTime: "1:14:58.7"
        pointText: God's higher ways preserve a distinction that remains even when Christ calls people friends or brothers.
      - pointTime: "1:16:44.92"
        pointText: Colossians connects Christ's preeminence with creation, the church and reconciliation through his cross.
      - pointTime: "1:20:00.76"
        pointText: Universal unworthiness is held alongside the call to pursue holy living, rather than making imperfection an excuse.
      - pointTime: "1:21:25.22"
        pointText: People still believe through Christ's signs despite opposition from established authorities.
  - chapterId: c20251012-witness-mockery
    chapterTitle: Draw Strength from Witnesses and Persevere through Mockery
    chapterKind: sermon
    chapterStart: "1:21:49.24"
    chapterEnd: "1:33:52.74"
    chapterScripture:
      - Hebrews 12:1
      - 1 Corinthians 1:18-19
    points:
      - pointTime: "1:22:26.48"
        pointText: A cloud of witnesses supports shared faith through concrete signs of God's work in other lives.
      - pointTime: "1:25:17.12"
        pointText: Returning to costly missionary service illustrates faith that exceeds ordinary self-protective expectations.
      - pointTime: "1:28:08.2"
        pointText: Hebrews calls believers to lay aside weights and sin and run with endurance.
      - pointTime: "1:29:10.42"
        pointText: Ordinary dealings with neighbors, colleagues and family may be another person's only encounter with biblical faith.
      - pointTime: "1:32:24.4"
        pointText: The cross being seen as folly is distinguished from its power for those who receive it.
  - chapterId: c20251012-response
    chapterTitle: Response and Closing
    chapterKind: closing
    chapterStart: "1:33:52.74"
    chapterEnd: "1:51:01.317"
    chapterScripture:
      - Romans 16:25-27
    points:
      - pointTime: "1:33:52.94"
        pointText: Response prayer asks for correction of human measures of God and renewed commitment to Christ as Lord.
      - pointTime: "1:35:22.48"
        pointText: The congregation recites the Apostles' Creed before pastoral prayer.
      - pointTime: "1:39:06.7"
        pointText: Anniversary prayer joins gratitude for the past with a desire for Christ's presence to remain real in daily life.
      - pointTime: "1:39:58.6"
        pointText: The offertory follows pastoral prayer, with second-offering instructions.
      - pointTime: "1:41:34.58"
        pointText: Send the Light is introduced as the closing hymn.
      - pointTime: "1:43:57.64"
        pointText: Doxology is followed by the blessing from Romans 16:25-27.
      - pointTime: "1:45:18.18"
        pointText: The church-anniversary cake presentation precedes the final announcements.
      - pointTime: "1:50:51.1"
        pointText: Dismissal follows the notices, with silent meditation.
