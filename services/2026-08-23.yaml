        points:
          - pointTime: "51:37.04"
            pointText: Pastor Yong presents a common interpretation of John 16:16, describes Jesus recognizing
              anxiety through discernment or supernatural knowledge, and acknowledges the difficulty
              of trusting God's care.
          - pointTime: "52:58.8"
            pointText: Seeing Jesus again is connected with resurrection and the coming of the Spirit.
          - pointTime: "54:04.26"
            pointText: The disciples' expectation of an earthly kingdom is contrasted with Jesus' warning about his departure.
          - pointTime: "56:43.76"
            pointText: The preacher recalls 1 Peter 5:7 as encouragement to bring anxiety before God.
          - pointTime: "59:31.36"
            pointText: Faith in God's promises is encouraged when circumstances make trust difficult.
