  - chapterId: c20260823-joyful-service-amid-suffering
    chapterTitle: Serving With Joy While Awaiting Restoration
    chapterKind: sermon
    chapterStart: "1:13:43.34"
    chapterEnd: "1:32:38.06"
    points:
      - pointTime: "1:13:43.34"
        pointText: Pastor Yong uses Romans 8 to acknowledge continuing suffering and urges patient hope and
          fulfilment in serving Christ, distinguishing joy from manufactured enthusiasm while
          allowing periods of despair.
      - pointTime: "1:15:22.3"
        pointText: Romans 8 explains continuing trouble through the already-and-not-yet framework.
      - pointTime: "1:19:14.12"
        pointText: Christians are not exempt from suffering and are called to patient hope.
      - pointTime: "1:25:42.28"
        pointText: Joy as fruit of the Spirit is discussed without denying periods of despair.
      - pointTime: "1:30:06.14"
        pointText: Third Millennium's support for pastors illustrates joy in participating in Christian service.
