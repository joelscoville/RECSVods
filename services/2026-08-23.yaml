  - chapterId: c20260823-sorrow-to-joy
    chapterTitle: Sorrow Gives Way to Promised Joy
    chapterKind: sermon
    chapterStart: "1:00:26.08"
    chapterEnd: "1:07:48.5"
    points:
      - pointTime: "1:00:26.08"
        pointText: Pastor Yong uses Jesus' childbirth illustration and family memories to discuss sorrow
          before promised joy, acknowledging his lack of maternal experience and cautioning against
          minimizing pain.
      - pointTime: "1:02:10.44"
        pointText: Jesus' childbirth illustration gives a place to lamentation before joy.
      - pointTime: "1:03:33.12"
        pointText: A family recollection cautions men against minimizing a mother's childbirth experience.
      - pointTime: "1:05:54.72"
        pointText: Memories of childhood illness are set beside the lasting joy of family life.
      - pointTime: "1:07:01.74"
        pointText: John 16:22 returns attention to the disciples' shock at the crucifixion.
