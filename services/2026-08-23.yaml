  - chapterId: c20260823-christian-citizenship
    chapterTitle: Christian Allegiance and Civic Responsibility
    chapterKind: qa
    chapterStart: "35:02.12"
    chapterEnd: "45:29.62"
    points:
      - pointTime: "35:02.12"
        pointText: Answering a National Day follow-up, Pastor Yong urges civic participation under
          allegiance to God's kingdom, using political examples to distinguish discerning
          citizenship from partisan trust or pulpit mobilization.
      - pointTime: "36:11.9"
        pointText: Belonging to God's kingdom is the Christian's primary identity.
      - pointTime: "39:41.82"
        pointText: Taxes, voting and conscientious work are named as civic responsibilities.
      - pointTime: "41:05.18"
        pointText: Political participation is paired with skepticism about imperfect leaders.
      - pointTime: "44:25.98"
        pointText: The pulpit should teach justice and moral principles while leaving individual political choices to citizens.
  - chapterId: c20260823-trust-christs-care
    chapterTitle: Trusting Christ's Care in Uncertainty
    chapterKind: sermon
    chapterStart: "45:30.08"
    chapterEnd: "1:00:25.88"
    points:
      - pointTime: "45:30.08"
        pointText: Revisiting the Farewell Discourse and the Spirit's presence, Pastor Yong interprets the
          disciples' confusion in light of Christ's death and resurrection and urges trust despite
          loneliness and anxiety.
      - pointTime: "46:52.64"
        pointText: The Spirit's indwelling is presented as assurance that believers are not truly alone.
      - pointTime: "51:37.04"
        pointText: The disciples' confusion in John 16:16 is considered in relation to Jesus' death and resurrection.
      - pointTime: "55:29.4"
        pointText: Jesus takes the initiative to address his disciples' anxiety.
      - pointTime: "59:31.36"
        pointText: Trusting God's care can feel difficult, yet listeners are urged to rely on his promises.
    subchapters:
