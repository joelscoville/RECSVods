  - chapterId: c20260823-prayer-for-christs-purposes
    chapterTitle: Ask the Father for Christ's Purposes
    chapterKind: sermon
    chapterStart: "1:07:48.68"
    chapterEnd: "1:13:42.02"
    points:
      - pointTime: "1:07:48.68"
        pointText: Pastor Yong interprets asking in Jesus' name as seeking Christ's purposes, treasuring
          access to the Father through Christ's death and the Spirit rather than treating prayer as
          a formula for personal gain.
      - pointTime: "1:09:09.2"
        pointText: The preacher contrasts direct access to God with religious intermediaries before turning to Hebrews 10.
      - pointTime: "1:10:21.58"
        pointText: Prayer is not to be taken for granted because access to the Father came through Christ's death.
      - pointTime: "1:11:50.74"
        pointText: Christ's work and the Spirit's presence are connected with access to the Father.
      - pointTime: "1:12:56.94"
        pointText: Present readers have the biblical account that the confused disciples did not yet possess.
