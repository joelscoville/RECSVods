  - chapterId: c20260719-scripture-directed-faith
    chapterTitle: Scripture Challenges Self-Directed Faith
    chapterKind: sermon
    chapterStart: "36:42"
    chapterEnd: "54:45"
    points:
      - pointTime: "36:42"
        pointText: Recalling dependence on the true vine and praying for humility, the preacher questions
          transactional friendship and religious self-selection, urging Scripture rather than
          inherited culture or status to govern belief and conduct.
      - pointTime: "38:06.46"
        pointText: Dependence on Christ includes relationships with believers and accepting pruning.
      - pointTime: "43:01.28"
        pointText: A child paying classmates to become friends illustrates transactional relationships.
      - pointTime: "48:31.06"
        pointText: Worship conventions and clothing are considered as inherited forms rather than unquestionable prescriptions.
      - pointTime: "53:59"
        pointText: Scripture should direct choices instead of background, ethnicity or personal philosophy.
    subchapters:
      - chapterId: s20260719-difficulties
        chapterTitle: Why Does Friendship Involve Commandments?
        chapterKind: sermon
        chapterStart: "41:30"
        chapterEnd: "47:22"
        points:
          - pointTime: "41:30"
            pointText: The preacher uses transactional friendship stories to explore the difficulty of love
              linked with obedience and divine choosing rather than personal religious selection.
          - pointTime: "43:01.28"
            pointText: Buying classmates' friendship illustrates a transactional understanding of relationship.
          - pointTime: "44:05.98"
            pointText: A lending and repayment story continues the contrast between transaction and friendship.
          - pointTime: "45:03.2"
            pointText: Divine choosing is contrasted with assuming that faith is entirely a personal selection.
          - pointTime: "46:21.14"
            pointText: Mixed religious practices illustrate an approach in which the worshipper remains in control.
        chapterScripture:
          - John 15:12-17
          - John 14:15
          - John 15:16
