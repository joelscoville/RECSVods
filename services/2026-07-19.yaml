  - chapterId: c20260719-charitable-discernment
    chapterTitle: Doing Good with Discernment
    chapterKind: qa
    chapterStart: "26:36"
    chapterEnd: "36:42"
    points:
      - pointTime: "26:36"
        pointText: Following his welcome and invitation to questions, the preacher urges discerning,
          accountable charitable action rather than paralysis over exploitation, drawing on his
          welfare views and an unverified crime anecdote.
      - pointTime: "28:40"
        pointText: A question about exploitation when helping others introduces the need for wisdom.
      - pointTime: "29:51.18"
        pointText: Matthew 10 is used to balance gentleness with discernment and accountability.
      - pointTime: "34:10.18"
        pointText: Sustained involvement with a monitored charitable group is recommended.
      - pointTime: "35:35.94"
        pointText: James 2:17 calls listeners to act rather than discuss charitable work endlessly.
