    points:
      - pointTime: "1:19:59"
        pointText: Humbled by a remembered prayer partner’s challenge, the preacher presents Christ’s
          self-giving love as the basis for friendship and obedience, applying it to everyday
          relationships and praying for changed responses under pressure.
    subchapters:
      - chapterId: s20260719-greatest-love
        chapterTitle: Love Shapes Everyday Relationships
        chapterKind: sermon
        chapterStart: "1:23:14"
        chapterEnd: "1:27:55.44"
        points:
          - pointTime: "1:23:14"
            pointText: Returning to John 15 and 1 Corinthians 13, the preacher connects the cross with
              friendship and commands, urging love for Christ to reshape responses to family,
              colleagues and friends.
