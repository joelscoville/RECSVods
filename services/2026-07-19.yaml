        points:
          - pointTime: "1:07:53"
            pointText: Presenting MacArthur’s argument, the preacher says servant softens doulos and contrasts
              slavery with voluntary bondservice as a way of understanding belonging to Christ.
        chapterScripture:
          - John 15:15
