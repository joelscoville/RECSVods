  - chapterId: c20260719-glory-joy-in-christ
    chapterTitle: True Glory and Joy Depend on Christ
    chapterKind: sermon
    chapterStart: "54:45"
    chapterEnd: "1:05:37.42"
    points:
      - pointTime: "54:45.08"
        pointText: Through disputed sporting examples and a hypothetical purchased team, the preacher argues
          that glory requires truth and goodness, connecting dependence on Christ with full joy
          rather than religion used for personal benefit.
      - pointTime: "56:16.36"
        pointText: Sporting ambition introduces a question about authentic achievement.
      - pointTime: "58:46.2"
        pointText: A hypothetical purchased national team contrasts eligibility with meaningful shared achievement.
      - pointTime: "1:01:58.34"
        pointText: A wordplay on Christian stresses dependence on Christ instead of self-directed identity.
      - pointTime: "1:02:59"
        pointText: Fullness of joy is contrasted with using religion as a small source of comfort.
    chapterScripture:
      - John 15:5
      - John 15:11
  - chapterId: c20260719-freedom-in-belonging
    chapterTitle: Belonging to a Perfect Master Brings Freedom
    chapterKind: sermon
    chapterStart: "1:05:37.42"
    chapterEnd: "1:19:58.5"
    points:
      - pointTime: "1:05:37.42"
        pointText: Drawing on redemption, divine choosing and MacArthur’s account of doulos, the preacher
          locates freedom in belonging to a perfectly good God, distinguishing this from racist
          enslavement and the use of marital submission to excuse bullying.
      - pointTime: "1:06:44.98"
        pointText: Galatians 2:20 contrasts belonging to Christ with complete self-ownership.
      - pointTime: "1:13:24.46"
        pointText: Ephesians 1:3-5 connects divine choosing with belonging to Christ.
      - pointTime: "1:15:54.44"
        pointText: The preacher condemns racist uses of Scripture to justify historical enslavement.
      - pointTime: "1:18:22.56"
        pointText: A husband's appeal to submission is challenged by the corresponding demand for self-giving love.
    subchapters:
      - chapterId: s20260719-doulos
        chapterTitle: Doulos Challenges Voluntary Service
        chapterKind: sermon
        chapterStart: "1:07:53"
        chapterEnd: "1:12:21.35"
        points:
          - pointTime: "1:07:53"
            pointText: Presenting MacArthur’s argument, the preacher says servant softens doulos and contrasts
              slavery with voluntary bondservice as a way of understanding belonging to Christ.
          - pointTime: "1:09:01.56"
            pointText: Roman slavery and early Christian communities provide context for the preacher's translation argument.
          - pointTime: "1:10:09.26"
            pointText: MacArthur's book is introduced as the source of the claim that translators softened slavery language.
          - pointTime: "1:10:57.9"
            pointText: Slave and voluntary bondservant are contrasted before the paradox of freedom in Christ.
        chapterScripture:
          - John 15:15
    chapterScripture:
      - 1 Corinthians 6:19-20
      - Galatians 2:20
      - John 15:15
      - John 15:15-16
      - Ephesians 1:3-5
  - chapterId: c20260719-love-shaped-obedience
    chapterTitle: Christ’s Love Calls for Obedience
    chapterKind: sermon
    chapterStart: "1:19:58.5"
    chapterEnd: "1:29:16.8"
    points:
      - pointTime: "1:19:58.82"
        pointText: Humbled by a remembered prayer partner’s challenge, the preacher presents Christ’s
          self-giving love as the basis for friendship and obedience, applying it to everyday
          relationships and praying for changed responses under pressure.
      - pointTime: "1:21:10"
        pointText: The preacher admits being humbled by a prayer partner he had initially judged by appearance.
      - pointTime: "1:22:15.26"
        pointText: Calling Jesus Lord is examined alongside everyday refusals of his direction.
      - pointTime: "1:24:28"
        pointText: John 15 connects the cross, commands and friendship with Christ.
      - pointTime: "1:26:48.1"
        pointText: Love for Christ is applied to responses toward spouses, relatives, colleagues and friends.
    subchapters:
      - chapterId: s20260719-greatest-love
        chapterTitle: Love Shapes Everyday Relationships
        chapterKind: sermon
        chapterStart: "1:23:14"
        chapterEnd: "1:27:55.44"
        points:
          - pointTime: "1:23:14"
            pointText: Returning to John 15 and 1 Corinthians 13, the preacher connects the cross with
              friendship and commands, urging love for Christ to reshape responses to family,
              colleagues and friends.
          - pointTime: "1:24:28"
            pointText: Christ's self-giving love provides the framework for understanding friendship and commands.
          - pointTime: "1:26:04.62"
            pointText: The cross reminds Christians that received love is to be shared with others.
          - pointTime: "1:26:48.1"
            pointText: Everyday relationships are opportunities to respond in love rather than revert to old habits.
        chapterScripture:
          - 1 Corinthians 13:13
          - John 15:12-17
    chapterScripture:
      - 1 Corinthians 13:13
      - John 15:12-17
