recordingTitle: One Flock, One Shepherd
serviceDate: 2026-02-22
status: draft
sermonDescription: The preacher reads John 10 as a declaration that Christ's people belong to one flock led by one shepherd. His goodness is expressed in laying down his life, unlike leadership driven by transaction or self-interest. Knowing the shepherd involves intimate relationship rather than head knowledge alone. Belonging to God, not success or popularity, grounds identity and calls believers to faithful service despite disagreement and obstacles around them.
sermonScripture:
  - John 10:11-21
  - Matthew 9:35-38
  - 2 Timothy 1:12
sermonTopics:
  - knowing-god
  - service
  - faith
