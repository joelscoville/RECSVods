      - pointTime: "1:18:00.02"
        pointText: One flock and one shepherd identify faith as belonging rather than a consumer choice of religion.
      - pointTime: "1:23:45.12"
        pointText: The universal church is distinguished from confining God's people to one's own denomination.
      - pointTime: "1:28:52.04"
        pointText: Christ's compassion for helpless people is connected with the call for more laborers.
      - pointTime: "1:30:33.36"
        pointText: Christ's authority over laying down and taking up his life grounds the flock's salvation.
