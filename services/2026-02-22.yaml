    chapterEnd: "1:14:13.42"
    chapterScripture:
      - John 10:12-13
    points:
      - pointTime: "1:00:45.16"
        pointText: The hired hand is contrasted with the shepherd who cares for the sheep.
      - pointTime: "1:02:02.3"
        pointText: A payslip recollection illustrates loyalty that depends on payment.
      - pointTime: "1:05:29.98"
        pointText: Retrenchment challenges corporate language about being a family.
      - pointTime: "1:07:15.28"
        pointText: Pastoral recruitment questions introduce concern about employment terms displacing care for a congregation.
      - pointTime: "1:10:37.64"
